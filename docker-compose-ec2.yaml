# MayaTrail step1 — enterprise stack
# Services: PostgreSQL, Redis, Django backend, Celery enterprise worker,
#           Celery Beat scheduler, Scout attack-graph engine, React UI,
#           Edge nginx proxy.
#
# Every host-specific value comes from an untracked .env beside this file, so a
# deploy never edits a tracked file and git pull never conflicts on the host.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in SECRET_KEY & AWS creds
#   cp .env.example .env                   # fill in POSTGRES_HOST, POSTGRES_PASSWORD, SCOUT_SERVICE_TOKEN
#   docker compose -f docker-compose-ec2.yaml up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env (the db instance private IP)}
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      EMULATIONS_BASE_DIR: /opt/emulations
    ports:
      - "8000:8000"
    volumes:
      # Mount emulations package so the API registry can discover packages.
      - ./emulations:/opt/emulations:ro
    depends_on: # waits for db and redis to be healthy before starting backend.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",8000),2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    # Migrations are committed to the repo, never generated at boot. A boot-time
    # makemigrations regenerated 0001_initial on every start; because the database
    # already recorded that name as applied, a later migrate became a no-op and a
    # new model or field silently never reached the schema. Only migrate runs here.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  # Enterprise worker — handles emulation deploy/attack/destroy tasks.
  # Runs against the user's own AWS account via STS AssumeRole.
  # No Docker socket required — Pulumi Automation API runs in-process.
  worker_enterprise:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env (the db instance private IP)}
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      STATE_BUCKET: mayatrail-state-bucket
      STATE_BUCKET_REGION: ap-south-1
      # Base directory where emulation packages are mounted.
      # Infra programs are resolved as {EMULATIONS_BASE_DIR}/{type}/infra/
      EMULATIONS_BASE_DIR: /opt/emulations
      # Attack graph scans run in the scout container; the token is shared
      # with it through the project .env.
      SCOUT_SERVICE_URL: http://scout:8080
      SCOUT_SERVICE_TOKEN: ${SCOUT_SERVICE_TOKEN:?set SCOUT_SERVICE_TOKEN in .env (see .env.example)}
    volumes:
      # Emulation packages: attack scripts and per-emulation infra/ programs.
      - ./emulations:/opt/emulations:ro
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config worker --queues=enterprise --concurrency=4 --loglevel=info

  # Scout attack-graph engine (MayaTrail/scout), run as its own container and
  # pinned to a released image. The worker sends it scans over this network;
  # it publishes no port. It gets only its token, never backend/.env: it
  # receives a tenant's temporary credentials and has no use for MayaTrail's.
  # Pulling the image needs `docker login ghcr.io` once on the host.
  scout:
    image: ghcr.io/mayatrail/scout:v0.2.1
    restart: unless-stopped
    environment:
      SCOUT_SERVICE_TOKEN: ${SCOUT_SERVICE_TOKEN:?set SCOUT_SERVICE_TOKEN in .env (see .env.example)}

  # Celery Beat scheduler — runs auto_destroy_expired_stacks every 15 minutes.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env (the db instance private IP)}
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      celery -A config beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # UI (React SPA on nginx)
  ui:
    build:
      context: ./frontend/UI
      dockerfile: Dockerfile
      args:
        # Baked into the SPA at build time; enables the "Continue with Google"
        # button. Pass-through form (no value): the arg is forwarded when the
        # variable is set in the shell or a root-level .env, and OMITTED when it
        # is not. The `${VAR:-}` form always forwards it, and an empty build arg
        # becomes an empty env var that overrides frontend/UI/.env, because Vite
        # gives an existing environment variable precedence over a .env file.
        # Leaving it unset here is what lets frontend/UI/.env act as the default.
        - VITE_GOOGLE_CLIENT_ID
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/nginx.pid 2>/dev/null) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Edge Reverse Proxy
  #  Routes / → ui:8080, /api/ + /admin/ → backend:8000
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ui:
        condition: service_started
      backend:
        condition: service_healthy

