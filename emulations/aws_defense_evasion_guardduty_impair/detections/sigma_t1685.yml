title: GuardDuty Detector Enumeration by Non-Security Principal
id: a9eaa482-2494-5619-aba7-2609b050c7f8
status: experimental
description: >
    Detects ListDetectors followed by GetDetector calls from a principal that is not a
    recognized security service account. GuardDuty enumeration is the reconnaissance
    phase of a detector impairment attack chain: the adversary discovers the active
    detector ID and its current configuration (findingPublishingFrequency) before
    crafting targeted modification or deletion calls. A single GetDetector call in
    isolation may be benign; ListDetectors + GetDetector together from an assumed-role
    session outside the security team warrants investigation.
    Corresponds to ATOMIC-guardduty-impair steps 2-3.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
    - attack.discovery
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_list:
        eventSource: guardduty.amazonaws.com
        eventName: ListDetectors
    selection_get:
        eventSource: guardduty.amazonaws.com
        eventName: GetDetector
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
            - 'SecurityAudit'
            - 'ReadOnlyAccess'
    condition: (selection_list or selection_get) and not filter_legitimate
falsepositives:
    - Cloud governance tooling performing regular compliance checks against GuardDuty
    - Developer troubleshooting GuardDuty configuration with broad permissions during an incident
level: low
