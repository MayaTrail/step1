title: GuardDuty Suppression Filter Created with ARCHIVE Action
id: 620c79cc-8a44-58b6-8847-eaca089b21fa
status: experimental
description: >
    Detects creation of a GuardDuty findings filter with Action=ARCHIVE by a principal
    outside the security team. An ARCHIVE filter auto-archives matching findings before
    analysts see them in the GuardDuty console, silently suppressing alerts. This is a
    high-confidence indicator of an adversary attempting to blind the detection pipeline.
    Corresponds to ATOMIC-guardduty-impair step 5.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_CreateFilter.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: guardduty.amazonaws.com
        eventName: CreateFilter
        requestParameters.action: 'ARCHIVE'
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
            - 'SecurityAudit'
    condition: selection and not filter_legitimate
falsepositives:
    - Security team creating known-good suppression filters for approved noisy findings
    - Automated tuning pipelines that create filters with ARCHIVE action under a custom role name
level: high
