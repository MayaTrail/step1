title: GuardDuty DeleteDetector Attempted - Access Denied
id: a5e134c6-7310-5879-8a54-efb594a8d8c4
status: experimental
description: >
    Detects an AccessDenied CloudTrail event for guardduty:DeleteDetector. Even when
    the call fails, the CloudTrail record represents a confirmed adversarial intent to
    destroy the account's primary threat detection capability. Detection rules MUST NOT
    filter on errorCode IS NULL; this event is meaningful precisely because it was denied.
    An attacker who has reached this step likely already performed enumeration, IPSet
    creation, and filter creation in the same session. Correlate with other T1685 events.
    Corresponds to ATOMIC-guardduty-impair step 7.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_DeleteDetector.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: guardduty.amazonaws.com
        eventName: DeleteDetector
        errorCode: AccessDenied
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
    condition: selection and not filter_legitimate
falsepositives:
    - Misconfigured automation script targeting wrong detector ID; unlikely to hit AccessDenied unless the role also lacks delete permission
    - Permission boundary test by cloud security team
level: critical
