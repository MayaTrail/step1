title: GuardDuty DeletePublishingDestination Attempted - Access Denied
id: 64412f4b-d927-5c3c-8c85-a0a0e139a73d
status: experimental
description: >
    Detects an AccessDenied CloudTrail event for guardduty:DeletePublishingDestination.
    Deleting a publishing destination would stop GuardDuty from exporting findings to S3
    or a SIEM, effectively blinding log aggregation. The AccessDenied errorCode is a
    high-confidence IOC: IAM authorization is evaluated before resource existence, so
    this event fires even with a placeholder destination ID. Detection rules MUST NOT
    filter this out on errorCode. Correlate with DeleteDetector (step 7) in the same
    CloudTrail session to confirm the full impairment chain.
    Corresponds to ATOMIC-guardduty-impair step 8.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_DeletePublishingDestination.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: guardduty.amazonaws.com
        eventName: DeletePublishingDestination
        errorCode: AccessDenied
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
    condition: selection and not filter_legitimate
falsepositives:
    - Automation pipeline with stale destination ID attempting cleanup; would need AccessDenied on the delete permission itself, not just wrong resource
level: high
