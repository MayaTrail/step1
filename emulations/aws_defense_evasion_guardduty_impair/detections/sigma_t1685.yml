title: GuardDuty Trusted IP Set Created and Activated by Non-Security Principal
id: 30d13bef-1fed-58c4-9748-79c635d9a9d3
status: experimental
description: >
    Detects creation of an active GuardDuty IPSet (trusted-IP list) by a principal
    that is not a recognized security-automation service account. When activated,
    an IPSet suppresses GuardDuty findings for traffic sourced from the listed CIDRs,
    allowing an adversary to whitelist C2 infrastructure and evade detection.
    Corresponds to ATOMIC-guardduty-impair step 4.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_CreateIPSet.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: guardduty.amazonaws.com
        eventName: CreateIPSet
        requestParameters.activate: 'true'
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
            - 'SecurityAudit'
    condition: selection and not filter_legitimate
falsepositives:
    - Security team onboarding a new trusted-IP list via automation pipeline
    - Legitimate CI/CD pipeline updating threat intel whitelists under a non-standard role name
level: high
---
title: GuardDuty Detector Finding Frequency Degraded by Non-Security Principal
id: 5796ffa9-88df-5ea9-8ab4-712375f5c3db
status: experimental
description: >
    Detects a GuardDuty UpdateDetector call that lowers the findingPublishingFrequency
    to SIX_HOURS from a principal outside the security team. Reducing the publish
    frequency delays EventBridge/SNS delivery of findings, extending an attacker's
    operational window before alerts fire. This is a targeted degradation technique
    that does not disable GuardDuty but meaningfully weakens alert velocity.
    Corresponds to ATOMIC-guardduty-impair step 6.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/guardduty/latest/APIReference/API_UpdateDetector.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: guardduty.amazonaws.com
        eventName: UpdateDetector
        requestParameters.findingPublishingFrequency:
            - 'SIX_HOURS'
            - 'TWELVE_HOURS'
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'guardduty-service-role'
            - 'SecurityAudit'
    condition: selection and not filter_legitimate
falsepositives:
    - Cost-optimization change approved by security team reducing publish frequency in low-risk environments
    - Infrastructure-as-code deployment updating detector settings via a deployment role
level: medium
