title: STS AssumeRole into Broad GuardDuty Scope Role Outside Security Team
id: acee89da-aaaa-5b53-a0aa-dacbe254aa9a
status: experimental
description: >
    Detects an STS AssumeRole call into a role whose name suggests broad GuardDuty
    permissions (impair, disable, admin) when performed by a principal outside the
    security team. This is the entry point of a GuardDuty impairment chain: the
    adversary uses a compromised identity to assume a seeded or over-permissioned role
    granting guardduty:CreateIPSet, guardduty:CreateFilter, guardduty:UpdateDetector,
    and guardduty:DeleteDetector. Tune the role name pattern to your environment's
    naming convention for GuardDuty-scoped roles.
    Corresponds to ATOMIC-guardduty-impair step 1.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1685
    - attack.privilege_escalation
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleArn|contains:
            - 'guardduty-impair'
            - 'guardduty-disable'
            - 'guardduty-admin'
            - 'gd-impair'
    filter_legitimate:
        userIdentity.arn|contains:
            - 'security-automation'
            - 'SecurityAudit'
    condition: selection and not filter_legitimate
falsepositives:
    - Security team automation deploying or tearing down GuardDuty emulation labs
    - IaC pipeline (Pulumi, Terraform) deploying or destroying GuardDuty resources under a deployment role whose ARN matches the pattern
level: medium
