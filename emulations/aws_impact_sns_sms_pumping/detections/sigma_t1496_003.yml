title: Adversary Role Assumption for SNS SMS Pumping Operation
id: 3120e959-e211-5d1b-b8c4-1578f816bfc0
status: experimental
description: >
    Detects AssumeRole calls where the RoleSessionName contains keywords
    associated with SMS pumping tooling or automated OTP-abuse frameworks.
    Adversaries staging an SMS pumping campaign commonly adopt a stolen or
    attacker-controlled IAM role using a descriptive session name baked into
    their tooling (e.g. "sms-pumping", "otp-abuse", "smspump").
references:
    - https://attack.mitre.org/techniques/T1496/003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.resource_hijacking
    - attack.t1496.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: AssumeRole
        eventSource: sts.amazonaws.com
    filter_session_keywords:
        requestParameters.roleSessionName|contains:
            - sms-pump
            - smspump
            - sms_pump
            - otp-abuse
            - otpabuse
            - sms-fraud
            - smsbomb
    condition: selection and filter_session_keywords
falsepositives:
    - Automated deployment pipelines that happen to include "sms" in a role session name
    - Developers testing SNS SMS functionality with descriptive session labels
level: medium
---
title: SNS Spend Limit Raise Attempt - SetSMSAttributes AccessDenied
id: f703b083-552c-57c7-9dbe-558bea8d9bf0
status: experimental
description: >
    Detects a denied attempt to raise the SNS SMS monthly spend limit via
    SetSMSAttributes. Adversaries who have obtained SNS Publish rights but
    lack sns:SetSMSAttributes will still generate a CloudTrail event with
    errorCode AccessDenied. This event is the intent signal for a pumping
    campaign — the adversary is probing whether they can remove the billing
    guard before launching the Publish burst.

    IMPORTANT: Detection rules that filter on errorCode IS NULL or only match
    successful events will miss this step entirely. This rule MUST include the
    AccessDenied errorCode to be effective.
references:
    - https://attack.mitre.org/techniques/T1496/003/
    - https://docs.aws.amazon.com/sns/latest/api/API_SetSMSAttributes.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.resource_hijacking
    - attack.t1496.003
    - attack.defense_evasion
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: SetSMSAttributes
        eventSource: sns.amazonaws.com
        errorCode: AccessDenied
    filter_legitimate_change:
        userIdentity.arn|contains:
            - AWSServiceRoleForSNS
            - sns-service-role
    condition: selection and not filter_legitimate_change
falsepositives:
    - Overly-permissioned automation scripts that attempt SetSMSAttributes without
      having been granted the required IAM permission
    - Misconfigured IAM policies during initial SNS SMS account setup
level: high
