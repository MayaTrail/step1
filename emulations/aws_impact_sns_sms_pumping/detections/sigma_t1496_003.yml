title: SNS Publish to Direct Phone Number - Potential SMS Pumping
id: 0c879c7a-56b7-55a6-b872-0756f117f142
status: experimental
description: >
    Detects SNS Publish calls that target a direct phone number (E.164 format)
    rather than a topic ARN or target ARN. In most application architectures,
    SNS messages are published to topics; direct-to-phone-number calls are
    unusual and characteristic of SMS pumping tooling. When correlated with
    the SNS SMS recon events (GetSMSAttributes, GetSMSSandboxAccountStatus)
    from the same principal in the same session, confidence is high.

    Burst detection: a high volume of Publish calls to distinct phone numbers
    from the same userIdentity.arn within a 60-second window, all with
    SMSType Promotional, is the primary pumping pattern. Threshold rules
    should alert at >= 10 distinct phone number destinations per minute.
references:
    - https://attack.mitre.org/techniques/T1496/003/
    - https://docs.aws.amazon.com/sns/latest/api/API_Publish.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.resource_hijacking
    - attack.t1496.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: Publish
        eventSource: sns.amazonaws.com
    filter_phone_destination:
        requestParameters.phoneNumber|startswith: '+'
    filter_not_topic:
        requestParameters.topicArn: ''
    filter_not_target:
        requestParameters.targetArn: ''
    condition: selection and filter_phone_destination and filter_not_topic and filter_not_target
falsepositives:
    - Two-factor authentication (2FA) or one-time password (OTP) delivery services
      that publish directly to phone numbers as a normal operational pattern
    - Marketing platforms with legitimate SMS campaigns using SNS direct-publish
    - Customer notification systems for appointment reminders or alerts
level: medium
