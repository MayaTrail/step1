title: SNS SMS Account Reconnaissance - Spend Limit and Sandbox Status Enumeration
id: bf97e41b-7ece-5e25-beac-2520fcaa74b7
status: experimental
description: >
    Detects enumeration of SNS SMS account attributes preceding a pumping
    campaign. Adversaries who have obtained SNS Publish rights call
    GetSMSAttributes to discover the MonthlySpendLimit and DefaultSMSType,
    then call GetSMSSandboxAccountStatus to determine whether delivery is
    gated by the SMS sandbox. Both calls together — especially from the same
    principal within a short window — indicate pre-attack reconnaissance.
    GetSMSSandboxAccountStatus is rarely called in normal operations; its
    presence alone is a weak signal worth correlating.
references:
    - https://attack.mitre.org/techniques/T1496/003/
    - https://docs.aws.amazon.com/sns/latest/api/API_GetSMSAttributes.html
    - https://docs.aws.amazon.com/sns/latest/api/API_GetSMSSandboxAccountStatus.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.resource_hijacking
    - attack.t1496.003
    - attack.reconnaissance
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_attrs:
        eventName: GetSMSAttributes
        eventSource: sns.amazonaws.com
    selection_sandbox:
        eventName: GetSMSSandboxAccountStatus
        eventSource: sns.amazonaws.com
    condition: selection_attrs or selection_sandbox
falsepositives:
    - Cloud cost monitoring tools polling SMS spend limits
    - Developers onboarding a new AWS account to SNS SMS for legitimate use
    - Infrastructure-as-code tooling that reads SMS config before applying changes
level: low
