title: RDS Ransomware Reconnaissance - Instance and Snapshot Enumeration (T1486 Pre-Chain)
id: a6d13bbd-e516-5d68-8ea8-21553f2c87f9
status: experimental
description: |
  Detects the reconnaissance pattern that precedes RDS ransomware operations:
  DescribeDBInstances followed by DescribeDBSnapshots within a short window from the
  same principal. Attackers enumerate the target instance state (confirming it is
  'available') and then enumerate available backups before launching the re-encryption
  chain. This rule correlates both Describe* calls in a single detection; a SIEM
  correlation rule (see kql_T1486_rds_ransomware_chain.kql) covers the full multi-step
  sequence with time-window grouping.
references:
    - https://attack.mitre.org/techniques/T1486/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1486
    - attack.t1580
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_describe_instances:
        eventSource: rds.amazonaws.com
        eventName: DescribeDBInstances
    selection_describe_snapshots:
        eventSource: rds.amazonaws.com
        eventName: DescribeDBSnapshots
    filter_monitoring:
        userIdentity.invokedBy:
            - monitoring.rds.amazonaws.com
            - config.amazonaws.com
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - '/CloudWatchRole'
            - '/ConfigRole'
    condition: (selection_describe_instances or selection_describe_snapshots) and not filter_monitoring
fields:
    - eventTime
    - eventName
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.dBInstanceIdentifier
    - requestParameters.filters
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Monitoring agents (CloudWatch, Datadog, New Relic) that regularly poll RDS state
    - DevOps tooling and IaC tools that enumerate RDS resources during plan/apply
    - AWS Config and Security Hub periodic resource evaluation
level: low
