title: RDS Snapshot Re-encrypted Under Attacker-Controlled KMS Key (T1486 Core Signal)
id: 182b0ace-96fa-52ce-b40d-be065f5d59ec
status: experimental
description: |
  Detects CopyDBSnapshot where the KmsKeyId in requestParameters references a CMK
  ARN that differs from the standard account backup key alias pattern. This is the
  primary CloudTrail signal for the RDS ransomware technique: an attacker copies a
  production snapshot encrypted under their own CMK, making it irrecoverable by the
  victim organization. High-fidelity when correlated with a preceding CreateDBSnapshot
  by the same non-backup principal (two-snapshot re-encryption pattern).
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CopyDBSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: CopyDBSnapshot
    filter_backup_service:
        userIdentity.invokedBy:
            - backup.amazonaws.com
            - rds.amazonaws.com
    condition: selection and not filter_backup_service
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.sourceDBSnapshotIdentifier
    - requestParameters.targetDBSnapshotIdentifier
    - requestParameters.kmsKeyId
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Legitimate cross-region snapshot copy operations using a region-specific CMK
    - Authorized DR runbooks that copy snapshots to a separate CMK for isolation
    - AWS Backup jobs using a custom KMS key (covered by filter_backup_service but
      custom IAM roles for backup may not match the filter)
level: high
