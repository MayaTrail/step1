title: RDS Instance or Snapshot Deletion Attempted (T1486 Chain Completion - Any Outcome)
id: f2179f00-9a05-5e06-b656-d7d4a6646284
status: experimental
description: |
  Detects DeleteDBInstance or DeleteDBSnapshot API calls regardless of whether they
  succeed or return AccessDenied. In the RDS ransomware kill chain, both events are
  expected to be denied by an explicit IAM deny-guard, but the AccessDenied events
  are themselves high-fidelity indicators: they confirm the attacker attempted to
  destroy the original instance and backup after re-encrypting under their KMS key.
  IMPORTANT: This rule intentionally does NOT filter on errorCode to catch both
  succeeded and denied variants. A successful DeleteDBInstance is a critical severity
  event requiring immediate incident response.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBInstance.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_instance:
        eventSource: rds.amazonaws.com
        eventName: DeleteDBInstance
    selection_snapshot:
        eventSource: rds.amazonaws.com
        eventName: DeleteDBSnapshot
    filter_backup_service:
        userIdentity.invokedBy:
            - backup.amazonaws.com
            - rds.amazonaws.com
    condition: (selection_instance or selection_snapshot) and not filter_backup_service
fields:
    - eventTime
    - eventName
    - userIdentity.arn
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.dBInstanceIdentifier
    - requestParameters.dBSnapshotIdentifier
    - requestParameters.finalDBSnapshotIdentifier
    - errorCode
    - errorMessage
    - sourceIPAddress
    - awsRegion
falsepositives:
    - Authorized teardown of non-production environments by infra automation roles
    - AWS Backup automated snapshot expiry (covered by filter_backup_service)
level: critical
---
title: RDS Instance Deletion Protection Disabled (T1486 Pre-Delete Signal)
id: e47c3923-1652-5a47-9956-e79b11134984
status: experimental
description: |
  Detects ModifyDBInstance where requestParameters.deletionProtection is set to false.
  Disabling deletion protection is a mandatory prerequisite to DeleteDBInstance and is a
  leading-edge ransomware signal when performed by a non-DBA principal on a production
  database. Critically, this rule must fire whether errorCode is absent (modification
  succeeded) or contains AccessDenied (blocked by IAM deny-guard) -- both outcomes are
  meaningful in a kill-chain correlation. AWS Config rule
  aws-rds-instance-deletion-protection-enabled provides a complementary compliance signal.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_ModifyDBInstance.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: ModifyDBInstance
        requestParameters.deletionProtection: 'false'
    filter_db_admins:
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - '/rds-admin'
            - '/DBAdminRole'
    condition: selection and not filter_db_admins
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.dBInstanceIdentifier
    - requestParameters.deletionProtection
    - errorCode
    - errorMessage
    - sourceIPAddress
    - awsRegion
falsepositives:
    - Authorized database lifecycle management (decommissioning a dev/test instance)
    - Terraform/CDK destroy workflows run by authorized automation roles
level: high
