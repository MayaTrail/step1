title: STS AssumeRole into RDS Ransomware Attack Session (T1486 Credential Bootstrap)
id: c7fdc4bc-ba29-550f-a2b2-092b2aa14cf7
status: experimental
description: |
  Detects STS AssumeRole where the RoleSessionName matches the ransomware operator
  session naming convention used in emulation (atomic-rds-ransomware-kms-session) or,
  more broadly, any assumption of an IAM role that subsequently makes RDS write API
  calls. The credential bootstrap step is the first CloudTrail event in the kill chain;
  correlating it with subsequent RDS events (CreateDBSnapshot, CopyDBSnapshot) provides
  a complete principal lineage for incident response. Tune the RoleSessionName pattern
  to match your organization's legitimate automation naming conventions.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://attack.mitre.org/techniques/T1078/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
    - attack.defense-evasion
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_assumerole:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleSessionName|contains:
            - 'ransomware'
            - 'atomic-rds'
            - 'kms-session'
    condition: selection_assumerole
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.roleArn
    - requestParameters.roleSessionName
    - responseElements.assumedRoleUser.arn
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Legitimate security testing or red team exercises using similar session name patterns
    - Automated DR runbooks that use descriptive session names referencing KMS
level: high
