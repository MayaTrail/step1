title: RDS Snapshot Created by Non-Backup Principal (T1486 Staging Signal)
id: 57885042-7876-5b2c-9f5f-59e2411e0d27
status: experimental
description: |
  Detects CreateDBSnapshot invoked by a principal that is not a recognized backup
  service or scheduled backup automation role. Attackers create a fresh snapshot of
  a live production RDS instance before re-encrypting it under an attacker-controlled
  KMS key, preserving a complete copy of the data. When followed by CopyDBSnapshot
  from the same session, this constitutes the two-snapshot re-encryption ransomware
  pattern. GuardDuty RDS Protection also fires an anomalous-snapshot-creation finding
  for this behaviour.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: CreateDBSnapshot
    filter_backup_principals:
        userIdentity.invokedBy:
            - backup.amazonaws.com
            - rds.amazonaws.com
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - '/aws-backup-role'
            - '/rds-backup'
            - '/AWSBackup'
    condition: selection and not filter_backup_principals
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.dBInstanceIdentifier
    - requestParameters.dBSnapshotIdentifier
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Developers or ops engineers creating manual snapshots before schema migrations
    - CI/CD pipelines with embedded snapshot steps that use custom IAM roles
    - Third-party database management tools (e.g., Snapshooter, cloud management platforms)
level: medium
