title: IAM Backdoor Role Deletion Chain (Clear Persistence)
id: 5c6f6d8c-3e8d-599a-abba-f7b6adcf3f60
status: experimental
description: >
    Detects the sequential deletion of an IAM role and its inline policies
    consistent with an attacker removing a role used as a cross-account or
    federated-access persistence mechanism. The pattern of DeleteRolePolicy
    followed immediately by DeleteRole from the same assumed-role session
    is a strong indicator of persistence cleanup rather than normal lifecycle
    management, especially when the deleted role name matches service/shadow
    naming conventions (e.g. OrganizationAccountAccessRole-shadow,
    svc-prod-*).
references:
    - https://attack.mitre.org/techniques/T1070/009/
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteRole.html
author: MayaTrail
date: 2026/10/10
tags:
    - attack.defense_evasion
    - attack.t1070.009
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_events:
        eventSource: iam.amazonaws.com
        eventName|contains:
            - DeleteRolePolicy
            - DetachRolePolicy
            - DeleteRole
    selection_caller_type:
        userIdentity.type: AssumedRole
    # High-confidence IOC: role name matching known APT shadow-naming patterns
    selection_suspicious_role_name:
        requestParameters.roleName|contains:
            - 'shadow'
            - 'backup-access'
            - 'recovery-admin'
            - 'OrganizationAccountAccessRole-'
    filter_service_roles:
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - 'arn:aws:iam::*:role/aws-service-role/'
    # Rule A: any assumed-role session deleting a role (medium confidence)
    # Rule B: specifically suspicious role names (high confidence)
    condition: (selection_events and selection_caller_type and not filter_service_roles) or
               (selection_events and selection_suspicious_role_name)
falsepositives:
    - Cloud governance / cleanup automation removing unused roles
    - Terraform/CDK destroy pipelines during environment teardown
    - Security team removing over-privileged roles after an access review
level: medium
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.roleName
    - requestParameters.policyName
    - sourceIPAddress
    - awsRegion
