title: IAM Backdoor User Deletion Chain (Clear Persistence)
id: 9e978c03-3eff-5771-86a0-80cf24d4b7d8
status: experimental
description: >
    Detects the sequential deletion of an IAM user and its sub-resources
    (access keys, login profile, inline policies) consistent with an attacker
    removing a backdoor user created for persistence. Legitimate administrative
    user deprovisioning rarely follows this exact rapid sequence from an
    assumed-role session; automated provisioning systems use dedicated roles
    and are filterable by known ARNs.
references:
    - https://attack.mitre.org/techniques/T1070/009/
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteUser.html
author: MayaTrail
date: 2026/10/10
tags:
    - attack.defense_evasion
    - attack.t1070.009
logsource:
    product: aws
    service: cloudtrail
detection:
    # Match any event in the IAM user teardown sequence
    selection_events:
        eventSource: iam.amazonaws.com
        eventName|contains:
            - DeleteAccessKey
            - DeleteLoginProfile
            - DeleteUserPolicy
            - DetachUserPolicy
            - DeleteUser
    # The caller is an assumed-role session (not a long-lived IAM user or CI/CD role)
    selection_caller_type:
        userIdentity.type: AssumedRole
    # Filter known automation/provisioning roles that legitimately deprovision users
    filter_provisioning:
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - 'arn:aws:iam::*:role/aws-service-role/'
            - 'arn:aws:iam::*:role/OrganizationAccountAccessRole'
    condition: selection_events and selection_caller_type and not filter_provisioning
falsepositives:
    - Legitimate user lifecycle automation running under an assumed-role session
      (add the specific provisioner role ARN to filter_provisioning)
    - Break-glass or on-call admin manually cleaning up stale accounts via AssumeRole
    - HR-driven deprovisioning workflows using temporary credentials
level: medium
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.principalId
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.userName
    - requestParameters.accessKeyId
    - sourceIPAddress
    - awsRegion
