title: Assumed-Role Session Performing Bulk IAM Entity Deletions
id: 0f564f3e-bb5d-5786-8693-ae074f2d3b97
status: experimental
description: >
    Detects an assumed-role session issuing multiple IAM destructive API calls
    (DeleteAccessKey, DeleteLoginProfile, DeleteUserPolicy, DeleteUser,
    DeleteRolePolicy, DeleteRole) in a single CloudTrail session. This
    combination is characteristic of an attacker who has assumed a
    purpose-built IAM-deletion-scoped role to remove previously planted
    backdoor identities, as part of covering their tracks after completing
    their mission. Legitimate automation typically issues these calls from
    a well-known provisioner role ARN and rarely combines user and role
    deletions in the same session.
references:
    - https://attack.mitre.org/techniques/T1070/009/
    - https://attack.mitre.org/techniques/T1098/
author: MayaTrail
date: 2026/10/10
tags:
    - attack.defense_evasion
    - attack.t1070.009
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_bulk_iam_delete:
        eventSource: iam.amazonaws.com
        userIdentity.type: AssumedRole
        eventName:
            - DeleteAccessKey
            - DeleteLoginProfile
            - DeleteUserPolicy
            - DetachUserPolicy
            - DeleteUser
            - DeleteRolePolicy
            - DetachRolePolicy
            - DeleteRole
    # Attacker session will first call GetCallerIdentity to confirm role assumption
    selection_caller_recon:
        eventSource: sts.amazonaws.com
        eventName: GetCallerIdentity
        userIdentity.type: AssumedRole
    filter_known_automation:
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - 'arn:aws:iam::*:role/aws-service-role/'
            - '/StackSet-'
            - '/AWSControlTowerExecution'
    # Use this rule to pivot: after seeing DeleteUser/DeleteRole, query the same
    # principalId for the preceding AssumeRole and GetCallerIdentity calls.
    # SIGMA cannot express time-window aggregation natively; see KQL for correlation.
    condition: selection_bulk_iam_delete and not filter_known_automation
falsepositives:
    - IaC destroy pipelines (Pulumi/Terraform) tearing down a full IAM stack
      -- filter by the specific deployer role ARN in filter_known_automation
    - Offboarding runbooks executed by a temporary admin session
level: high
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.principalId
    - userIdentity.sessionContext.sessionIssuer.arn
    - userIdentity.sessionContext.sessionIssuer.userName
    - requestParameters.userName
    - requestParameters.roleName
    - sourceIPAddress
    - userAgent
    - awsRegion
