title: CICD Supply Chain - IAM User Assumes CICD Service Account Role
id: a1b2c3d4-e5f6-7890-ab12-cd34ef567801
status: experimental
description: >
  Detects an IAM user directly assuming a role whose ARN matches common CICD service-account
  naming patterns (codepipeline, cicd, pipeline-service, deploy-role). In the T1195 supply
  chain scenario, an attacker who has obtained static IAM user credentials calls sts:AssumeRole
  to acquire a short-lived session scoped to pipeline write permissions. Legitimate CodePipeline
  role assumptions come from service principals or IaC automation (Terraform, CDK, GitHub Actions
  OIDC), not from plain IAM users. The roleSessionName field surfaces attacker-controlled session
  naming conventions such as 'AtomicT1195' used in emulation.
references:
    - https://attack.mitre.org/techniques/T1195/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/08/27
tags:
    - attack.initial_access
    - attack.t1195
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_cicd_role:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        userIdentity.type: IAMUser
        requestParameters.roleArn|contains:
            - 'codepipeline'
            - 'cicd'
            - 'pipeline-service'
            - 'deploy-role'
            - 'pipeline-svc'
    selection_suspicious_session_name:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        userIdentity.type: IAMUser
        requestParameters.roleSessionName|contains:
            - 'Atomic'
            - 'attack'
            - 'backdoor'
            - 'redteam'
            - 'pentest'
    filter_known_iac:
        userIdentity.arn|contains:
            - ':assumed-role/terraform'
            - ':assumed-role/github-actions'
            - ':assumed-role/atlantis'
            - ':assumed-role/cdk'
    condition: (selection_cicd_role or selection_suspicious_session_name) and not filter_known_iac
falsepositives:
    - Developer manually assuming a CICD role for debugging a stuck pipeline execution
    - Break-glass operations where an ops engineer assumes the pipeline role under incident conditions
    - Automated tooling that uses a static IAM user key to assume CICD roles (should migrate to OIDC)
level: medium
