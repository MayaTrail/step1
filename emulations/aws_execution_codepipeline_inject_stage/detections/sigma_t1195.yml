title: CICD Supply Chain - GetPipeline Recon from AssumedRole Session
id: b2c3d4e5-f6a7-8901-bc23-de45fa678902
status: experimental
description: >
  Detects CodePipeline GetPipeline calls made by an assumed-role session whose issuer ARN
  matches CICD service-account naming patterns. Attackers who have assumed a compromised
  CICD role call GetPipeline to read the full pipeline definition, capture the stage list,
  discover CodeBuild project names (to reuse without CreateProject permission), and obtain
  the version number required for a subsequent UpdatePipeline write. Legitimate GetPipeline
  calls from assumed-role sessions are typically IaC automation reading pipeline state;
  a session named after a non-IaC pattern accessing pipeline configuration warrants review.
  Low severity on its own -- combine with UpdatePipeline or AssumeRole signals for high-confidence
  triage using the chain correlation query (kql_T1195_full_chain.kql).
references:
    - https://attack.mitre.org/techniques/T1195/
    - https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_GetPipeline.html
author: MayaTrail
date: 2026/08/27
tags:
    - attack.initial_access
    - attack.t1195
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: codepipeline.amazonaws.com
        eventName: GetPipeline
        userIdentity.type: AssumedRole
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'codepipeline'
            - 'cicd'
            - 'pipeline-service'
            - 'deploy-role'
            - 'pipeline-svc'
            - 'victim'
    # Console sessions use console.amazonaws.com as invokedBy; keep as filter
    filter_console:
        userAgent|contains: 'console.amazonaws.com'
    # IaC automation that legitimately assumes service account roles to read pipeline state
    filter_known_iac:
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'terraform'
            - 'github-actions'
            - 'atlantis'
            - 'cdk'
    condition: selection and not (filter_console or filter_known_iac)
falsepositives:
    - Automated compliance or posture-management tooling that reads pipeline definitions
      using a CICD role via cross-account or within-account role-chaining
    - DevSecOps scanning jobs that assume service account roles to audit pipeline config
    - Engineers debugging pipeline state by assuming the service account role in non-prod accounts
level: low
