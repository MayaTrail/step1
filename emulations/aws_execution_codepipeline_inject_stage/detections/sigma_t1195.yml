title: CICD Supply Chain - UpdatePipeline Stage Injection via Assumed Role
id: c3d4e5f6-a7b8-9012-cd34-ef56ab789003
status: experimental
description: >
  Detects UpdatePipeline API calls originating from an assumed-role session, filtered to exclude
  known IaC automation patterns (Terraform, CDK, GitHub Actions). UpdatePipeline is a management-
  plane API that modifies the pipeline definition; the CodePipeline service itself does not call
  this API internally -- only callers (users, automation) do. An assumed-role session calling
  UpdatePipeline is suspicious when the session issuer does not match a recognized infrastructure-
  as-code role: attackers who have compromised a CICD service account use this API to inject a
  malicious build stage (e.g., 'AttackerStage') between the Source and Build stages, achieving
  arbitrary code execution on the next pipeline run without touching source control.
  Note: CDK Pipelines self-mutation is a legitimate AssumedRole UpdatePipeline call via a CodeBuild
  action -- add 'selfmutate' and 'cdk' to the filter_known_iac list to suppress those.
  NOTE: The CodePipeline service does NOT generate UpdatePipeline CloudTrail events via the
  codepipeline.amazonaws.com service principal -- that filter has been intentionally omitted.
references:
    - https://attack.mitre.org/techniques/T1195/
    - https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_UpdatePipeline.html
author: MayaTrail
date: 2026/08/27
tags:
    - attack.initial_access
    - attack.t1195
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: codepipeline.amazonaws.com
        eventName: UpdatePipeline
        userIdentity.type: AssumedRole
    # Allowlist: IaC automation and CDK self-mutation are legitimate UpdatePipeline callers
    filter_known_iac:
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'terraform'
            - 'github-actions'
            - 'atlantis'
            - 'cdk'
            - 'selfmutate'
            - 'codebuild-cdk'
    condition: selection and not filter_known_iac
falsepositives:
    - Terraform or CDK pipeline-as-code runs that update pipeline definitions using a role not
      matching the known_iac filter -- extend the filter list with your organization's IaC role names
    - CDK Pipelines self-mutation where the CodeBuild service role calls UpdatePipeline; add
      'selfmutate' or 'cdk' to the filter if not already matched
    - On-call engineer assuming a CICD role to modify a stuck pipeline under incident conditions
level: high
