title: CICD Supply Chain - Rapid UpdatePipeline Pair from Same Session (Inject then Restore)
id: d4e5f6a7-b8c9-0123-de45-fa67bc890104
status: experimental
description: >
  Detects two or more UpdatePipeline calls from the same assumed-role session ARN within a 10-
  minute window, excluding known IaC automation. This temporal pattern is the strongest IOC for
  the T1195 pipeline injection + restore cycle: an attacker injects a malicious stage (first
  UpdatePipeline, version N -> N+1) then immediately restores the original definition to cover
  tracks (second UpdatePipeline, version N+1 -> N+2). The inject call alone is caught by
  sigma_T1195_update_pipeline.yml; the rapid pair is a near-unfalsifiable signal that a version
  of the pipeline existed briefly with an unauthorized stage, even if the post-restore state
  appears clean. Requires a SIEM backend that supports SIGMA temporal aggregation (e.g., Splunk,
  Elastic with SIGMA transpiler).
references:
    - https://attack.mitre.org/techniques/T1195/
author: MayaTrail
date: 2026/08/27
tags:
    - attack.initial_access
    - attack.t1195
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: codepipeline.amazonaws.com
        eventName: UpdatePipeline
        userIdentity.type: AssumedRole
    filter_known_iac:
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'terraform'
            - 'github-actions'
            - 'atlantis'
            - 'cdk'
            - 'selfmutate'
    condition: (selection and not filter_known_iac) | count(userIdentity.arn) >= 2
timeframe: 10m
group-by:
    - userIdentity.arn
falsepositives:
    - Pipeline-as-code retry logic that calls UpdatePipeline twice in rapid succession on failure
    - Automated rollback tooling that reads current state, updates, then verifies by re-reading
      (though re-reading would be GetPipeline, not a second UpdatePipeline)
level: critical
