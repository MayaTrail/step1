title: WAFv2 Web ACL Configuration Read - Pre-Modification Reconnaissance
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: >
  Detects wafv2:GetWebACL calls from assumed-role sessions. An adversary must read the
  current Web ACL configuration and capture the optimistic-lock LockToken before issuing
  UpdateWebACL -- WAF rejects modifications that omit the current LockToken with
  WAFOptimisticLockException. GetWebACL from an AssumedRole principal, especially shortly
  after ListWebACLs, is a strong precursor signal for imminent WAF rule modification.
  High-confidence when the same principalId issues GetWebACL and UpdateWebACL within
  minutes (see correlation rule kql_T1562.007_wafv2_modify_sequence.kql).
references:
    - https://attack.mitre.org/techniques/T1562/007/
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_GetWebACL.html
author: MayaTrail
date: 2026/08/25
tags:
    - attack.defense_evasion
    - attack.t1562.007
    - attack.discovery
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: wafv2.amazonaws.com
        eventName: GetWebACL
        userIdentity.type: AssumedRole
    filter_service_principals:
        userIdentity.arn|contains:
            - ':assumed-role/AWSServiceRole'
            - ':assumed-role/aws-service-role'
    condition: selection and not filter_service_principals
fields:
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.id
    - requestParameters.name
    - requestParameters.scope
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Automated WAF configuration backup or drift-detection tooling running under assumed roles
    - Terraform/Pulumi IaC refresh operations reading current WAF state
    - Security team tooling that reads WAF config for compliance reporting
level: low
