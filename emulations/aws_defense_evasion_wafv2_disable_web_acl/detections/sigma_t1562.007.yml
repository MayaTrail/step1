title: WAFv2 Web ACL Modified with ByteMatch Allow Rule Injection
id: d4e5f6a7-b8c9-0123-def0-234567890123
status: experimental
description: >
  Detects wafv2:UpdateWebACL calls that inject a ByteMatch ALLOW rule -- the canonical
  technique for creating a magic-header bypass. CloudTrail logs the full requestParameters
  including rule statements in plaintext. An adversary prepends a high-priority ByteMatch
  Allow rule matching a secret header value (e.g. X-Bypass: <secret>) ahead of managed
  rule groups, allowing crafted requests to bypass AWSManagedRulesCommonRuleSet and other
  protections while appearing stealthy because the managed rules remain in the configuration.
  This detection fires on the keyword 'byteMatchStatement' combined with 'ALLOW' action in
  the UpdateWebACL requestParameters -- both are present in plaintext in CloudTrail.
  HIGH priority: UpdateWebACL is an uncommon API call and any ByteMatch Allow injection
  is a critical security event.
references:
    - https://attack.mitre.org/techniques/T1562/007/
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateWebACL.html
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_ByteMatchStatement.html
author: MayaTrail
date: 2026/08/25
tags:
    - attack.defense_evasion
    - attack.t1562.007
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: wafv2.amazonaws.com
        eventName: UpdateWebACL
    selection_payload:
        requestParameters|contains|all:
            - 'byteMatchStatement'
            - 'ALLOW'
    filter_legitimate_iac:
        # Known IaC deployer service accounts -- adjust to your environment
        userIdentity.arn|contains:
            - 'pulumi-deployer'
            - 'terraform-deployer'
            - 'cdk-deployer'
    condition: selection_event and selection_payload and not filter_legitimate_iac
fields:
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.name
    - requestParameters.id
    - requestParameters.rules
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Intentional ByteMatch Allow rules deployed via IaC for known traffic patterns (IP allowlisting flows)
    - WAF rule testing during authorized security assessments
    - Custom header-based routing rules deployed by application teams
level: high
