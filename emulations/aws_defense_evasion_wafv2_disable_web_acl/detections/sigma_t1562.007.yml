title: Suspicious AssumeRole to WAF Operator Role
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: >
  Detects STS AssumeRole calls that land a session targeting a WAF-related IAM role.
  Adversaries who have compromised over-permissioned credentials (or a root-trusted principal)
  use AssumeRole to pivot into a dedicated WAF operator role before enumerating or modifying
  Web ACL rules. This rule fires on the role assumption step; pair it with downstream
  wafv2:ListWebACLs and wafv2:UpdateWebACL rules for a full kill-chain correlation.
references:
    - https://attack.mitre.org/techniques/T1562/007/
    - https://docs.aws.amazon.com/waf/latest/developerguide/logging-and-monitoring.html
author: MayaTrail
date: 2026/08/25
tags:
    - attack.defense_evasion
    - attack.t1562.007
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleArn|contains: waf
    filter_automation:
        # Exclude well-known CI/CD or service-linked automation principals
        userIdentity.arn|contains:
            - 'AWSServiceRoleForWAF'
            - 'waf-automation'
    condition: selection and not filter_automation
fields:
    - userIdentity.arn
    - userIdentity.type
    - requestParameters.roleArn
    - requestParameters.roleSessionName
    - sourceIPAddress
    - userAgent
falsepositives:
    - Legitimate WAF administrators using role assumption for least-privilege access
    - Automated WAF management tooling that assumes a named WAF role
    - Penetration testing engagements with documented scope
level: medium
---
title: WAFv2 Web ACL Enumeration via ListWebACLs
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
  Detects wafv2:ListWebACLs calls from non-service principals. An adversary holding
  over-scoped WAF credentials will enumerate regional Web ACLs to discover ACL IDs,
  Names, and ARNs required for subsequent GetWebACL and UpdateWebACL calls. A single
  ListWebACLs call from an assumed-role session is a reliable leading indicator of
  WAF reconnaissance, especially when followed within minutes by GetWebACL.
references:
    - https://attack.mitre.org/techniques/T1562/007/
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_ListWebACLs.html
author: MayaTrail
date: 2026/08/25
tags:
    - attack.defense_evasion
    - attack.t1562.007
    - attack.discovery
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: wafv2.amazonaws.com
        eventName: ListWebACLs
    filter_service_principals:
        userIdentity.type: Service
    filter_known_scanners:
        # Exclude well-known security posture tools that legitimately enumerate WAF ACLs
        userAgent|contains:
            - 'SecurityHub'
            - 'aws-sdk-go/config-service'
            - 'Prowler'
    condition: selection and not filter_service_principals and not filter_known_scanners
fields:
    - userIdentity.arn
    - userIdentity.type
    - userIdentity.principalId
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Cloud security posture management (CSPM) tools scanning for WAF coverage gaps
    - WAF reporting dashboards or cost-optimization tooling
    - Legitimate security engineers performing manual WAF audits
level: low
