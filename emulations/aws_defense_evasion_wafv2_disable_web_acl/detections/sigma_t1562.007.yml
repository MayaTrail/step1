title: WAFv2 Web ACL Rule Modification from AssumedRole
id: e5f6a7b8-c9d0-1234-ef01-345678901234
status: experimental
description: >
  Detects any wafv2:UpdateWebACL call issued by an AssumedRole principal. This is a
  broader complement to the ByteMatch-specific rule (sigma_T1562.007_wafv2_update_bytematch_allow)
  and catches rule modifications that do not include an obvious ByteMatch keyword -- for
  example removing managed rule groups entirely, setting DefaultAction to ALLOW, or modifying
  VisibilityConfig to suppress logging. UpdateWebACL is a low-frequency operation in most
  environments and any call from an assumed-role that is not a known IaC deployer warrants
  investigation.
references:
    - https://attack.mitre.org/techniques/T1562/007/
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateWebACL.html
author: MayaTrail
date: 2026/08/25
tags:
    - attack.defense_evasion
    - attack.t1562.007
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: wafv2.amazonaws.com
        eventName: UpdateWebACL
        userIdentity.type: AssumedRole
    filter_iac_deployers:
        userIdentity.arn|contains:
            - 'pulumi-deployer'
            - 'terraform-deployer'
            - 'cdk-deployer'
            - 'AWSServiceRole'
    condition: selection and not filter_iac_deployers
fields:
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.name
    - requestParameters.defaultAction
    - requestParameters.rules
    - sourceIPAddress
    - userAgent
    - awsRegion
falsepositives:
    - Infrastructure engineers updating WAF rules via assumed deployment roles
    - Automated WAF management scripts running under least-privilege assumed roles
    - Authorized security testing or red team exercises
level: medium
