title: ELB Describe API Burst - Pre-Manipulation Reconnaissance
id: a3f72c18-d591-4e8a-b024-8f1e3c7d2a45
status: experimental
description: >
  Detects a burst of ELB v2 Describe* API calls (DescribeLoadBalancers,
  DescribeListeners, DescribeTargetGroups, DescribeRules) from a single IAM
  principal in a short window. Adversaries perform this reconnaissance to
  enumerate the listener ARN, target group ARN, and existing rule priorities
  before injecting a backdoor listener rule (T1556 - Modify Authentication
  Process). A single principal issuing all four Describe calls within minutes
  is a strong pre-attack indicator.
references:
    - https://attack.mitre.org/techniques/T1556/
    - https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_DescribeRules.html
author: MayaTrail
date: 2026/08/27
tags:
    - attack.defense_evasion
    - attack.t1556
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_describe_alb:
        eventSource: 'elasticloadbalancing.amazonaws.com'
        eventName|contains:
            - 'DescribeLoadBalancers'
            - 'DescribeListeners'
            - 'DescribeTargetGroups'
            - 'DescribeRules'
    filter_legitimate_automation:
        userIdentity.arn|contains:
            - 'AWSServiceRoleFor'
            - 'aws-elasticloadbalancing'
            - 'AWSLambdaBasicExecutionRole'
    condition: selection_describe_alb and not filter_legitimate_automation
falsepositives:
    - Infrastructure-as-code pipelines (Pulumi, Terraform, CDK) enumerating ELB resources during plan/apply
    - CloudFormation stack updates touching ALB resources
    - Monitoring tools polling ELB Describe APIs for health dashboards
    - AWS Console sessions by administrators performing manual review
level: low
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.principalId
    - sourceIPAddress
    - userAgent
    - awsRegion
