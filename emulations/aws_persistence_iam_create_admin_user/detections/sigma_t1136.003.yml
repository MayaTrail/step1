title: IAM create-admin-user backdoor sequence
id: 9d4f2a83-6c15-4e07-b2d1-8a0c9b7e5f94
status: experimental
description: >-
  A net-new user created, granted admin, and issued programmatic credentials by
  the same principal inside ten minutes, the full backdoor fingerprint.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-admin-user/
tags:
  - attack.persistence
  - attack.t1136.003
correlation:
  type: temporal_ordered
  rules:
    - iam_create_user
    - iam_attach_admin_base
    - iam_create_access_key
  group-by:
    - userIdentity.arn
  timespan: 10m
level: critical
