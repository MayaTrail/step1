# Persist via Lambda Layer (T1525)
#
# The original rule matched PublishLayerVersion / UpdateFunctionConfiguration /
# DeleteLayerVersion with a bare `condition: selection`.
# UpdateFunctionConfiguration fires on every memory, timeout, environment and
# layer change; DeleteLayerVersion is teardown and the emulation's own cleanup.
# Neither inspected WHICH layer was attached. DeleteLayerVersion is dropped from
# alerting and kept only for the timeline.
#
# The load-bearing half of Rule A - the approved-layer allowlist: is a
# per-environment set and CANNOT be a static Sigma value. Enforce it in the
# rules engine: for each ARN in requestParameters.layers, alert unless the ARN,
# or its owner account (the 5th ':'-delimited field), is approved. Deploy
# `kql_t1525.kql` where that logic must live in the query itself.
title: Lambda function configured with an unapproved layer
id: eba83563-85c2-5fe1-a2d3-143478ea6587
name: lambda_attach_unapproved_layer
status: experimental
description: >-
  A layer set was supplied to a function configuration update. Attaching a layer
  injects code that runs inside the function's execution environment.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-layer-extension/
tags:
  - attack.persistence
  - attack.t1525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'lambda.amazonaws.com'
    eventName: 'UpdateFunctionConfiguration'
    requestParameters.layers|contains: 'arn:aws:lambda:'   # a layer set was supplied
  condition: selection
falsepositives:
  - Every legitimate layer attachment, this rule is only useful once the
    approved-layer allowlist is applied in the rules engine
level: high
---
title: Lambda publish-layer then attach sequence
id: 4e0c7a32-8d59-4f26-b3e7-0a1c8d6f2b45
status: experimental
description: >-
  A layer published and then attached to a function by the same principal within
  fifteen minutes, the code-injection fingerprint.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-layer-extension/
tags:
  - attack.persistence
  - attack.t1525
correlation:
  type: temporal_ordered
  rules:
    - lambda_publish_layer
    - lambda_attach_unapproved_layer
  group-by:
    - userIdentity.arn
  timespan: 15m
level: high
