---
# Cross-account layer sharing. An attacker who shares their layer outward, or
# attaches a layer owned by an account you do not control, has a supply-chain
# foothold that survives changes to your own function code.
title: Lambda layer version shared cross-account
id: 7a2e9c64-3b18-4d05-96f2-8c0d5b71ea39
status: experimental
description: >-
  Layer version permissions granted outside the account. Review the grantee and
  whether the layer is attached to production functions.
references:
  - https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
tags:
  - attack.persistence
  - attack.t1525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'lambda.amazonaws.com'
    eventName: 'AddLayerVersionPermission'
  public:
    requestParameters.principal: '*'
  condition: selection and public
falsepositives:
  - Deliberately published public layers, should be inventoried
level: high
