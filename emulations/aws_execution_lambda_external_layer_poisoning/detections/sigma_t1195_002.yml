title: Lambda Function Layer List Modified by Non-Deployment Principal
id: e8ab96e5-1dd4-593a-8002-9cd6551c410d
status: experimental
description: >
  Detects UpdateFunctionConfiguration calls that modify the Layers field of a
  Lambda function, attributed to a principal that is not the expected deployment
  identity. This is the definitive CloudTrail indicator for T1195.002 Lambda
  layer poisoning: the adversary overwrites the victim function's layers list
  with a poisoned LayerVersionArn they published moments earlier. Correlate
  with a preceding PublishLayerVersion20181031 from the same principal within
  a short time window to confirm the injection chain.
references:
    - https://attack.mitre.org/techniques/T1195/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.initial_access
    - attack.t1195.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: 'UpdateFunctionConfiguration20150331v2'
        eventSource: 'lambda.amazonaws.com'
        requestParameters.layers|exists: true
    filter_cicd:
        # Suppress known deployment identities that legitimately update layers.
        # Replace with your actual deployer role ARNs.
        userIdentity.arn|contains:
            - 'pulumi'
            - 'cicd'
            - 'deploy'
            - 'github-actions'
    condition: selection and not filter_cicd
falsepositives:
    - Infrastructure-as-code runs (Pulumi, Terraform, CDK) that update function layers as part of a normal deployment
    - AWS SAM or Serverless Framework deployments from developer machines using personal credentials
level: high
