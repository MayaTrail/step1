title: Lambda Layer Published by Unexpected Principal (Supply Chain Poisoning)
id: 239d62f6-0620-5c38-969c-f71df4f25366
status: experimental
description: >
  Detects PublishLayerVersion calls attributed to a principal that does not
  match the original layer deployer identity. In a Lambda layer supply-chain
  attack (T1195.002), the adversary publishes a new poisoned version of a
  shared dependency layer under their own role. This event is the point of
  injection: the new LayerVersionArn will later be pushed into victim functions
  via UpdateFunctionConfiguration. The principal mismatch between the original
  deployer and this publisher is the primary indicator.
references:
    - https://attack.mitre.org/techniques/T1195/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.initial_access
    - attack.t1195.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: 'PublishLayerVersion20181031'
        eventSource: 'lambda.amazonaws.com'
    filter_legitimate_publishers:
        # Suppress the actual layer owners - CI/CD and Pulumi deploy roles.
        # Replace with your environment's specific deployer role ARNs.
        userIdentity.arn|contains:
            - 'pulumi'
            - 'cicd'
            - 'deploy'
            - 'github-actions'
            - 'layer-publisher'
    condition: selection and not filter_legitimate_publishers
falsepositives:
    - Developers publishing experimental layer versions from personal AWS credentials
    - Terraform or Pulumi runs authenticated with a personal IAM user rather than a deployment role
    - One-off layer patches performed by an ops engineer during an incident
level: high
