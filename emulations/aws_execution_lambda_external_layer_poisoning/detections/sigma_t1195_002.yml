title: Lambda Function Reconnaissance by Non-Deployment Principal
id: b7500cae-27b9-5bb0-ba8f-6e0838be34a9
status: experimental
description: >
  Detects GetFunction calls against Lambda functions attributed to a role or user
  that is not the expected CI/CD deployment identity. Adversaries performing
  supply-chain layer poisoning (T1195.002) call GetFunction first to read the
  current Layers list before injecting a malicious version. A single GetFunction
  from an unexpected principal is a low-cost pre-attack recon indicator.
references:
    - https://attack.mitre.org/techniques/T1195/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.initial_access
    - attack.t1195.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: 'GetFunction20150331v2'
        eventSource: 'lambda.amazonaws.com'
    filter_cicd:
        # Suppress known CI/CD and Pulumi deployment identities.
        # Extend this list with your actual deployment role ARNs.
        userIdentity.arn|contains:
            - 'pulumi'
            - 'cicd'
            - 'deploy'
            - 'github-actions'
    condition: selection and not filter_cicd
falsepositives:
    - Developers inspecting Lambda configuration interactively via AWS Console or CLI
    - Legitimate runbook automation reading function config before a manual deploy
    - Security scanners or asset-inventory tools calling GetFunction across all functions
level: low
