title: IAM User GetFederationToken for Console Federation
id: 3680a604-0771-5c78-86c2-7ddc8fe5f293
status: experimental
description: >
  Detects an IAM user calling GetFederationToken via STS to obtain short-lived
  federated credentials. In production environments, console federation is
  typically handled by an identity provider or dedicated role, not static IAM
  user keys. A static user calling GetFederationToken is a high-signal indicator
  that an attacker is converting a compromised key into console access (T1538).
references:
    - https://attack.mitre.org/techniques/T1538/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_GetFederationToken.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1538
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: GetFederationToken
        userIdentity.type: IAMUser
    filter_ci_roles:
        userIdentity.arn|contains:
            - ':user/ci-'
            - ':user/deploy-'
            - ':user/svc-'
    condition: selection and not filter_ci_roles
falsepositives:
    - Legitimate console federation via an internal federation broker service running as an IAM user
    - CI/CD pipelines that explicitly issue short-lived scoped tokens for downstream consumers
level: high
