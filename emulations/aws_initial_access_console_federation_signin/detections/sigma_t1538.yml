title: SecretsManager Enumeration from FederatedUser Session
id: 7a69ff80-b425-5897-9bbe-08167b31b627
status: experimental
description: >
  Detects ListSecrets or DescribeSecret API calls made by a FederatedUser
  session principal. In most production environments, Secrets Manager access
  comes from Lambda execution roles, ECS task roles, or IAM service accounts --
  not from FederatedUser sessions. A FederatedUser enumerating secrets is a
  strong indicator that an attacker has obtained console-level access via a
  federation token and is performing discovery of credential material (T1538).
references:
    - https://attack.mitre.org/techniques/T1538/
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_ListSecrets.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1538
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_list:
        eventSource: secretsmanager.amazonaws.com
        eventName: ListSecrets
        userIdentity.type: FederatedUser
    selection_describe:
        eventSource: secretsmanager.amazonaws.com
        eventName: DescribeSecret
        userIdentity.type: FederatedUser
    condition: selection_list or selection_describe
falsepositives:
    - Developers or administrators who access the console via a legitimate federated SSO and manually inspect secrets
    - Security auditing tools that enumerate secrets using short-lived federated credentials
level: medium
