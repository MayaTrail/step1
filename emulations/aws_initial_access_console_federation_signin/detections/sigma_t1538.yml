title: AWS Console Login via FederatedUser Session (Programmatic Origin)
id: da87292c-ede5-54d9-9cee-c4bd890eefed
status: experimental
description: >
  Detects an AWS ConsoleLogin event where the identity type is FederatedUser
  and the source appears programmatic (non-browser user agent or non-corporate
  issuer). This is the highest-fidelity detection signal for T1538 console
  federation abuse: an attacker who obtained a static IAM key calls
  GetFederationToken then constructs a console login URL, resulting in a
  ConsoleLogin event with userIdentity.type=FederatedUser sourced from a
  non-IdP issuer. Legitimate federated logins from a corporate IdP will carry
  a recognizable issuer domain (e.g., accounts.google.com, your-okta-domain).
references:
    - https://attack.mitre.org/techniques/T1538/
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1538
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: ConsoleLogin
        userIdentity.type: FederatedUser
    filter_known_idp:
        userIdentity.sessionContext.sessionIssuer.arn|contains:
            - ':role/SSO'
            - ':role/Federated'
            - ':role/SAML'
    condition: selection and not filter_known_idp
falsepositives:
    - Legitimate console federation from an internal IdP whose issuer role is not named with the above patterns -- expand filter_known_idp with your organization's actual federation role ARNs
    - Authorized red team or emulation exercises
level: critical
