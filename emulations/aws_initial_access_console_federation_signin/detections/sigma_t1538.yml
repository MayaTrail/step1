title: AWS Console GetSigninToken from Non-Browser User-Agent
id: 9ce96215-91a9-5e42-91ac-20320abcc582
status: experimental
description: >
  Detects a GetSigninToken request to the AWS sign-in federation endpoint
  (signin.amazonaws.com) originating from a non-browser user agent such as
  Python, curl, or other HTTP libraries. Legitimate console federation flows
  issued by identity providers use browser redirects; programmatic calls are
  a strong indicator that an attacker is constructing a console login URL from
  stolen credentials (T1538).
references:
    - https://attack.mitre.org/techniques/T1538/
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_enable-console-custom-url.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1538
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: GetSigninToken
    filter_browser_agents:
        userAgent|contains:
            - 'Mozilla/'
            - 'Chrome/'
            - 'Safari/'
            - 'Edge/'
    condition: selection and not filter_browser_agents
falsepositives:
    - Internal federation broker tooling that issues sign-in tokens programmatically as part of a headless SSO flow
    - Security tooling or emulation labs performing authorized red team exercises
level: high
