title: Anonymous Cognito GetCredentialsForIdentity - Unauthenticated Temporary AWS Credential Issuance
id: b2c3d4e5-f6a7-4901-bc23-f12345678902
status: experimental
description: >
  Detects a GetCredentialsForIdentity request to an AWS Cognito Identity Pool
  issued without SigV4 signing (no IAM credentials presented). CloudTrail records
  these calls with no principal ARN or account ID. A successful response hands the
  caller temporary STS credentials scoped to the pool's unauthenticated IAM role,
  enabling privilege escalation from zero credentials to AWS API access. This is
  the moment of credential theft in T1078.004 Cognito unauthenticated abuse.
  Pair with sigma_T1078.004_cognito_anon_getid.yml (same session, seconds earlier)
  and sigma_T1078.004_s3_unauth_cognito_access.yml (downstream abuse).
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_GetCredentialsForIdentity.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.credential_access
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'cognito-identity.amazonaws.com'
        eventName: 'GetCredentialsForIdentity'
    # Absence of userIdentity.arn means no SigV4 credentials were presented --
    # the caller is the anonymous unauthenticated Cognito principal.
    # Tune: also match userIdentity.type == 'Unknown' in SIEMs that expose it.
    filter_has_identity:
        userIdentity.arn|exists: true
    condition: selection_event and not filter_has_identity
falsepositives:
    - Legitimate guest user flows in mobile and web applications that issue
      Cognito unauthenticated credentials before the user logs in. Tune by
      known source IP ranges for production CDN/mobile NAT egress, or by
      rate-limiting to suppress high-volume guest traffic.
    - SDK integration tests exercising the anonymous Cognito credential path.
level: critical
