title: Anonymous Cognito GetId - Unauthenticated Identity Pool Credential Acquisition
id: a1b2c3d4-e5f6-4890-ab12-ef1234567801
status: experimental
description: >
  Detects a GetId request to an AWS Cognito Identity Pool issued without SigV4
  signing (botocore UNSIGNED client or equivalent). CloudTrail records these calls
  with no associated IAM principal ARN or account ID because no credentials were
  presented. An attacker targeting a pool with AllowUnauthenticatedIdentities=True
  uses this call to obtain a Cognito IdentityId, which is the prerequisite for
  GetCredentialsForIdentity. See also sigma_T1078.004_cognito_anon_getcreds.yml.
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.credential_access
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'cognito-identity.amazonaws.com'
        eventName: 'GetId'
    # Absence of userIdentity.arn is the primary signal for an unsigned/unauthenticated caller.
    # Tune: also check userIdentity.type == 'Unknown' if your SIEM surfaces that field directly.
    filter_has_identity:
        userIdentity.arn|exists: true
    condition: selection_event and not filter_has_identity
falsepositives:
    - Legitimate mobile or web application guest/unauthenticated user flows that call
      GetId before login. Alert volume will be high for pools intentionally serving
      anonymous users. Scope by source IP allowlist or restrict to unexpected AWS regions.
    - SDK test harnesses and CI pipelines exercising anonymous Cognito paths.
level: high
