title: SQS Queue Resource Policy Removed After Modification
id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: >
    Detects SetQueueAttributes calls that clear the SQS queue Policy
    attribute (empty string or null). Attackers who inject an open resource
    policy to exfiltrate messages may subsequently remove the policy to
    cover their tracks. This rule fires on the cleanup step — when correlated
    with a prior wildcard-policy event on the same queue URL it indicates
    a complete attack-and-cleanup sequence.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://attack.mitre.org/techniques/T1070/
author: MayaTrail
date: 2026/08/26
tags:
    - attack.persistence
    - attack.t1098
    - attack.defense_evasion
    - attack.t1070
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: SetQueueAttributes
        eventSource: sqs.amazonaws.com
    empty_policy:
        # CloudTrail records the Policy key with an empty value or omits it
        # when the caller passes Policy="" to clear the attribute.
        requestParameters|contains:
            - '"Policy":""'
            - '"Policy": ""'
    filter_legitimate:
        userIdentity.arn|endswith:
            - ':role/PulumiDeployer'
            - ':role/TerraformDeployer'
            - ':role/CDKToolkit'
    condition: selection and empty_policy and not filter_legitimate
falsepositives:
    - IaC teardown pipelines removing SQS policies as part of
      normal infrastructure decommissioning.
    - Manual operator cleanup after a security incident response.
level: medium
