title: SQS Queue Resource Policy Set to Wildcard Principal
id: 8f3a1c2e-4b5d-4e6f-a7b8-9c0d1e2f3a4b
status: experimental
description: >
    Detects SetQueueAttributes calls that inject a resource-based policy
    granting public (Principal "*") access to an SQS queue. Attackers with
    sqs:SetQueueAttributes can grant SendMessage, ReceiveMessage, or
    DeleteMessage to any AWS principal, enabling unauthorized message
    injection or data exfiltration from the queue.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: SetQueueAttributes
        eventSource: sqs.amazonaws.com
    wildcard_principal:
        requestParameters|contains:
            - '"Principal":"*"'
            - '"Principal": "*"'
            - '"Principal":{"AWS":"*"}'
            - '"Principal": {"AWS": "*"}'
    filter_legitimate:
        # Filter known automation roles that set SQS policies as part of infra provisioning.
        # Expand this list to match your org's IaC deployer principal ARNs.
        userIdentity.arn|endswith:
            - ':role/PulumiDeployer'
            - ':role/TerraformDeployer'
            - ':role/CDKToolkit'
    condition: selection and wildcard_principal and not filter_legitimate
falsepositives:
    - IaC pipelines (Pulumi, Terraform, CDK) that intentionally create
      public SQS queues for cross-account messaging during deployment.
    - Developers testing SQS access policies in sandbox accounts.
    - SNS -> SQS subscription fanout policies generated by the console
      (these use the SNS service principal, not "*", so they should not
      trigger this rule).
level: high
