title: SQS Queue Enumeration Followed by Attribute Inspection
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: >
    Detects a reconnaissance sequence where a principal calls ListQueues
    followed by GetQueueAttributes within a short window. This pattern
    matches the first two steps of the SQS open-queue-policy attack chain:
    the attacker lists queues to identify targets and then resolves the
    queue ARN from GetQueueAttributes before injecting a wildcard policy.
    Standalone ListQueues or GetQueueAttributes calls are low-signal;
    correlation between them from the same principal raises confidence.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://attack.mitre.org/techniques/T1526/
author: MayaTrail
date: 2026/08/26
tags:
    - attack.persistence
    - attack.t1098
    - attack.discovery
    - attack.t1526
logsource:
    product: aws
    service: cloudtrail
detection:
    list_queues:
        eventName: ListQueues
        eventSource: sqs.amazonaws.com
    get_attrs:
        eventName: GetQueueAttributes
        eventSource: sqs.amazonaws.com
        requestParameters|contains: 'QueueAttributeName.member.1'
    filter_legitimate:
        userIdentity.arn|endswith:
            - ':role/PulumiDeployer'
            - ':role/TerraformDeployer'
    # NOTE: SIGMA timeframe-based sequence correlation is a Splunk / Chronicle
    # backend extension. For sigma2splunk, add:
    #   timeframe: 10m
    #   groupby:
    #     - userIdentity.arn
    #     - sourceIPAddress
    # For other backends, implement correlation in KQL (see kql_T1098_sqs_chain.kql).
    condition: (list_queues or get_attrs) and not filter_legitimate
falsepositives:
    - Monitoring agents (AWS Config, Security Hub, internal compliance
      tooling) that periodically enumerate SQS queues and inspect attributes.
    - Infrastructure-as-code pipelines reading queue metadata during plan/apply.
    - CloudWatch metric collectors reading queue depth attributes.
level: low
