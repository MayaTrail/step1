# Stop CloudTrail Trail (T1685.002)
#
# cloudtrail:StopLogging pauses a trail. Legitimate use is near zero outside change-managed
# maintenance. GuardDuty raises Stealth:IAMUser/CloudTrailLoggingDisabled for the same event.
title: CloudTrail trail logging stopped
id: c902d9ee-3c2b-5339-998c-549fa6b299e6
status: experimental
description: >-
  Detects cloudtrail:StopLogging. Stopping a trail blinds API audit logging for
  every action that follows; attackers do it before the noisy part of an intrusion
  and often restart the trail afterwards to hide the gap.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.defense-evasion.cloudtrail-stop/
  - https://attack.mitre.org/techniques/T1685/002/
tags:
  - attack.defense_impairment
  - attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'cloudtrail.amazonaws.com'
    eventName: 'StopLogging'
  condition: selection
falsepositives:
  - Change-managed trail maintenance by an IaC pipeline.
level: high
