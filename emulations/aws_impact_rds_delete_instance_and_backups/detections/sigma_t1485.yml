title: RDS Data Destruction Attack Sequence - Disable Protection then Delete
status: experimental
description: 'Detects the full three-step RDS data destruction sequence within a short window:

  (1) ModifyDBInstance disabling DeletionProtection,

  (2) DeleteDBSnapshot removing manual backup,

  (3) DeleteDBInstance with SkipFinalSnapshot + DeleteAutomatedBackups.

  This sequence is the canonical T1485 attack pattern against RDS and leaves

  zero recovery points. While individual events may have legitimate explanations,

  all three events from the same principal identity within a short time window

  constitutes a high-confidence ransomware or destructive attack indicator.

  NOTE: This rule requires a SIEM capable of temporal correlation (e.g. Splunk

  stats, Sentinel summarize, or Chronicle UDM with time-windowed aggregation).

  For point-in-time SIEMs, deploy the individual per-event rules instead.'
references:
- https://attack.mitre.org/techniques/T1485/
- https://unit42.paloaltonetworks.com/cloud-ransomware/
author: MayaTrail
date: 2026/04/15
tags:
- attack.impact
- attack.t1485
correlation:
  type: temporal
  rules:
  - rds_modify_protection_off
  - rds_delete_db_snapshot
  - rds_delete_instance_skip_final
  group-by:
  - userIdentity.arn
  timespan: 10m
falsepositives:
- IaC pipeline (Pulumi destroy, Terraform destroy) tearing down a dev environment that had deletion protection
  enabled for parity — acceptable if the instance name pattern matches a dev/staging prefix
level: critical
---
