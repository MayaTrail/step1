title: RDS Manual DB Snapshot Deleted by Non-Backup Service Principal
id: 600baf35-24c2-59e6-b342-cd0358ce82a6
status: experimental
description: |
    Detects DeleteDBSnapshot calls against manual snapshots. Manual snapshots
    are the last out-of-band recovery point for an RDS instance; deleting them
    before or concurrent with instance deletion eliminates all restore paths
    (T1485 - Data Destruction). Legitimate automated snapshot lifecycle management
    is typically performed by AWS Backup or DBA service accounts with a predictable
    schedule pattern. Ad-hoc deletion by an assumed-role or interactive principal
    targeting a production-named snapshot warrants immediate investigation.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: DeleteDBSnapshot
    filter_backup_service:
        userIdentity.arn|contains:
            - 'AWSBackup'
            - 'aws-backup'
            - 'backup-service'
            - 'AWSServiceRole'
    filter_dev_snapshots:
        requestParameters|contains:
            - '-dev-'
            - '-sandbox-'
            - '-test-'
    condition: selection and not (filter_backup_service or filter_dev_snapshots)
falsepositives:
    - Authorized DBA manually pruning old manual snapshots under a retention policy
    - AWS Backup service role executing a lifecycle expiration rule
    - IaC destroy run cleaning up a dev environment snapshot
level: high
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - userIdentity.type
    - sourceIPAddress
    - requestParameters.dBSnapshotIdentifier
