title: RDS Deletion Protection Disabled on DB Instance
id: bd19d68a-152c-57c4-8648-7469a424d730
status: experimental
description: |
    Detects ModifyDBInstance calls that explicitly disable DeletionProtection.
    Disabling deletion protection immediately before a DeleteDBInstance call is
    the primary behavioral leading-edge indicator for RDS data destruction (T1485).
    Legitimate DBA operations rarely disable deletion protection without a documented
    change-management window; an immediate follow-on delete within minutes is
    a near-certain signal of malicious intent.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInstance.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: ModifyDBInstance
        requestParameters|contains: '"deletionProtection":false'
    filter_automated_maintenance:
        userIdentity.arn|contains:
            - 'AWSServiceRole'
            - 'aws-service-role'
    condition: selection and not filter_automated_maintenance
falsepositives:
    - DBA explicitly removing deletion protection during a planned decommission with a documented change ticket
    - Infrastructure-as-Code pipeline (Terraform, Pulumi, CloudFormation) updating a non-production instance
    - AWS managed migration service temporarily disabling protection
level: high
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - sourceIPAddress
    - requestParameters.dBInstanceIdentifier
    - requestParameters.deletionProtection
    - requestParameters.applyImmediately
