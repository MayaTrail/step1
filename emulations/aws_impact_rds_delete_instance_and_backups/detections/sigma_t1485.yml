title: RDS Enumeration Before Destructive Operation - DescribeDBInstances and DescribeDBSnapshots
status: experimental
description: 'Detects DescribeDBInstances followed by DescribeDBSnapshots from the same

  principal within a short window. While individual Describe calls are routine,

  the sequential enumeration of instance state then manual snapshots by an

  assumed-role identity is consistent with attacker target-confirmation and

  backup-discovery steps preceding RDS data destruction (T1485 steps 2 and 3).

  This rule generates low-severity findings to support correlation; escalate

  when followed by ModifyDBInstance or DeleteDBInstance from the same identity.'
references:
- https://attack.mitre.org/techniques/T1485/
author: MayaTrail
date: 2026/04/15
tags:
- attack.impact
- attack.t1485
- attack.discovery
correlation:
  type: temporal
  rules:
  - rds_describe_db_instances
  - rds_describe_db_snapshots
  group-by:
  - userIdentity.arn
  timespan: 5m
falsepositives:
- Monitoring/observability tooling (Datadog, Dynatrace, CloudWatch dashboards)
- DBA performing manual health checks
- AWS Config periodic recorder
- Backup orchestration service enumerating restore targets
level: low
---
