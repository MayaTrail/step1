title: STS AssumeRole into RDS Management or Destructive-Privilege Role
id: b60ae2a0-2959-5750-b1f8-4b585d2f8cad
status: experimental
description: |
    Detects AssumeRole calls targeting IAM roles with naming patterns consistent
    with RDS management, database administration, or broadly-scoped infrastructure
    roles from non-automated principals. An attacker who has compromised a
    developer or pipeline credential will assume a higher-privilege role before
    executing RDS destructive operations. This rule catches the credential-bootstrap
    step (T1485 step 1) that precedes the ModifyDBInstance / DeleteDBInstance sequence.
    Low-fidelity on its own; combine with downstream RDS events from the same
    assumed-role session for high-confidence correlation.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://attack.mitre.org/techniques/T1078/004/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
    - attack.privilege_escalation
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleArn|contains:
            - 'rds'
            - 'database'
            - 'db-admin'
            - 'db-management'
            - 'infra-admin'
            - 'attacker'
    filter_ci_principals:
        userIdentity.arn|contains:
            - 'GitHubActions'
            - 'CircleCI'
            - 'codebuild'
            - 'CodeBuild'
    filter_service_roles:
        userIdentity.type: 'Service'
    condition: selection and not (filter_ci_principals or filter_service_roles)
falsepositives:
    - Authorized DBA using the break-glass role through a PAM solution (CyberArk, HashiCorp Vault)
    - CI/CD pipeline deploying RDS infrastructure changes
    - AWS Systems Manager Automation assuming the role for a maintenance window
level: medium
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - sourceIPAddress
    - requestParameters.roleArn
    - requestParameters.roleSessionName
    - responseElements.assumedRoleUser.arn
