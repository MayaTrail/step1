title: RDS DB Instance Deleted Without Final Snapshot and Automated Backups Purged
id: c79d0fbc-72f6-5491-9304-eea68f544aba
status: experimental
description: |
    Detects DeleteDBInstance calls where both SkipFinalSnapshot=true and
    DeleteAutomatedBackups=true are set. This combination permanently destroys
    the database and all recovery points in a single API call. In isolation,
    SkipFinalSnapshot may be legitimate in dev environments; the conjunction
    with DeleteAutomatedBackups=true targeting a production-named instance
    is the highest-confidence signal for deliberate data destruction (T1485).
    A preceding ModifyDBInstance disabling DeletionProtection from the same
    principal identity strengthens confidence to critical.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBInstance.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: DeleteDBInstance
        requestParameters|contains|all:
            - '"skipFinalSnapshot":true'
            - '"deleteAutomatedBackups":true'
    filter_dev_accounts:
        requestParameters|contains:
            - '-dev-'
            - '-sandbox-'
            - '-test-'
            - '-staging-'
    condition: selection and not filter_dev_accounts
falsepositives:
    - Automated cleanup of confirmed non-production instances (CI ephemeral DBs)
    - IaC destroy run during a validated decommission of a development database
level: critical
fields:
    - eventTime
    - userIdentity.arn
    - userIdentity.principalId
    - userIdentity.type
    - sourceIPAddress
    - requestParameters.dBInstanceIdentifier
    - requestParameters.skipFinalSnapshot
    - requestParameters.deleteAutomatedBackups
