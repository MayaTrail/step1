title: API Gateway Backdoor Injection - Full Attack Sequence
status: experimental
description: "Composite detection for the complete API Gateway backdoor proxy attack chain (T1190):\n\
  CreateResource + PutMethod (authorizationType=NONE) + PutIntegration (AWS_PROXY) +\nCreateDeployment\
  \ from the same principal within a short time window. This sequence\nrepresents the full backdoor injection\
  \ lifecycle: inject route, strip auth, wire to\nattacker Lambda, activate in prod. No legitimate CI/CD\
  \ pipeline executes this sequence\noutside of a deployment run (and deployments use known pipeline principals\
  \ filtered below).\n\nNOTE: This rule uses SIGMA temporal correlation which requires a backend that\
  \ supports\nevent grouping over a time window (e.g. Elastic SIEM with correlation rules, Splunk\ncorrelation\
  \ searches). For Microsoft Sentinel, use the companion kql_T1190_apigw_backdoor_sequence.kql.\n\nIndividual\
  \ atomic rules:\n  sigma_T1190_apigw_createresource_outside_pipeline.yml\n  sigma_T1190_apigw_putmethod_unauth.yml\n\
  \  sigma_T1190_apigw_putintegration_proxy.yml\n  sigma_T1190_apigw_createdeployment_outside_pipeline.yml"
references:
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/tactics/TA0003/
- https://attack.mitre.org/tactics/TA0005/
author: MayaTrail
date: 2026/04/15
tags:
- attack.initial_access
- attack.persistence
- attack.defense_evasion
- attack.t1190
correlation:
  type: temporal
  rules:
  - apigw_create_resource
  - apigw_put_method_noauth
  - apigw_put_integration_proxy
  - apigw_create_deployment
  group-by:
  - userIdentity.arn
  timespan: 15m
falsepositives:
- Legitimate rapid deployments by authorized engineers during incidents
- New pipeline principal not yet in filter_pipeline list
level: critical
