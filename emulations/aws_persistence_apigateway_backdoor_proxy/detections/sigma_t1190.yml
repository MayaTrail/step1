title: AssumeRole for Over-Permissioned API Gateway DevOps Role
id: 14141d49-89b8-5f62-ad1a-3229d0ffffe5
status: experimental
description: |
  Detects AssumeRole calls followed by a GetCallerIdentity probe from the resulting session,
  consistent with an attacker confirming they have obtained credentials for a DevOps role with
  broad API Gateway write access (apigateway:*). The combination of AssumeRole + identity
  probe from a non-CI/CD source IP or principal is the initial foothold signal in the API
  Gateway backdoor proxy attack chain (T1190 Step 1).
  Tune filter_pipeline to match your deployment pipeline role ARN patterns.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_assume:
        eventName: AssumeRole
        eventSource: sts.amazonaws.com
    selection_probe:
        eventName: GetCallerIdentity
        eventSource: sts.amazonaws.com
        userIdentity.type: AssumedRole
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: (selection_assume or selection_probe) and not filter_pipeline and not filter_aws_services
falsepositives:
    - Authorized break-glass access by on-call engineers
    - New CI/CD pipelines not yet added to filter_pipeline list
    - Developer local credential testing
level: low
fields:
    - userIdentity.arn
    - userIdentity.principalId
    - requestParameters.roleArn
    - requestParameters.roleSessionName
    - sourceIPAddress
    - userAgent
    - awsRegion
