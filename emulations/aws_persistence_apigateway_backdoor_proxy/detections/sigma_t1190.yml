title: API Gateway AWS_PROXY Integration Wired to Unapproved Lambda
id: dd2a3958-23f1-5e6c-bee9-37e5b77b76b5
status: experimental
description: |
  Detects PutIntegration calls on an API Gateway REST API that configure an AWS_PROXY
  integration pointing to a Lambda function. In the API Gateway backdoor proxy attack chain
  (T1190 Step 5), the attacker wires the unauthenticated /health-check-v2 route to an
  attacker-controlled backdoor Lambda (internal-health-check) via AWS_PROXY. After this step,
  any request to the backdoor route is forwarded verbatim to the attacker-controlled function.
  Correlate the Lambda function name in the integration URI against the approved integration
  baseline for the API to distinguish legitimate deployments from backdoors.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/apigateway/latest/api/API_PutIntegration.html
    - https://attack.mitre.org/tactics/TA0003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.persistence
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: PutIntegration
        eventSource: apigateway.amazonaws.com
        requestParameters.type: AWS_PROXY
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: selection and not filter_pipeline and not filter_aws_services
falsepositives:
    - Legitimate Lambda-backed API routes deployed by authorized pipeline outside filter list
    - Development work on Lambda integrations by developers with direct API access
level: medium
fields:
    - userIdentity.arn
    - requestParameters.restApiId
    - requestParameters.resourceId
    - requestParameters.httpMethod
    - requestParameters.type
    - requestParameters.uri
    - sourceIPAddress
    - userAgent
    - awsRegion
