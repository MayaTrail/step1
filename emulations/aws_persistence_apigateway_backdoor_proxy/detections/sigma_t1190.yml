title: API Gateway Method Configured with No Authentication
id: 19550c78-c401-5422-bfce-e61f5063d513
status: experimental
description: |
  Detects PutMethod calls on an API Gateway REST API where authorizationType is set to NONE,
  meaning the route requires no IAM credentials, Cognito tokens, or Lambda authorizer to access.
  This is the primary high-confidence indicator of the API Gateway backdoor proxy attack chain
  (T1190 Step 4): the attacker creates an unauthenticated sibling route (/health-check-v2)
  on an API where all legitimate routes require authorization. A new route with authorizationType
  NONE on a production API is almost always malicious or a serious misconfiguration.
  No pipeline filter is applied because authorizationType=NONE on a production API is
  never an expected outcome of a legitimate deployment in a security-conscious environment.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/apigateway/latest/api/API_PutMethod.html
    - https://attack.mitre.org/tactics/TA0003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.persistence
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: PutMethod
        eventSource: apigateway.amazonaws.com
        requestParameters.authorizationType: NONE
    condition: selection
falsepositives:
    - Intentionally public API routes in development or sandbox environments
    - Health-check endpoints explicitly designed for unauthenticated access (verify pathPart)
    - Internal APIs behind network controls that use no API-level auth
level: high
fields:
    - userIdentity.arn
    - requestParameters.restApiId
    - requestParameters.resourceId
    - requestParameters.httpMethod
    - requestParameters.authorizationType
    - sourceIPAddress
    - userAgent
    - awsRegion
