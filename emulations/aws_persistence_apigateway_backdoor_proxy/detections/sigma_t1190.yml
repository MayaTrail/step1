title: API Gateway Resource Enumeration by Non-Pipeline Principal
id: f2ede41c-e395-5ad7-b145-c28744597fca
status: experimental
description: |
  Detects GetResources calls against an API Gateway REST API from a principal that does not
  match known deployment pipeline identities. In the API Gateway backdoor proxy attack chain
  (T1190 Step 2), the attacker enumerates existing resource paths to extract the root resource
  ID needed to inject a new backdoor route. Alone this is low-confidence; combined with
  subsequent CreateResource/PutMethod events from the same principal it is high-confidence.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/apigateway/latest/api/API_GetResources.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: GetResources
        eventSource: apigateway.amazonaws.com
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: selection and not filter_pipeline and not filter_aws_services
falsepositives:
    - Developers inspecting API configuration via console or CLI
    - Monitoring tools performing API audits
    - Authorized security reviews
level: low
fields:
    - userIdentity.arn
    - requestParameters.restApiId
    - sourceIPAddress
    - userAgent
    - awsRegion
