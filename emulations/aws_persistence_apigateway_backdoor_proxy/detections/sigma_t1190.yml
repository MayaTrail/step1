title: API Gateway Resource Created Outside Deployment Pipeline
id: 8c753f55-4264-5c21-bed5-b05cef443539
status: experimental
description: |
  Detects CreateResource calls on an API Gateway REST API from a principal that does not
  match the approved deployment pipeline identity. In the API Gateway backdoor proxy attack
  chain (T1190 Step 3), the attacker creates a new /health-check-v2 path chosen to blend
  with legitimate health-check infrastructure. Any API Gateway resource creation outside of
  the CI/CD pipeline is anomalous in environments with IaC-enforced infrastructure.
  Correlate with subsequent PutMethod (authorizationType=NONE) events on the same restApiId
  for high-confidence backdoor confirmation.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/apigateway/latest/api/API_CreateResource.html
    - https://attack.mitre.org/tactics/TA0003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.persistence
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: CreateResource
        eventSource: apigateway.amazonaws.com
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: selection and not filter_pipeline and not filter_aws_services
falsepositives:
    - Manual hotfix deployments by authorized engineers during incidents
    - New team members creating test resources in production APIs
    - Pipeline identity not yet added to filter_pipeline list
level: medium
fields:
    - userIdentity.arn
    - requestParameters.restApiId
    - requestParameters.parentId
    - requestParameters.pathPart
    - sourceIPAddress
    - userAgent
    - awsRegion
