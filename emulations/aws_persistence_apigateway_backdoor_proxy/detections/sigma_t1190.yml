title: API Gateway Production Deployment Outside Approved Pipeline
id: e50fe381-54f0-5e8b-8881-aec1f15eeb22
status: experimental
description: |
  Detects CreateDeployment calls on an API Gateway REST API from a principal that does not
  match approved deployment pipeline identities. In the API Gateway backdoor proxy attack
  chain (T1190 Step 7), the attacker calls CreateDeployment to activate the backdoor
  /health-check-v2 route in the prod stage: before this step, the backdoor resource/method/
  integration exist only in the API definition and cannot receive traffic. After this step,
  the route is live and exploitable. A deployment to a prod stage by a non-pipeline principal
  is a critical control-plane event in any IaC-governed environment.
  Also fires on Step 10 (cleanup redeployment for defense evasion) - same event, same principal.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/apigateway/latest/api/API_CreateDeployment.html
    - https://attack.mitre.org/tactics/TA0003/
    - https://attack.mitre.org/tactics/TA0005/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: CreateDeployment
        eventSource: apigateway.amazonaws.com
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: selection and not filter_pipeline and not filter_aws_services
falsepositives:
    - Emergency hotfix deployments by senior engineers during active incidents
    - Authorized manual deployments for one-off configuration changes
    - New pipeline role ARN not yet added to filter list
level: high
fields:
    - userIdentity.arn
    - requestParameters.restApiId
    - requestParameters.stageName
    - requestParameters.description
    - sourceIPAddress
    - userAgent
    - awsRegion
