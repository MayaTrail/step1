title: Lambda Resource Policy Modified to Allow API Gateway Invocation Outside Pipeline
id: 64094509-c0bc-5b07-a149-ec2f7372ab9c
status: experimental
description: |
  Detects AddPermission calls on a Lambda function that grant API Gateway (apigateway.amazonaws.com)
  the right to invoke the function, when the call originates from a non-pipeline principal.
  In the API Gateway backdoor proxy attack chain (T1190 Step 6), the attacker must add an
  invoke permission scoped to the new API stage ARN before API Gateway can proxy requests
  to the backdoor Lambda. Without this permission, requests to the backdoor route return 500.
  Lambda resource policy changes by non-deployment-pipeline principals are high-confidence
  indicators of unauthorized API wiring.
references:
    - https://attack.mitre.org/techniques/T1190/
    - https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
    - https://attack.mitre.org/tactics/TA0003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.persistence
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: AddPermission20150331v2
        eventSource: lambda.amazonaws.com
        requestParameters.principal: apigateway.amazonaws.com
    filter_pipeline:
        userIdentity.arn|contains:
            - ':assumed-role/CodeBuildRole/'
            - ':assumed-role/CodePipelineRole/'
            - ':assumed-role/GitHubActionsRole/'
            - ':assumed-role/TerraformRole/'
            - ':assumed-role/PulumiRole/'
    filter_aws_services:
        userIdentity.type: Service
    condition: selection and not filter_pipeline and not filter_aws_services
falsepositives:
    - New Lambda-backed API routes deployed by authorized engineers outside pipeline
    - Hotfix deployments during incidents that bypass normal pipeline
level: high
fields:
    - userIdentity.arn
    - requestParameters.functionName
    - requestParameters.statementId
    - requestParameters.action
    - requestParameters.principal
    - requestParameters.sourceArn
    - sourceIPAddress
    - userAgent
    - awsRegion
