# ECScape -- ECS agent impersonation / container API credential theft (T1552.007)
#
# ECScape's core: a low-priv task steals the instance role (T1552.005), reads the
# agent introspection API (:51678), calls ecs:DiscoverPollEndpoint, then opens a
# SigV4-signed ACS WebSocket with sendCredentials=true so the control plane streams
# every co-resident task's role + execution-role credentials. The ACS delivery is
# NOT in CloudTrail, so detection keys on the surrounding calls and on the misuse
# of the stolen roles.
#
# Rule 1  (base)       : DiscoverPollEndpoint from the instance role -- reference only.
# Rule 2  (correlation): DiscoverPollEndpoint repeated from one principal (the tell).
# Rule 3               : execution-role credentials used beyond agent bootstrap.
# Rule 4               : RunTask from a non-deployer principal (the malicious task).
title: ECS DiscoverPollEndpoint from EC2 instance role
id: 3f662813-4f35-4833-9fa6-1ba114c597c3
name: ecscape_discoverpollendpoint_base
status: experimental
description: >-
  Base rule. Matches ecs:DiscoverPollEndpoint calls made with EC2 instance-profile
  credentials. Normal ECS agent startup issues one such call per instance boot, so
  this rule is NOT intended for direct alerting -- deploy the correlation that
  references it.
references:
  - https://github.com/naorhaziz/ecscape
  - https://www.sweet.security/blog/ecscape-understanding-iam-privilege-boundaries-in-amazon-ecs
author: MayaTrail
date: 2026/08/27
tags:
  - attack.credential_access
  - attack.t1552.007
  - attack.t1552.005
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: ecs.amazonaws.com
    eventName: DiscoverPollEndpoint
    userIdentity.type: AssumedRole
    userIdentity.arn|contains: ':assumed-role/ecscape-instance-role/'
  condition: selection
falsepositives:
  - Normal ECS agent startup / re-registration (single call per instance boot).
  - Agent reconnect after network blips.
level: low
---
title: ECS DiscoverPollEndpoint repeated from one principal (possible ECScape)
id: 410d3181-1d14-437f-860d-a18b9ed33dc5
status: experimental
description: >-
  More than one ecs:DiscoverPollEndpoint call from the same principal within ten
  minutes. Consistent with ECScape, where a compromised task steals the EC2
  instance role from IMDS and impersonates the ECS agent to open a
  SigV4-signed ACS WebSocket, streaming the IAM credentials of every other task
  on the container instance. Pair with new outbound TLS to an
  ecs-a-*.<region>.amazonaws.com ACS endpoint originating from a task rather than
  the agent process.
references:
  - https://github.com/naorhaziz/ecscape
  - https://www.sweet.security/blog/ecscape-understanding-iam-privilege-boundaries-in-amazon-ecs
author: MayaTrail
date: 2026/08/27
tags:
  - attack.credential_access
  - attack.t1552.007
  - attack.t1552.005
correlation:
  type: event_count
  rules:
    - ecscape_discoverpollendpoint_base
  group-by:
    - userIdentity.arn
  timespan: 10m
  condition:
    gt: 1
falsepositives:
  - Agent re-registration after a network partition producing two calls close together.
level: medium
---
title: ECS task-execution role used beyond agent bootstrap (stolen execution creds)
id: c0a7e2d4-9b13-4f6a-8e21-ec5cape007003
status: experimental
description: >-
  A task *execution* role is an agent-only identity: ECS uses it at task start to
  pull the image, ship logs, and resolve secrets, then it is never exposed to
  application code. ECScape harvests it over ACS and hands it to the attacker.
  This rule fires when execution-role credentials perform any action outside the
  small bootstrap set -- a strong indicator the credentials have left the agent.
  Tune the role-name suffix and the bootstrap allowlist to your environment.
references:
  - https://github.com/naorhaziz/ecscape
  - https://www.sweet.security/blog/ecscape-understanding-iam-privilege-boundaries-in-amazon-ecs
author: MayaTrail
date: 2026/09/04
tags:
  - attack.credential_access
  - attack.t1552.007
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: AssumedRole
    userIdentity.arn|contains: ':assumed-role/ecscape-secret-execution-role/'
  bootstrap_actions:
    eventName:
      - 'GetAuthorizationToken'          # ecr
      - 'BatchGetImage'
      - 'GetDownloadUrlForLayer'
      - 'CreateLogStream'                # logs
      - 'PutLogEvents'
      - 'GetSecretValue'                 # secretsmanager (at task start)
      - 'GetParameters'                  # ssm
      - 'Decrypt'                        # kms
  condition: selection and not bootstrap_actions
falsepositives:
  - A custom execution role legitimately reused for non-bootstrap automation (rare; scope it out).
level: high
---
title: ECS RunTask from a non-deployment principal (ECScape attacker task)
id: d51f8a90-2c47-4e3b-9a6c-ec5cape007004
status: experimental
description: >-
  ecs:RunTask issued by a principal that is not on the deployment/CI allowlist.
  ECScape's operator launches its own low-priv (deny-all) task to run the payload
  in-container. Early, corroborating signal -- pair with the DiscoverPollEndpoint
  correlation and execution-role misuse. Replace the allowlist with the roles that
  legitimately deploy tasks in your account.
references:
  - https://github.com/naorhaziz/ecscape
author: MayaTrail
date: 2026/09/04
tags:
  - attack.credential_access
  - attack.t1552.007
  - attack.execution
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: ecs.amazonaws.com
    eventName: RunTask
  deployment_principals:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-ecs-deployer'
      - ':role/REPLACE-ME-ci-runner'
  condition: selection and not deployment_principals
falsepositives:
  - New deployment/automation roles not yet added to the allowlist.
  - Ad-hoc operator task launches during legitimate maintenance.
level: medium
