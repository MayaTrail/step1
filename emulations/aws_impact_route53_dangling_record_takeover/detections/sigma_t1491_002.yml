title: S3 Bucket Created by Non-IaC Principal - Potential Subdomain Takeover
id: c97ff884-b377-5973-b59b-9ffa358154db
status: experimental
description: >
  Detects S3 bucket creation by a non-service, non-IaC IAM principal. In subdomain
  takeover attacks (T1491.002), the attacker creates a bucket whose name exactly
  matches the hostname of a dangling Route53 CNAME target, claiming the unclaimed
  S3 static-website endpoint. Correlate with preceding Route53 ListResourceRecordSets
  events from the same source IP or principal ARN to identify high-confidence
  takeover attempts where the bucket name matches a live CNAME value.
references:
    - https://attack.mitre.org/techniques/T1491/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1491.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName: CreateBucket
    filter_service:
        userIdentity.type:
            - Service
            - AWSService
    filter_iac:
        userIdentity.arn|contains:
            - ':role/pulumi'
            - ':role/terraform'
            - ':role/cdk'
            - ':role/CloudFormation'
    condition: selection and not filter_service and not filter_iac
falsepositives:
    - Routine S3 bucket creation by developers
    - CI/CD pipeline deployments creating ephemeral buckets
    - IaC deployments using non-standard role naming conventions
level: informational
