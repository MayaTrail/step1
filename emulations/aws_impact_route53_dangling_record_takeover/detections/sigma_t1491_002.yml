title: Route53 TestDNSAnswer Called to Verify Subdomain Takeover
id: 5e8ab98d-24ae-5d1d-8eea-0c1492e99e22
status: experimental
description: >
  Detects Route53 TestDNSAnswer API calls from non-service IAM principals. This
  is an uncommon API that resolves a DNS record within a private hosted-zone
  namespace. In subdomain takeover attacks (T1491.002), attackers call
  TestDNSAnswer after claiming an unclaimed S3 static-website endpoint to confirm
  the CNAME still resolves to their bucket, validating that the takeover is
  active. Any non-service use of this API should be investigated; correlation
  with preceding CreateBucket and PutBucketWebsite events from the same principal
  provides high-confidence attribution.
references:
    - https://attack.mitre.org/techniques/T1491/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1491.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: route53.amazonaws.com
        eventName: TestDNSAnswer
    filter_service:
        userIdentity.type:
            - Service
            - AWSService
    condition: selection and not filter_service
falsepositives:
    - DNS troubleshooting by network engineers confirming record resolution
    - Automated DNS validation tooling in deployment pipelines
level: high
