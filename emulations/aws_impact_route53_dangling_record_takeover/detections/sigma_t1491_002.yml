title: S3 Bucket Deleted by Non-IaC Principal After Website Hosting Was Enabled
id: 91e7e9f0-6abe-5bf9-aad3-7e62efaac54b
status: experimental
description: >
  Detects S3 bucket deletion by a non-service, non-IaC principal following a
  PutBucketWebsite event on the same bucket. In subdomain takeover attacks
  (T1491.002), the attacker deletes the defacement content and claimed bucket
  during cleanup, restoring the dangling CNAME condition. A DeleteBucket event
  in isolation is benign; correlation with a prior PutBucketWebsite event from
  the same principal raises confidence that this represents attacker-controlled
  bucket lifecycle rather than legitimate cleanup. This rule fires on the
  individual DeleteBucket event; correlation logic should be applied in the SIEM.
references:
    - https://attack.mitre.org/techniques/T1491/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1491.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName: DeleteBucket
    filter_service:
        userIdentity.type:
            - Service
            - AWSService
    filter_iac:
        userIdentity.arn|contains:
            - ':role/pulumi'
            - ':role/terraform'
            - ':role/cdk'
            - ':role/CloudFormation'
    condition: selection and not filter_service and not filter_iac
falsepositives:
    - Routine bucket lifecycle management by developers
    - IaC destroy operations using non-standard role naming
    - Developer cleanup of test or ephemeral buckets
level: informational
---
title: S3 Static Website Hosting Enabled by Non-IaC Principal
id: da0aae58-b523-543d-b194-6788f7a62040
status: experimental
description: >
  Detects PutBucketWebsite enabling S3 static website hosting by a non-service,
  non-IaC IAM principal. In subdomain takeover attacks (T1491.002), enabling
  website hosting on an attacker-created bucket that matches a dangling Route53
  CNAME allows the attacker to serve defacement content at the victim subdomain.
  PutBucketWebsite is a high-confidence takeover indicator when it follows
  CreateBucket and Route53 enumeration events from the same principal, especially
  if no IaC deployment is in progress.
references:
    - https://attack.mitre.org/techniques/T1491/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1491.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName: PutBucketWebsite
    filter_service:
        userIdentity.type:
            - Service
            - AWSService
    filter_iac:
        userIdentity.arn|contains:
            - ':role/pulumi'
            - ':role/terraform'
            - ':role/cdk'
            - ':role/CloudFormation'
    condition: selection and not filter_service and not filter_iac
falsepositives:
    - Authorized static website deployments via IaC pipelines using non-standard role naming
    - Manual developer configuration of S3 website hosting for legitimate projects
level: medium
