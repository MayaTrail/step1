title: Route53 Hosted Zone and Record Set Enumeration by Non-Service Principal
id: d55cffc5-ead9-579c-bb74-161f4c439fca
status: experimental
description: >
  Detects enumeration of Route53 hosted zones and resource record sets by a
  non-service IAM principal. Combined ListHostedZones and ListResourceRecordSets
  calls from the same caller are the reconnaissance phase of a subdomain takeover
  attack (T1491.002): the attacker identifies CNAME records pointing to unclaimed
  S3 static-website endpoints before claiming them.
references:
    - https://attack.mitre.org/techniques/T1491/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1491.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_zones:
        eventSource: route53.amazonaws.com
        eventName: ListHostedZones
    selection_records:
        eventSource: route53.amazonaws.com
        eventName: ListResourceRecordSets
    filter_service:
        userIdentity.type:
            - Service
            - AWSService
    condition: (selection_zones or selection_records) and not filter_service
falsepositives:
    - DNS automation tools performing routine zone audits
    - Terraform or Pulumi plan runs reading existing DNS state
    - Cloud security scanners enumerating DNS infrastructure
level: low
