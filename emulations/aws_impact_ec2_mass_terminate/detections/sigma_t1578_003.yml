title: Bulk EC2 Instance Enumeration by Non-Standard Principal
id: 3d522057-fcf7-5322-aa9d-fb30e1da9b60
status: experimental
description: >
  Detects DescribeInstances API calls from identity types or principals that would
  not normally perform fleet-wide enumeration. Adversaries validate their target
  scope by enumerating all running instances before bulk termination. This is
  particularly high-fidelity when the calling principal is an ops automation
  role that has never previously performed instance enumeration.
references:
    - https://attack.mitre.org/techniques/T1578/003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1578.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: DescribeInstances
        eventSource: ec2.amazonaws.com
    filter_common_services:
        userIdentity.type:
            - 'AWSService'
            - 'AWSAccount'
        userIdentity.invokedBy|contains:
            - 'ec2.amazonaws.com'
            - 'autoscaling.amazonaws.com'
            - 'ssm.amazonaws.com'
            - 'health.amazonaws.com'
    condition: selection and not filter_common_services
falsepositives:
    - Security scanners and compliance tools (AWS Config, Security Hub, Inspector)
    - Monitoring agents performing routine inventory
    - DevOps tooling (Ansible, Chef, Puppet) enumerating managed nodes
level: informational
