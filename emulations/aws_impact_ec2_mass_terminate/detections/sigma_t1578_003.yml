title: EC2 Termination Protection Disabled via ModifyInstanceAttribute
id: d4c36b18-ad88-5ca3-ba95-bb854d8268c1
status: experimental
description: >
  Detects ModifyInstanceAttribute API calls that disable EC2 instance termination
  protection (disableApiTermination set to false). Attackers disable this safeguard
  immediately before bulk instance termination to achieve maximum impact.
references:
    - https://attack.mitre.org/techniques/T1578/003/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyInstanceAttribute.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1578.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: ModifyInstanceAttribute
        eventSource: ec2.amazonaws.com
        requestParameters|contains: '"disableApiTermination"'
        requestParameters|contains: '"value":false'
    filter_legitimate_automation:
        userIdentity.arn|contains:
            - '/terraform'
            - '/pulumi'
            - '/cdk'
            - 'AWSServiceRoleFor'
    condition: selection and not filter_legitimate_automation
falsepositives:
    - Infrastructure-as-code pipelines (Terraform, Pulumi, CDK) decommissioning instances
      as part of a planned scale-down
    - Authorized cloud operations teams performing planned decommission of instances
level: high
---
title: Mass EC2 Instance Termination via Single API Call
id: 3cb309fa-4fd2-5dbc-bc8a-53f4210434fd
status: experimental
description: >
  Detects TerminateInstances API calls that target multiple instances simultaneously.
  A single TerminateInstances call listing three or more instance IDs is a strong
  indicator of destructive mass-termination behavior (T1578.003). Adversaries with
  compromised ops credentials may bulk-terminate production workloads to deny service.
references:
    - https://attack.mitre.org/techniques/T1578/003/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_TerminateInstances.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1578.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: TerminateInstances
        eventSource: ec2.amazonaws.com
    filter_error:
        errorCode|exists: true
    filter_legitimate_automation:
        userIdentity.arn|contains:
            - '/terraform'
            - '/pulumi'
            - '/cdk'
            - 'AWSServiceRoleFor'
            - 'autoscaling.amazonaws.com'
    condition: selection and not filter_error and not filter_legitimate_automation
falsepositives:
    - Auto Scaling group scale-in events terminating multiple instances
    - Legitimate IaC teardown of multi-instance stacks
    - Spot instance interruptions processed in batch
level: critical
