title: Denied EC2 Termination Attempt - Possible Scope Probing
id: 40fd540c-875f-570f-81a9-b6f99107bb87
status: experimental
description: >
  Detects TerminateInstances API calls that were denied with UnauthorizedOperation.
  Adversaries or misconfigured automation may probe the blast radius of compromised
  credentials by attempting termination on instances outside their allowed scope.
  This rule fires on the denied bait-bastion probe pattern emulated in the
  ATOMIC_EC2_MASS_TERMINATE scenario where the attacker tests an untagged instance
  before pivoting to tagged production targets.
references:
    - https://attack.mitre.org/techniques/T1578/003/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1578.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: TerminateInstances
        eventSource: ec2.amazonaws.com
        errorCode: UnauthorizedOperation
    condition: selection
falsepositives:
    - Overly broad automation scripts that catch permission errors silently
    - Developer testing IAM policies in non-prod environments
level: medium
