title: Suspicious SecretsManager GetSecretValue on DB Credential Secret
id: 635c87bd-6502-5a5e-b32b-024bdcd2fe99
status: experimental
description: >
  Detects GetSecretValue calls against a SecretsManager secret whose name
  matches a database credential pattern (e.g. db-credentials, rds-password,
  aurora-master). Adversaries retrieve these secrets to obtain username/password
  pairs required for subsequent RDS Data API queries without VPC access.
  Suspicious when the caller is not the expected application service role.
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/monitoring.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.collection
    - attack.t1213
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: secretsmanager.amazonaws.com
        eventName: GetSecretValue
    filter_known_app_roles:
        # Exclude normal application service accounts / Lambda execution roles
        # Tune these to your environment's application principals
        userIdentity.arn|contains:
            - ':assumed-role/app-service-role/'
            - ':assumed-role/lambda-execution-role/'
            - ':assumed-role/ecs-task-role/'
    filter_aws_services:
        userIdentity.type: AWSService
    condition: selection and not (filter_known_app_roles or filter_aws_services)
falsepositives:
    - Developers running one-off credential lookups via AWS CLI during legitimate debugging
    - Rotation Lambda functions checking the current secret version
    - CI/CD pipelines using static keys to fetch deployment credentials
level: high
