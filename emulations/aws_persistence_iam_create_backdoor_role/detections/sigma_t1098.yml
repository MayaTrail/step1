---
# Detects the backdoor being USED. In this account, a cross-account assumption
# records the external caller's account id while the role is local.
# SET YOUR OWN ACCOUNT IDs — as shipped this fires on all cross-account use.
title: Cross-account AssumeRole into a local role
id: 4c8e0b76-2a39-4d51-97f0-8b6c1e50da34
status: experimental
description: >-
  A principal outside the organisation assumed a role in this account —
  confirmation that a backdoored trust policy was exercised.
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'sts.amazonaws.com'
    eventName: 'AssumeRole'
  org_accounts:
    userIdentity.accountId:
      - '111111111111'        # REPLACE with your organisation's account IDs
      - '222222222222'
  condition: selection and not org_accounts
falsepositives:
  - Approved third-party integrations — allowlist their account IDs
level: high
