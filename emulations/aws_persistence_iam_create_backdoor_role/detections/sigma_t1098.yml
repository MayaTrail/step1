# Create IAM Backdoor Role with Admin Access (T1098)
#
# This technique is the COMBINATION of two others: an externally-trusted role
# (backdoor_role) plus an admin grant (create_admin_user). Either half alone is
# suspicious; together they are a cross-account admin backdoor.
#
# The original rule matched CreateRole / AttachRolePolicy / DetachRolePolicy /
# DeleteRole with a bare `condition: selection` — every IaC role change fires
# it, and DetachRolePolicy/DeleteRole are the benign cleanup and the
# emulation's own revert. Both are dropped.
#
# URL-ENCODING CONSTRAINT (same as the backdoor_role technique):
# assumeRolePolicyDocument is URL-encoded in the event, so '"AWS":"*"' never
# matches the raw field ( " -> %22, * -> %2A ). Only 12-digit account IDs
# survive verbatim, which is why Rule A is an IOC catcher. The general
# external/wildcard case requires decoding — see `kql_t1098.kql`.
title: IAM CreateRole trust policy references a known-bad account
id: a93c79c1-1109-50d5-96c6-939c06cf0a78
name: iam_createrole_external
status: experimental
description: >-
  A role was created whose trust policy references an account on the known-bad
  list. Covers enumerated IOC accounts only — see the KQL for the general case.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-backdoor-role/
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'CreateRole'
  known_bad_account:
    requestParameters.assumeRolePolicyDocument|contains:
      - '193672423079'          # emulation marker; add your own IOC account IDs
  condition: selection and known_bad_account
level: critical
---
title: IAM AdministratorAccess attached to a role by non-identity-admin
id: 8c4f2a83-9d15-4e07-b2d1-6a0c9b7e5f24
name: iam_attach_role_admin
status: experimental
description: >-
  An admin-equivalent managed policy was attached to a role by a principal
  outside the identity-administration allowlist.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-backdoor-role/
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'AttachRolePolicy'
    requestParameters.policyArn:
      - 'arn:aws:iam::aws:policy/AdministratorAccess'
      - 'arn:aws:iam::aws:policy/IAMFullAccess'
      - 'arn:aws:iam::aws:policy/PowerUserAccess'
  identity_admin:
    userIdentity.arn|contains:
      - ':role/identity-admin'
      - ':role/iac-deploy'
      - ':role/BreakGlassAdmin'
  condition: selection and not identity_admin
falsepositives:
  - Legitimate admin roles created outside the allowlisted principals — should
    be rare and traceable to a change request
level: critical
---
title: IAM backdoor-role creation sequence
id: 1f6b3e07-5c92-4a48-8d21-90e7ac35f6b8
status: experimental
description: >-
  A role created and granted admin by the same principal within ten minutes.
  Combined with an external trust principal this is a cross-account admin
  backdoor.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-backdoor-role/
tags:
  - attack.persistence
  - attack.t1098
correlation:
  type: temporal_ordered
  rules:
    - iam_create_role_base
    - iam_attach_role_admin
  group-by:
    - userIdentity.arn
  timespan: 10m
level: critical
