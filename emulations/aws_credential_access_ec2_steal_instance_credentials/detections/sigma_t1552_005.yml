# Steal EC2 Instance Credentials via IMDS (T1552.005)
#
# The original single rule matched
#   eventName IN (DescribeInstanceInformation, SendCommand,
#                 GetCommandInvocation, GetCallerIdentity)
# with `condition: selection`. That is undeployable: sts:GetCallerIdentity is
# among the highest-volume calls in AWS (every SDK/CLI init, every CI job) and
# SSM SendCommand/GetCommandInvocation are routine patching. GetCallerIdentity
# and GetCommandInvocation are corroborating CONTEXT, not triggers, and have
# been dropped as primary selectors.
#
# Rule A  — suspicious SendCommand (early signal, medium)
# Rule A2 — command body targets IMDS (high, most specific single event)
# Rule B  — GuardDuty exfiltration finding (critical, the definitive signal)
#
# The off-instance-IP correlation that completes Rule B is a join against a
# role→IP lookup and cannot be expressed in Sigma; it lives in
# `kql_t1552_005.kql`.
title: SSM SendCommand shell document from non-automation principal
id: 8133764f-a9ee-56ef-9579-38555b5f7ea3
status: experimental
description: >-
  A shell-execution SSM document dispatched by a principal outside the patch
  automation allowlist. Early signal — the credential theft itself happens on
  the instance and is not in CloudTrail.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.ec2-steal-instance-credentials/
tags:
  - attack.credential_access
  - attack.t1552.005
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ssm.amazonaws.com'
    eventName: 'SendCommand'
    requestParameters.documentName:
      - 'AWS-RunShellScript'
      - 'AWS-RunPowerShellScript'
  # MAINTAIN THIS LIST. It is the entire difference between a useful rule and
  # an alert on every patch cycle.
  automation_principals:
    userIdentity.arn|contains:
      - ':role/patch-automation'
      - ':role/ssm-runner'
  condition: selection and not automation_principals
falsepositives:
  - Break-glass administration via Run Command
  - New automation roles not yet added to the allowlist
level: medium
---
title: SSM SendCommand body targets the instance metadata service
id: b5a91e26-8c04-4f7d-9130-6ec2f8a47b5d
status: experimental
description: >-
  The dispatched command text reaches IMDS directly. This is the most specific
  single-event signal available for this technique.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.ec2-steal-instance-credentials/
tags:
  - attack.credential_access
  - attack.t1552.005
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ssm.amazonaws.com'
    eventName: 'SendCommand'
    requestParameters.parameters.commands|contains:
      - '169.254.169.254'
      - 'iam/security-credentials'
      - 'latest/meta-data'
  condition: selection
falsepositives:
  - Inventory or health-check scripts that read non-credential metadata paths
level: high
---
# Deploy this. It is the definitive detection for the technique and was absent
# from the original rule set entirely.
title: GuardDuty EC2 instance credential exfiltration
id: 3d7f0b81-46ca-4e59-a2d8-90b1c5e7f342
status: stable
description: >-
  GuardDuty observed instance-profile credentials being used from outside the
  instance. Confirms the credentials left the host.
references:
  - https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-iam.html
tags:
  - attack.credential_access
  - attack.t1552.005
logsource:
  product: aws
  service: guardduty
detection:
  selection:
    type|startswith: 'UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration'
  condition: selection
level: critical
