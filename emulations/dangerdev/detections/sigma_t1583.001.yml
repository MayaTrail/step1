title: DangerDev — Route53 Domain Registration or Transfer Attempt from Anomalous IAM Principal
id: b4c5d6e7-f8a9-4123-bcde-000000000013
status: experimental
description: >
  Detects route53domains:RegisterDomain or TransferDomain called by an IAM principal
  not associated with approved domain administration. DangerDev registered four
  PayPal-mimicking domains for credential-harvesting phishing pages using alice.chen's
  hijacked credentials. Successful AND refused attempts are both matched: this rule
  deliberately does not filter on errorCode, because an AccessDenied RegisterDomain
  from a user with no domain-admin role is itself a high-fidelity signal (attackers
  hit denies when they probe). The emulation makes a real RegisterDomain call that an
  explicit IAM Deny refuses, so the event it generates carries errorCode AccessDenied.
  Route 53 Domains is a us-east-1-only API, so these events are recorded in us-east-1
  whatever region the rest of the activity is in; a trail or SIEM scoped to another
  single region will miss them. Preceding CheckDomainAvailability / GetDomainSuggestions
  calls from the same principal are useful pivot context.
references:
    - https://attack.mitre.org/techniques/T1583/001/
    - https://www.invictus-ir.com/news/the-curious-case-of-dangerdev-protonmail-me
author: MayaTrail
date: 2026/04/15
modified: 2026/10/09
tags:
    - attack.resource_development
    - attack.t1583.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: route53domains.amazonaws.com
        eventName:
            - RegisterDomain
            - TransferDomain
    filter_approved:
        userIdentity.arn|contains:
            - ':assumed-role/DomainRegistrationRole'
            - ':assumed-role/InfraAdmin'
    condition: selection and not filter_approved
fields:
    - eventName
    - errorCode
    - requestParameters.domainName
    - userIdentity.arn
    - awsRegion
falsepositives:
    - Marketing or engineering teams registering new product domains (use dedicated role)
    - Automated domain provisioning for SaaS tenants (should use dedicated role)
level: critical
