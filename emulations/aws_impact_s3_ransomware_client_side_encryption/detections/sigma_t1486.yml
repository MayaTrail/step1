# READ, REWRITE WITH A RANSOM SUFFIX, DELETE: the per-object cycle, by one principal on one bucket
# within five minutes. One cycle is enough to fire; that is deliberate, because the first object
# is the cheapest moment to stop the rest.
title: S3 object read, rewritten with a ransomware suffix and deleted by one principal
id: 5927fbee-a7c9-440a-bc74-737e5a60b20d
status: experimental
description: >-
  One principal read an object, wrote a .encrypted/.locked/.crypted object and deleted an object
  in the same bucket within five minutes - the client-side S3 ransomware cycle.
references:
  - https://attack.mitre.org/techniques/T1486/
tags:
  - attack.impact
  - attack.t1486
correlation:
  type: temporal_ordered
  rules:
    - s3_get_object_bb
    - s3_put_encrypted_suffix
    - s3_delete_object_bb
  group-by:
    - userIdentity.arn
    - requestParameters.bucketName
  timespan: 5m
level: critical
---
# Volume: ten suffix writes by one principal in one bucket in ten minutes is a sweep, not a
# backup tool writing the odd encrypted copy. This emulation writes 50.
title: Many S3 objects rewritten with a ransomware suffix by one principal
id: 6e7c5805-56fc-4265-9612-beafe6eb0953
status: experimental
description: >-
  One principal wrote ten or more .encrypted/.locked/.crypted objects into one bucket within ten
  minutes.
references:
  - https://attack.mitre.org/techniques/T1486/
tags:
  - attack.impact
  - attack.t1486
correlation:
  type: event_count
  rules:
    - s3_put_encrypted_suffix
  group-by:
    - userIdentity.arn
    - requestParameters.bucketName
  timespan: 10m
  condition:
    gte: 10
level: critical
