# S3 Ransomware Through Client-Side Encryption (T1486)
#
# THE PATTERN, PER OBJECT: GetObject <key> -> PutObject <key>.encrypted -> DeleteObject <key>,
# all by one principal, repeated across the bucket. The key exists only in the attacker's memory,
# so no S3 or KMS encryption setting helps and nothing in AWS can decrypt the result. This is the
# client-side variant; the SSE-C variant (see the codefinger emulation) rewrites objects in place
# with a customer-provided key and is caught on x-amz-server-side-encryption-customer-algorithm.
#
# ALL THREE CALLS ARE CLOUDTRAIL DATA EVENTS: recorded only by a trail or event data store with an
# S3 data-event selector covering the bucket; never in Event history or lookup-events.
#
# WHAT WAS MISSING FROM THE GENERATED RULE. The single-event suffix rule (kept, first below) is the
# right anchor but alerted per object and could not express the pattern. Added: a volume
# correlation on the suffix writes, and a read -> rewrite -> delete sequence. Sigma cannot join
# <key>.encrypted to <key> (that needs string arithmetic across events); the KQL does it.
#
# SUFFIXES. `.encrypted` is what this emulation writes. `.locked` and `.crypted` are common
# ransomware renames and are included at the same level; `.enc` is not, because legitimate
# client-side encryption tools use it. Extend the list with any suffix seen in a ransom note.
title: S3 object rewritten with a ransomware-style suffix
id: f54ea1c9-c7ea-5fe2-83cf-4c526870edba
name: s3_put_encrypted_suffix
status: experimental
description: >-
  Detects s3:PutObject writing a key that ends in .encrypted, .locked or .crypted. Paired with
  DeleteObject of the matching original key across many objects this is client-side S3
  ransomware. Requires S3 data events on the trail.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.impact.s3-ransomware-client-side-encryption/
  - https://attack.mitre.org/techniques/T1486/
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 's3.amazonaws.com'
    eventName: 'PutObject'
  enc_suffix:
    requestParameters.key|endswith:
      - '.encrypted'
      - '.locked'
      - '.crypted'
  condition: selection and enc_suffix
falsepositives:
  - Backup tools that write client-side encrypted copies with one of these suffixes. Allowlist
    the tool's role ARN.
level: high
---
