# Execute Malicious Code via EC2 User Data (T1059)
#
# The original rule matched StopInstances / ModifyInstanceAttribute /
# StartInstances independently under a bare `condition: selection`. That is
# both noisy and blind to the technique: Stop and Start fire on every routine
# maintenance window, and matching them independently never expresses the
# ORDERED SEQUENCE that defines the attack.
#
# Rule A catches the write itself (the rare, high-value event).
# Rule B catches the full Stop -> Modify(userData) -> Start fingerprint.
# Stop/Start appear ONLY as bracketing events in Rule B, never as alerts.
title: EC2 ModifyInstanceAttribute changing user-data
id: 222ab6b0-63a5-5177-88fc-aa43018fb567
name: ec2_modify_userdata
status: experimental
description: >-
  User-data rewritten on an existing instance. Provisioning sets user-data at
  launch; modifying it afterwards is a code-execution primitive that runs as
  root on next boot.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.execution.ec2-user-data/
tags:
  - attack.execution
  - attack.t1059
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName: 'ModifyInstanceAttribute'
  # The attribute being modified is the whole point — a bare
  # ModifyInstanceAttribute match also catches security-group and
  # termination-protection changes. Confirm the exact field name against a
  # sample event in your account.
  userdata:
    requestParameters.userData|exists: true
  allowlisted:
    userIdentity.arn|contains:
      - ':role/provisioning'
      - ':role/ci-'
      - ':role/BreakGlassAdmin'
  condition: selection and userdata and not allowlisted
falsepositives:
  - Instance re-bootstrapping by tooling not yet allowlisted
level: high
---
title: EC2 user-data injection sequence
id: 9c4a7e13-5028-4b6d-91fa-3e7c60b8d245
status: experimental
description: >-
  The full technique fingerprint — instance stopped, user-data rewritten,
  instance restarted, within fifteen minutes and against the same instance.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.execution.ec2-user-data/
tags:
  - attack.execution
  - attack.t1059
correlation:
  type: temporal_ordered
  rules:
    - ec2_stop_instances
    - ec2_modify_userdata
    - ec2_start_instances
  group-by:
    - requestParameters.instanceId
  timespan: 15m
level: high
