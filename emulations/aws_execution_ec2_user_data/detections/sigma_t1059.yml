title: EC2 StopInstances
id: 1a5d83f6-2c47-4e09-b731-8f60a94c2e5b
name: ec2_stop_instances
status: experimental
description: Base rule — sequence bracketing only, not for direct alerting.
tags:
  - attack.execution
  - attack.t1059
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName: 'StopInstances'
  condition: selection
level: low
