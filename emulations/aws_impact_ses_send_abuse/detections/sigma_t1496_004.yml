title: SES Account and Identity Enumeration Before Spam Campaign
id: 7f55b735-f3bf-5e03-a047-56e207034fe8
status: experimental
description: >
  Detects rapid SES account posture enumeration — GetAccount, GetSendQuota, and
  ListIdentities — performed by a non-SES-service principal. This combination
  mirrors the pre-attack recon phase of cloud email hijacking (T1496.004): an
  adversary with a stolen role session first checks the account's sending limits
  and production-access status, then lists registered sender addresses before
  staging a spam campaign.
references:
    - https://attack.mitre.org/techniques/T1496/004/
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_GetAccount.html
author: MayaTrail
date: 2026/10/11
tags:
    - attack.discovery
    - attack.impact
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    ses_enum_events:
        eventSource: 'ses.amazonaws.com'
        eventName|contains:
            - 'GetAccount'
            - 'GetSendQuota'
            - 'ListIdentities'
    filter_ses_service_principal:
        userIdentity.type: 'Service'
        userIdentity.invokedBy: 'ses.amazonaws.com'
    condition: ses_enum_events and not filter_ses_service_principal
falsepositives:
    - Monitoring or compliance tools that periodically audit SES quotas and identities
    - Developers testing SES integrations in non-prod accounts
    - Infrastructure-as-code tools (Pulumi, Terraform) running SES configuration checks
level: medium
