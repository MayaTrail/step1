title: SES Production Access Escalation Attempt (AccessDenied)
id: db1ffb8f-9126-5dec-8ad0-3c7308806fee
status: experimental
description: >
  Detects attempts to elevate SES account sending limits via PutAccountDetails
  or UpdateAccountSendingEnabled that were denied by IAM policy. An adversary who
  has compromised a cloud role will try to lift sandbox restrictions to broaden
  the blast radius of a spam campaign (T1496.004). These events will carry
  errorCode: AccessDenied when the role is deny-guarded; the attempt itself is
  the IOC — do NOT filter on errorCode IS NULL. Both API calls target
  account-level SES settings and have no legitimate reason to come from an
  assumed-role session in most environments.
references:
    - https://attack.mitre.org/techniques/T1496/004/
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_PutAccountDetails.html
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_UpdateAccountSendingEnabled.html
author: MayaTrail
date: 2026/10/11
tags:
    - attack.impact
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    escalation_attempt:
        eventSource: 'ses.amazonaws.com'
        eventName|contains:
            - 'PutAccountDetails'
            - 'UpdateAccountSendingEnabled'
        errorCode: 'AccessDenied'
    filter_ses_service:
        userIdentity.type: 'Service'
        userIdentity.invokedBy: 'ses.amazonaws.com'
    condition: escalation_attempt and not filter_ses_service
falsepositives:
    - Developers testing IAM permission boundaries for SES administration
    - Incorrect IAM policy reviews that trigger AccessDenied for SES account mgmt
level: high
