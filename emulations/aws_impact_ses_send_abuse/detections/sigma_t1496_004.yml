title: Unexpected SES Email Identity Registration
id: 21ee0adb-b6e3-5de7-b37e-50e9941484d8
status: experimental
description: >
  Detects CreateEmailIdentity calls from non-standard principals. In cloud email
  hijacking (T1496.004), an adversary with a stolen session registers a new sender
  address to use as a From address for a spam campaign. Legitimate SES identity
  registrations are infrequent, infrastructure-driven events; ad-hoc calls from
  IAM roles — especially assumed-role sessions — are high-fidelity indicators.
references:
    - https://attack.mitre.org/techniques/T1496/004/
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_CreateEmailIdentity.html
author: MayaTrail
date: 2026/10/11
tags:
    - attack.impact
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    create_identity:
        eventSource: 'ses.amazonaws.com'
        eventName: 'CreateEmailIdentity'
    filter_assumed_role_automation:
        # Allow known CI/CD or IaC role session names if applicable
        userIdentity.type: 'AssumedRole'
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'pulumi'
            - 'terraform'
            - 'cdk'
            - 'cloudformation'
    condition: create_identity and not filter_assumed_role_automation
falsepositives:
    - IaC pipelines (Pulumi, Terraform, CDK) adding new verified sender domains or addresses
    - DevOps teams onboarding new sending identities for legitimate email services
level: medium
---
title: SES Email Identity Deleted Post-Campaign (Defense Evasion)
id: ed3d05a6-1c54-5684-9d1c-05ad235cc860
status: experimental
description: >
  Detects DeleteEmailIdentity following a recent CreateEmailIdentity from the
  same principal. After executing a spam campaign, adversaries delete the attacker-
  registered sender identity to remove evidence of their infrastructure (T1496.004,
  Defense Evasion). The delete event itself is an IOC: legitimate SES identity
  lifecycle management rarely pairs a create and delete within the same short
  session. Correlate with CreateEmailIdentity from the same userIdentity.arn or
  sessionContext.sessionIssuer within a 30-minute window.
references:
    - https://attack.mitre.org/techniques/T1496/004/
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_DeleteEmailIdentity.html
author: MayaTrail
date: 2026/10/11
tags:
    - attack.defense_evasion
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    delete_identity:
        eventSource: 'ses.amazonaws.com'
        eventName: 'DeleteEmailIdentity'
    filter_iac_roles:
        userIdentity.type: 'AssumedRole'
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'pulumi'
            - 'terraform'
            - 'cdk'
            - 'cloudformation'
    condition: delete_identity and not filter_iac_roles
falsepositives:
    - IaC teardown pipelines removing SES verified identities during environment cleanup
    - Legitimate domain decommissioning workflows
level: medium
