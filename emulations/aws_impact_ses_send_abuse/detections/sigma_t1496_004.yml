title: S3 Bucket Discovery During SES Abuse Campaign Staging
id: 5c01e0f9-abbd-5bc1-941c-55362b392cd9
status: experimental
description: >
  Detects ListBuckets calls from an assumed-role session that also generated SES
  API events within the same session. In cloud email hijacking (T1496.004), an
  adversary may enumerate S3 for email campaign templates, recipient lists, or
  stored SES configuration. A ListBuckets call paired with SES enumeration events
  (GetAccount, GetSendQuota, ListIdentities) from the same principal within a short
  window is a compound indicator of an active campaign-staging session.
  Note: S3 object-level access (ListObjectsV2, GetObject) is a data-plane event
  not visible in CloudTrail management events without explicit data event logging.
references:
    - https://attack.mitre.org/techniques/T1496/004/
author: MayaTrail
date: 2026/10/11
tags:
    - attack.discovery
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    s3_list_buckets:
        eventSource: 's3.amazonaws.com'
        eventName: 'ListBuckets'
        userIdentity.type: 'AssumedRole'
    filter_known_backup_roles:
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'backup'
            - 'audit'
            - 'compliance'
            - 'scanner'
    condition: s3_list_buckets and not filter_known_backup_roles
falsepositives:
    - Backup, compliance, or security tooling that enumerates all S3 buckets for auditing
    - IaC pipelines checking existing bucket state before provisioning
    - Cloud management platforms with broad discovery permissions
level: low
