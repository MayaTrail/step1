title: SES Credential Secret Read During Post-Compromise Discovery
id: b199142d-cc15-51dd-82de-6df0061fbfb7
status: experimental
description: >
  Detects GetSecretValue on secrets whose names contain SES-related patterns
  (ses, smtp, email, marketing) from an assumed-role session. In cloud email
  hijacking (T1496.004), an adversary harvests stored SES SMTP credentials from
  Secrets Manager to gain additional sending identities or higher-quota credentials
  beyond those available through the compromised role. Pairing ListSecrets with
  GetSecretValue in the same session is a strong indicator of credential harvesting.
references:
    - https://attack.mitre.org/techniques/T1496/004/
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
author: MayaTrail
date: 2026/10/11
tags:
    - attack.credential_access
    - attack.discovery
    - attack.t1496.004
logsource:
    product: aws
    service: cloudtrail
detection:
    get_secret:
        eventSource: 'secretsmanager.amazonaws.com'
        eventName: 'GetSecretValue'
        requestParameters.secretId|contains:
            - 'ses'
            - 'smtp'
            - 'email'
            - 'marketing'
            - 'sendgrid'
            - 'mailgun'
    filter_known_automation:
        userIdentity.type: 'AssumedRole'
        userIdentity.sessionContext.sessionIssuer.userName|contains:
            - 'lambda-exec'
            - 'ecs-task'
            - 'app-service'
    condition: get_secret and not filter_known_automation
falsepositives:
    - Application Lambda or ECS task execution roles legitimately reading SES credentials at startup
    - Rotation Lambda functions accessing SES secrets during scheduled rotation
level: high
