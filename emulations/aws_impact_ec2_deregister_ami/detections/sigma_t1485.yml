title: EC2 AMI Enumeration by Non-Service Principal
id: f311dbe8-66c5-5ae0-a6f8-719612399a9b
status: experimental
description: >
  Detects DescribeImages calls made by human or assumed-role principals rather than AWS
  service accounts. In the context of the AMI destruction chain, DescribeImages is the
  reconnaissance step used to resolve AMI IDs and their backing snapshot IDs before
  DisableImageDeregistrationProtection and DeregisterImage are invoked. On its own this
  is low-signal; correlate with subsequent DeregisterImage or DeleteSnapshot from the same
  principalId within the same session to elevate confidence to high.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeImages.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
    - attack.discovery
    - attack.t1580
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: DescribeImages
    filter_service_accounts:
        userIdentity.type:
            - 'AWSService'
            - 'Root'
    filter_known_automation:
        userIdentity.arn|contains:
            - 'AWSServiceRole'
            - 'aws-backup'
    condition: selection and not filter_service_accounts and not filter_known_automation
falsepositives:
    - Developers and operators browsing available AMIs via console or CLI
    - Configuration management tools inventorying base image versions
    - Security scanning tools enumerating EC2 resources for compliance
level: informational
