title: STS AssumeRole Targeting EC2 AMI Victim Role
id: fd97990b-46e4-5b11-a0e6-22a40bdaf38e
status: experimental
description: >
  Detects an AssumeRole call targeting an IAM role with naming patterns consistent with
  pre-seeded victim roles used in EC2 AMI destruction scenarios. An operator or compromised
  principal assuming a role scoped to EC2 image management (especially from an unexpected
  caller or IP) is an early indicator of a lateral-move-to-destruction chain under T1485.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
    - attack.privilege_escalation
    - attack.t1078
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleArn|contains:
            - 'deregister-ami'
            - 'ec2-image'
            - 'ami-victim'
            - 'ami-operator'
    filter_known_services:
        userIdentity.type: 'AWSService'
    condition: selection and not filter_known_services
falsepositives:
    - Authorized infrastructure automation assuming an AMI management role for scheduled builds
    - Security tooling assuming roles for inventory or compliance scans
level: medium
---
title: EBS Snapshot Deletion - AMI Backing Storage Destroyed
id: ada46fee-bfce-5771-9544-ca46c517f599
status: experimental
description: >
  Detects DeleteSnapshot API calls on EBS snapshots. When an adversary deregisters AMIs and
  then deletes the backing EBS snapshots, the destruction chain (T1485) is complete: no image
  and no block-device data remain. Standalone snapshot deletion is also used in ransomware
  pre-encryption phases to eliminate backup recovery paths. Elevated severity when correlated
  with prior DeregisterImage events from the same principal or session within a short window.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeleteSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: DeleteSnapshot
    filter_automated_backup_services:
        userIdentity.arn|contains:
            - 'AWSBackup'
            - 'aws-backup'
            - 'dlm'
            - 'DataLifecycleManager'
            - 'AWSServiceRole'
    condition: selection and not filter_automated_backup_services
falsepositives:
    - AWS Backup lifecycle policy expiring old snapshots
    - DLM (Data Lifecycle Manager) automated retention cleanup
    - Manual cleanup of personal development snapshots
level: medium
