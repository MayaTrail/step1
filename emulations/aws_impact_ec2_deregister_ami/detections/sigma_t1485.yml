title: EC2 AMI Deregistration - Data Destruction
id: 961938e8-de3d-580a-9aac-1599f8f9e2d8
status: experimental
description: >
  Detects DeregisterImage API calls against EC2 AMIs. Deregistering a production or backup AMI
  is a T1485 Data Destruction technique that permanently removes the image from the AMI registry,
  preventing new instances from being launched from it. Legitimate deregistration is rare and
  should be change-controlled.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeregisterImage.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: DeregisterImage
    filter_automated_pipelines:
        userIdentity.arn|contains:
            - 'codepipeline'
            - 'codebuild'
            - 'AWSServiceRole'
    condition: selection and not filter_automated_pipelines
falsepositives:
    - Planned AMI lifecycle management removing deprecated golden images
    - CI/CD pipeline post-bake cleanup removing temporary build AMIs
    - Automated AMI rotation scripts with controlled retention windows
level: high
---
title: EC2 AMI Deregistration Protection Disabled
id: 518a7dd0-b677-5cc3-97a2-0c85eb3d2202
status: experimental
description: >
  Detects DisableImageDeregistrationProtection API calls on EC2 AMIs. This action removes
  the guard that prevents accidental or malicious deregistration of an AMI. In an adversary
  scenario this is the precursor step to DeregisterImage (T1485). The sequence
  DisableImageDeregistrationProtection -> DeregisterImage constitutes deliberate destruction
  of machine images and is almost never a legitimate single-session operation.
references:
    - https://attack.mitre.org/techniques/T1485/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DisableImageDeregistrationProtection.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: DisableImageDeregistrationProtection
    filter_automated_pipelines:
        userIdentity.arn|contains:
            - 'codepipeline'
            - 'codebuild'
            - 'AWSServiceRole'
    condition: selection and not filter_automated_pipelines
falsepositives:
    - Scheduled AMI decommission workflows that explicitly remove protection before deletion
    - Infrastructure-as-code pipelines rotating base AMIs with explicit deprotect step
level: high
