title: HazyBeacon - Lambda Function Deployed by IAM User with Suspicious Naming Pattern
id: b14c5678-01b2-4d1e-e567-f890123a4b56
status: experimental
description: >
  Detects Lambda function creation by an IAM user principal where the function name matches
  generic benign-sounding naming patterns used by HazyBeacon (UpdateWorker, BackupHandler,
  ImageResizer) and the function has no VPC attachment. Legitimate infrastructure Lambda
  functions are deployed via CI/CD service roles, not static IAM user keys. A function with
  no VPC config and created by an interactive IAM user is consistent with attacker-deployed
  serverless relay infrastructure.
references:
    - https://attack.mitre.org/techniques/T1648/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.execution
    - attack.t1648
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: lambda.amazonaws.com
        eventName: CreateFunction20150331
        userIdentity.type: IAMUser
    filter_terraform_service_roles:
        userIdentity.arn|contains:
            - ':assumed-role/terraform'
            - ':assumed-role/deploy'
            - ':assumed-role/cicd'
            - ':assumed-role/github-actions'
    filter_cloudformation:
        userAgent|contains: 'cloudformation.amazonaws.com'
    condition: selection and not (filter_terraform_service_roles or filter_cloudformation)
falsepositives:
    - Developer deploying a personal Lambda function for testing via AWS CLI or SDK
    - Serverless Framework deployment using a developer IAM user key in non-prod accounts
    - AWS SAM local deploy with user credentials in a sandbox environment
level: high
