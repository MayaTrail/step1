title: HazyBeacon - Lambda Public URL Created with No Auth and Public Invoke Permission
id: d25d6789-12c3-4e2f-f678-0901234b5c67
status: experimental
description: >
  Detects creation of a Lambda Function URL with AuthType NONE (unauthenticated) or addition
  of a public invoke permission (principal '*') by an IAM user principal. This is the
  defining HazyBeacon C2 setup step - it exposes the relay function as an unauthenticated
  HTTPS endpoint at *.lambda-url.*.on.aws. No-auth Lambda URLs created outside CI/CD service
  roles are a high-confidence indicator of attacker-deployed serverless C2 infrastructure.
references:
    - https://attack.mitre.org/techniques/T1648/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.execution
    - attack.t1648
    - attack.command_and_control
    - attack.t1102
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_url_noauth:
        eventSource: lambda.amazonaws.com
        eventName: CreateFunctionUrlConfig
        requestParameters.authType: NONE
        userIdentity.type: IAMUser
    selection_public_invoke:
        eventSource: lambda.amazonaws.com
        eventName: AddPermission20150331
        requestParameters.principal: '*'
        userIdentity.type: IAMUser
    filter_service_deployments:
        userIdentity.arn|contains:
            - ':assumed-role/terraform'
            - ':assumed-role/deploy'
            - ':assumed-role/cicd'
    condition: (selection_url_noauth or selection_public_invoke) and not filter_service_deployments
falsepositives:
    - Developer testing a public Lambda endpoint for a personal project in a sandbox account
    - Workshop or lab environment where Lambda URL with no auth is an expected teaching pattern
level: high
