title: HazyBeacon - Bulk IAM Identity Enumeration from Static User Credential
id: 5c9e1234-d6f7-4a8b-b234-c567890d1e23
status: experimental
description: >
  Detects bulk IAM enumeration (ListUsers, ListRoles, GetAccountSummary) issued by an IAM
  user principal. HazyBeacon calls all three in sequence to map the full identity landscape
  after validating stolen credentials. Legitimate IAM auditing runs under service roles or
  cross-account audit roles, not static IAM user keys. Correlation across events within a
  short window raises confidence significantly.
references:
    - https://attack.mitre.org/techniques/T1087/004/
    - https://github.com/DataDog/stratus-red-team
author: MayaTrail
date: 2026/04/15
tags:
    - attack.discovery
    - attack.t1087.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - ListUsers
            - ListRoles
            - GetAccountSummary
        userIdentity.type: IAMUser
    filter_known_audit_roles:
        userIdentity.arn|contains:
            - 'SecurityAuditRole'
            - 'ReadOnlyRole'
            - 'AuditRole'
    condition: selection and not filter_known_audit_roles
falsepositives:
    - IAM auditing tools (Prowler, ScoutSuite, Steampipe) configured to run under IAM user keys
    - Cloud governance scripts in dev environments using personal IAM credentials
    - AWS Organizations management account performing periodic inventory
level: medium
