title: HazyBeacon - Stolen IAM Credential Validation via STS and IAM
id: 3a7f8b12-c4d5-4e6f-a123-b456789c0d12
status: experimental
description: >
  Detects GetCallerIdentity or GetUser calls originating from an IAM user principal.
  HazyBeacon validates harvested static credentials (from ~/.aws/credentials) by calling
  these two APIs immediately after obtaining a stolen key. Legitimate automated workloads
  authenticate via service roles (AssumedRole), not long-lived IAM user keys.
references:
    - https://attack.mitre.org/techniques/T1078/004/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.initial_access
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName:
            - GetCallerIdentity
            - GetUser
        userIdentity.type: IAMUser
    filter_interactive_console:
        userAgent|contains:
            - 'console.amazonaws.com'
            - 'Coral/Jakarta'
    condition: selection and not filter_interactive_console
falsepositives:
    - Developer running "aws sts get-caller-identity" to verify CLI profile config
    - Security scanner baseline sweep (aws-vault, CloudSploit, Prowler) using IAM user keys
    - Break-glass admin procedure using a static emergency IAM credential
level: medium
