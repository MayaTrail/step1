title: DynamoDB DescribeExport Polling - Attacker Confirming Export Completion
id: e5f6a7b8-c9d0-1234-ef01-345678901205
status: experimental
description: |
    Detects repeated DynamoDB DescribeExport API calls from the same principal
    within a short time window. After triggering ExportTableToPointInTime, an
    attacker polls DescribeExport to confirm the export has reached COMPLETED
    status before attempting to access the S3 output. In the ATOMIC emulation the
    attack script polls at 15-second intervals for up to 40 attempts (600 seconds
    total). Legitimate orchestration services typically use EventBridge or Lambda
    to receive export completion events rather than polling. Multiple DescribeExport
    calls from the same AssumedRole session within 10 minutes is a strong indicator
    of attacker confirmation behavior following ExportTableToPointInTime.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_DescribeExport.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'DescribeExport'
    filter_known_backup_roles:
        userIdentity.arn|contains:
            - 'DynamoDBBackupAutomation'
            - 'scheduled-backup'
            - 'backup-service-role'
    condition: selection_event and not filter_known_backup_roles
falsepositives:
    - Backup monitoring scripts that poll export status via DescribeExport
    - Data pipeline orchestrators (Step Functions, Airflow) checking export progress
level: medium
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.exportArn
    - responseElements.exportDescription.exportStatus
    - sourceIPAddress
    - awsRegion
