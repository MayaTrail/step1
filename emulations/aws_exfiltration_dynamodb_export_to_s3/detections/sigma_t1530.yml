title: DynamoDB ExportTableToPointInTime - Bulk Data Exfiltration to S3
id: d4e5f6a7-b8c9-0123-def0-234567890104
status: experimental
description: |
    Detects DynamoDB ExportTableToPointInTime API calls, which trigger a full
    table dump to an S3 bucket. This API bypasses per-item visibility entirely --
    no GetItem or Scan calls appear in CloudTrail, and the actual S3 writes are
    performed by the DynamoDB service principal rather than the caller. This makes
    it a stealthy bulk-exfiltration path: the only CloudTrail signal is this single
    control-plane event. In the ATOMIC-dynamodb-export-to-s3 emulation the attacker
    calls this on 'prod-customers' (PII table) using a victim-role STS session,
    routing the exported data to an in-account S3 sink bucket. Any use of this API
    from an AssumedRole principal should be treated with high suspicion unless the
    caller is a known backup automation service account.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ExportTableToPointInTime.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
    - attack.exfiltration
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'ExportTableToPointInTime'
    filter_known_backup_roles:
        # Adjust to match your environment's approved DynamoDB backup automation roles
        userIdentity.arn|contains:
            - 'DynamoDBBackupAutomation'
            - 'scheduled-backup'
            - 'backup-service-role'
    condition: selection_event and not filter_known_backup_roles
falsepositives:
    - Scheduled DynamoDB backup jobs using ExportTableToPointInTime
    - Data engineering pipelines exporting DynamoDB data to S3 for analytics (Glue, EMR)
    - Disaster recovery procedures run by authorized operations teams
level: critical
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.type
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.tableArn
    - requestParameters.s3Bucket
    - requestParameters.s3Prefix
    - responseElements.exportDescription.exportArn
    - responseElements.exportDescription.exportStatus
    - sourceIPAddress
    - awsRegion
