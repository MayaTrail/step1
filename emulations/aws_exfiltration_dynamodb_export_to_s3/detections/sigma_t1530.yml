title: DynamoDB DescribeTable Reconnaissance on Sensitive or Honey Tables
id: c3d4e5f6-a7b8-9012-cdef-123456789003
status: experimental
description: |
    Detects DescribeTable calls on DynamoDB tables whose names suggest PII,
    credentials, or honey-token data. In the ATOMIC-dynamodb-export-to-s3
    emulation, the attacker calls DescribeTable on both 'prod-customers' (to obtain
    the ARN for ExportTableToPointInTime) and 'internal-api-keys' (credential-named
    honey table). DescribeTable is the attacker's pre-export reconnaissance step --
    it reveals item count and table ARN required to trigger the export. Accessing a
    honey table named 'internal-api-keys' is a near-certain indicator of malicious
    intent. Correlate with ListTables in the same session to identify full
    enumeration sequences.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_DescribeTable.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'DescribeTable'
    selection_sensitive_table:
        requestParameters.tableName|contains:
            - 'customer'
            - 'api-key'
            - 'secret'
            - 'credential'
            - 'password'
            - 'token'
            - 'pii'
            - 'prod'
            - 'internal'
    selection_honey_table:
        requestParameters.tableName|contains:
            - 'internal-api-keys'
            - 'api-keys'
            - 'honey'
    filter_legitimate_services:
        userIdentity.arn|contains:
            - ':assumed-role/AWSServiceRole'
            - ':assumed-role/aws-service-role'
    # High-confidence: DescribeTable on a honey table is almost always malicious
    condition: selection_event and (selection_honey_table or (selection_sensitive_table and not filter_legitimate_services))
falsepositives:
    - Application monitoring tools that inspect DynamoDB table metrics by name pattern
    - Database administrators performing routine table health checks
    - IaC deployments verifying existing table configurations before apply
level: high
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.type
    - requestParameters.tableName
    - sourceIPAddress
    - awsRegion
