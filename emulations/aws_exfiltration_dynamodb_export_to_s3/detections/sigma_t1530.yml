title: DynamoDB Export Exfiltration Chain - Full Attack Sequence Composite
id: f6a7b8c9-d0e1-2345-f012-456789012306
status: experimental
description: |
    High-confidence composite rule detecting the full ATOMIC-dynamodb-export-to-s3
    kill chain within a single STS session: ListTables followed by DescribeTable
    followed by ExportTableToPointInTime from the same assumed-role ARN. Each event
    alone has moderate FP potential; the sequence within one STS session (same
    userIdentity.sessionContext.sessionIssuer and roleSessionName) is highly
    anomalous. The combination of enumeration + reconnaissance + bulk export is the
    definitive indicator of T1530 via the DynamoDB native export path.
    Implementation note: correlate by userIdentity.sessionContext.sessionIssuer.arn
    within a 30-minute sliding window. Use the individual component rules for
    real-time alerting; use this rule for retrospective threat hunting.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ExportTableToPointInTime.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_enumeration:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'ListTables'
        userIdentity.type: 'AssumedRole'
    selection_describe:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'DescribeTable'
        userIdentity.type: 'AssumedRole'
    selection_export:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'ExportTableToPointInTime'
        userIdentity.type: 'AssumedRole'
    # Temporal correlation: all three events from the same assumed-role session
    # within a 30-minute window. Backend SIEM must group by:
    #   userIdentity.sessionContext.sessionIssuer.arn
    # and check that all three selections match within the time window.
    condition: selection_enumeration and selection_describe and selection_export
falsepositives:
    - Fully automated DynamoDB backup scripts that enumerate, describe, and export
      tables in sequence using a dedicated backup role -- verify role ARN against
      known backup automation before dismissing
level: critical
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.type
    - userIdentity.sessionContext.sessionIssuer.arn
    - requestParameters.tableName
    - requestParameters.tableArn
    - requestParameters.s3Bucket
    - sourceIPAddress
    - awsRegion
