title: Attacker STS AssumeRole into DynamoDB Victim Role
id: a1b2c3d4-e5f6-7890-abcd-ef1234567801
status: experimental
description: |
    Detects an IAM user assuming a role whose name contains patterns consistent
    with a DynamoDB data-export victim role. In the ATOMIC-dynamodb-export-to-s3
    emulation, an attacker assumes 'atomic-dynamodb-export-to-s3-victim-role' with
    roleSessionName 'atomic-t1530-session' using a long-lived static access key.
    Legitimate automation does not typically create named STS sessions with
    T1530-style session names or assume roles scoped explicitly for DynamoDB export
    access from interactive/external principals.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'sts.amazonaws.com'
        eventName: 'AssumeRole'
    selection_session_name:
        requestParameters.roleSessionName|contains:
            - 't1530'
            - 'atomic'
            - 'export-to-s3'
    selection_role_name:
        requestParameters.roleArn|contains:
            - 'export-to-s3'
            - 'dynamodb-export'
    filter_service_accounts:
        userIdentity.arn|contains:
            - ':assumed-role/AWSServiceRole'
            - ':assumed-role/aws-service-role'
    condition: selection_event and (selection_session_name or selection_role_name) and not filter_service_accounts
falsepositives:
    - Automated CI/CD pipelines that assume DynamoDB backup roles with verbose session names
    - Disaster recovery scripts that export DynamoDB to S3 on a schedule
level: high
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.type
    - requestParameters.roleArn
    - requestParameters.roleSessionName
    - sourceIPAddress
    - awsRegion
