title: DynamoDB Table Enumeration via ListTables
id: b2c3d4e5-f6a7-8901-bcde-f12345678902
status: experimental
description: |
    Detects DynamoDB ListTables API calls issued from an STS assumed-role session
    (AssumedRole principal type). In the ATOMIC-dynamodb-export-to-s3 emulation,
    the attacker enumerates all tables in the region immediately after assuming the
    victim role, scanning for high-value PII and credential-named tables before
    triggering ExportTableToPointInTime. Legitimate services that read DynamoDB
    tables reference them by name directly and rarely need to enumerate all tables
    from a role that was assumed by an external IAM user.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ListTables.html
author: MayaTrail
date: 2026/08/26
tags:
    - attack.collection
    - attack.t1530
    - attack.discovery
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'dynamodb.amazonaws.com'
        eventName: 'ListTables'
    selection_caller_type:
        userIdentity.type: 'AssumedRole'
    filter_legitimate_services:
        userIdentity.arn|contains:
            - ':assumed-role/AWSServiceRole'
            - ':assumed-role/aws-service-role'
            - 'lambda_basic_execution'
            - 'LambdaExecution'
    condition: selection_event and selection_caller_type and not filter_legitimate_services
falsepositives:
    - DynamoDB management dashboards that enumerate tables for display
    - IaC frameworks (Pulumi, Terraform) inspecting existing infrastructure during plan/apply
    - Application bootstrapping code that discovers tables dynamically at startup
level: medium
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - userIdentity.type
    - userIdentity.sessionContext.sessionIssuer.arn
    - sourceIPAddress
    - awsRegion
