# Attempt to Leave the AWS Organization (T1666)
#
# NO errorCode FILTER, ON PURPOSE. This emulation's LeaveOrganization is ALWAYS refused: the lab
# role carries an explicit IAM Deny on organizations:LeaveOrganization, so the event lands with
# an access-denied errorCode (Stratus's own sample shows `AccessDenied`; the Organizations API
# documents AccessDeniedException). In a real estate the same is true of most attempts - an SCP
# denies it, or the account is the management account (MasterCannotLeaveOrganizationException),
# or it is not in an organization at all (AWSOrganizationsNotInUseException). A rule that keeps
# only successes sees none of them, and a successful leave is the one case where the
# organization's controls - SCPs, the organization trail, delegated GuardDuty and Security Hub -
# are already gone by the time anyone looks.
#
# FIELD SHAPE. eventSource organizations.amazonaws.com. Organizations is a global service; its
# events are recorded in us-east-1 whatever Region the caller used. LeaveOrganization takes no
# parameters, so requestParameters is null and the only discriminators are the principal and the
# account (recipientAccountId).
title: Attempt to leave the AWS Organization
id: 7e156778-0da3-508d-833b-bf2778882885
name: organizations_leave_attempt
status: experimental
description: >-
  Detects organizations:LeaveOrganization, successful or refused. A member account leaving the
  organization escapes SCPs, the organization trail and delegated security tooling; a refused
  attempt shows the same intent and should be investigated as an active intrusion.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.defense-evasion.organizations-leave/
  - https://attack.mitre.org/techniques/T1666/
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_LeaveOrganization.html
tags:
  - attack.defense_impairment
  - attack.t1666
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'organizations.amazonaws.com'
    eventName: 'LeaveOrganization'
  condition: selection
falsepositives:
  - A planned, change-managed account migration between organizations. It is rare, done from a
    named administrative role, and announced in advance.
level: high
---
# The management-account side of the same outcome: the management account removing a member.
# Recorded in the management account's trail, not the member's.
title: Account removed from the AWS Organization
id: c217d04a-c80f-4a57-b7c7-b3c744bda9bb
status: experimental
description: >-
  Detects organizations:RemoveAccountFromOrganization. The removed account stops being governed
  by the organization's SCPs, organization trail and delegated security services.
references:
  - https://attack.mitre.org/techniques/T1666/
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_RemoveAccountFromOrganization.html
tags:
  - attack.defense_impairment
  - attack.t1666
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'organizations.amazonaws.com'
    eventName: 'RemoveAccountFromOrganization'
  condition: selection
falsepositives:
  - Account decommissioning or transfer by the organization's administrators.
level: high
