# Base rule - sequence component only, not for direct alerting. DescribeOrganization is called
# constantly by tooling; on its own it means nothing.
title: AWS Organization membership read
id: 16359f90-57f0-4350-b8a6-bc70fdc11225
name: organizations_describe_bb
status: experimental
description: Base rule - sequence component only, not for direct alerting.
references:
  - https://attack.mitre.org/techniques/T1666/
tags:
  - attack.defense_impairment
  - attack.t1666
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'organizations.amazonaws.com'
    eventName: 'DescribeOrganization'
  condition: selection
level: informational
---
# Confirm membership, then try to leave: the shape of a deliberate attempt rather than a
# misfired script, and exactly the sequence this emulation performs. Grouped on the principal.
title: Organization membership checked, then leave attempted by the same principal
id: c07e3756-a3cf-430e-9dcd-ae7dc12a7d6c
status: experimental
description: >-
  One principal read its organization membership and then called LeaveOrganization within an
  hour, successful or not.
references:
  - https://attack.mitre.org/techniques/T1666/
tags:
  - attack.defense_impairment
  - attack.t1666
correlation:
  type: temporal_ordered
  rules:
    - organizations_describe_bb
    - organizations_leave_attempt
  group-by:
    - userIdentity.arn
  timespan: 1h
level: high
