title: IAM OIDC Provider Deleted (Indicator Removal After Backdoor Installation)
id: 87472324-777b-52c5-8da4-835dd7a1a05e
status: experimental
description: >
  Detects deletion of an IAM OIDC identity provider via DeleteOpenIDConnectProvider.
  In the OIDC backdoor attack chain, an attacker who created a shadow OIDC provider
  entry calls this after using it to create a federated role, removing the immediate
  indicator while leaving the role as the persistent backdoor. Legitimate OIDC provider
  deletion is extremely rare outside full IaC teardown; ad-hoc calls from
  non-infrastructure principals warrant immediate investigation. Correlate with prior
  CreateOpenIDConnectProvider or CreateRole (Federated) events from the same principal.
references:
    - https://attack.mitre.org/techniques/T1484/002/
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteOpenIDConnectProvider.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: DeleteOpenIDConnectProvider
    filter_iac:
        userIdentity.arn|contains:
            - 'terraform'
            - 'pulumi'
            - 'cdk'
            - 'AWSServiceRole'
    condition: selection and not filter_iac
falsepositives:
    - IaC teardown of a decommissioned GitHub Actions OIDC integration
    - Platform engineering migrating OIDC providers between accounts
level: high
