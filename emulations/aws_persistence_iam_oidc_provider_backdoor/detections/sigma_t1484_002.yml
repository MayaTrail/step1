title: Failed AssumeRoleWithWebIdentity Attempt Against IAM Role (InvalidIdentityToken)
id: 829233bc-57f5-59a7-93ff-14e984ea68be
status: experimental
description: >
  Detects failed AssumeRoleWithWebIdentity calls with errorCode InvalidIdentityToken.
  This occurs when an attacker probes or verifies a freshly installed OIDC backdoor
  role using a synthetic or expired JWT web identity token. A real GitHub Actions
  workflow would supply a valid OIDC token, so InvalidIdentityToken from an unexpected
  principal or IP is a reliable signal of role probing. Correlate with prior
  CreateOpenIDConnectProvider or CreateRole (Federated) events in the same session.
references:
    - https://attack.mitre.org/techniques/T1484/002/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRoleWithWebIdentity
        errorCode: InvalidIdentityToken
    condition: selection
falsepositives:
    - Misconfigured GitHub Actions workflows passing stale or malformed tokens
    - Developer testing OIDC federation with manually crafted tokens
    - Clock skew causing legitimate token expiry before STS evaluation
level: medium
