title: Backdoor IAM OIDC Provider Created for GitHub Actions
id: 604453bd-39c1-5a2a-85fe-97ad8e0a2f9b
status: experimental
description: >
  Detects creation of an IAM OIDC identity provider pointing to
  token.actions.githubusercontent.com. Legitimate providers are provisioned once
  during IaC bootstrapping; out-of-band CreateOpenIDConnectProvider calls from
  non-infrastructure principals are a strong signal of OIDC backdoor installation.
  An attacker who creates or piggybacks on this provider can then create a federated
  role whose trust policy allows any GitHub Actions token to assume it.
references:
    - https://attack.mitre.org/techniques/T1484/002/
    - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: CreateOpenIDConnectProvider
        requestParameters.url|contains: 'token.actions.githubusercontent.com'
    filter_iac:
        userIdentity.arn|contains:
            - 'terraform'
            - 'pulumi'
            - 'cdk'
            - 'AWSServiceRole'
    condition: selection and not filter_iac
falsepositives:
    - First-time IaC deployment adding the GitHub OIDC provider to a new AWS account
    - Platform engineering scripts setting up GitHub Actions federation for the first time
level: high
