title: IAM OIDC Provider Enumeration via ListOpenIDConnectProviders
id: 3c83a164-8811-5746-a7fd-73f4e76c5e47
status: experimental
description: >
  Detects enumeration of IAM OIDC identity providers via ListOpenIDConnectProviders.
  Attackers call this before creating a backdoor OIDC provider or federated role to
  discover existing provider ARNs that can serve as trust anchors. Elevated risk when
  the caller is not a known automation principal or when paired with CreateRole or
  CreateOpenIDConnectProvider in the same session.
references:
    - https://attack.mitre.org/techniques/T1484/002/
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_ListOpenIDConnectProviders.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: ListOpenIDConnectProviders
    filter_automation:
        userIdentity.arn|contains:
            - 'terraform'
            - 'pulumi'
            - 'cdk'
            - 'sso'
            - 'AWSServiceRole'
    condition: selection and not filter_automation
falsepositives:
    - IaC tooling (Terraform, Pulumi, CDK) auditing OIDC provider state during plan/apply
    - Security audit scripts enumerating IAM identity providers
    - AWS SSO/IAM Identity Center service actions
level: low
