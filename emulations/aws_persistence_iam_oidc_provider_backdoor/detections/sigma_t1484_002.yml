title: IAM Federated Role Deleted Shortly After Creation (OIDC Backdoor Cleanup)
id: ca945dc1-9ec8-5579-93c7-7581b93f6996
status: experimental
description: >
  Detects deletion of an IAM role that was created with a Federated OIDC trust policy
  within a short window. Attackers who install an OIDC backdoor and then attempt to
  clean indicator artefacts will call DeleteRole against the same role ARN. On its own,
  DeleteRole is low-fidelity; paired with a prior CreateRole (Federated) event in the
  same CloudTrail session or from the same principal, it indicates an indicator-removal
  phase following OIDC backdoor installation. Correlate with
  sigma_t1484_002_create_federated_role.
references:
    - https://attack.mitre.org/techniques/T1484/002/
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: DeleteRole
    filter_iac:
        userIdentity.arn|contains:
            - 'terraform'
            - 'pulumi'
            - 'cdk'
            - 'AWSServiceRole'
    condition: selection and not filter_iac
falsepositives:
    - IaC destroy operations tearing down legitimate federated roles
    - Routine role lifecycle management by platform engineering
level: low
