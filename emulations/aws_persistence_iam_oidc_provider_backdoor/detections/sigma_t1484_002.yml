title: IAM Role Created with OIDC Federated Trust Policy (GitHub Actions Backdoor)
id: 9dab3b86-195b-50ee-8c00-2173ca97fb6d
status: experimental
description: >
  Detects creation of an IAM role whose trust policy contains a Federated principal
  referencing an IAM OIDC provider (oidc-provider/). This is the primary persistence
  primitive in OIDC backdoor attacks: a standing IAM identity that any future GitHub
  Actions token satisfying the sub condition can assume via AssumeRoleWithWebIdentity.
  Legitimate federated roles are provisioned by IaC; ad-hoc CreateRole calls with
  Federated OIDC principals from non-infrastructure identities are high-fidelity.
references:
    - https://attack.mitre.org/techniques/T1484/002/
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1484.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: CreateRole
        requestParameters.assumeRolePolicyDocument|contains: 'oidc-provider'
    selection_github:
        requestParameters.assumeRolePolicyDocument|contains: 'token.actions.githubusercontent.com'
    filter_iac:
        userIdentity.arn|contains:
            - 'terraform'
            - 'pulumi'
            - 'cdk'
            - 'AWSServiceRole'
    condition: (selection or selection_github) and not filter_iac
falsepositives:
    - Platform engineering creating federated deploy roles via IaC pipelines
    - CDK/Terraform bootstrapping GitHub Actions integration roles
level: high
