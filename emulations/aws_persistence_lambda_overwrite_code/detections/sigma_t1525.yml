# Overwrite Lambda Function Code (T1525)
#
# The original rule matched GetFunction + UpdateFunctionCode with a bare
# `condition: selection`. UpdateFunctionCode fires on every legitimate deploy;
# GetFunction fires on every console view and CI read. Neither the principal
# nor the code hash was checked. GetFunction is demoted to a sequence component.
#
# Unlike the layer technique, the overwritten code IS the handler: it runs
# UNCONDITIONALLY on every invocation, so execution-role compromise is certain
# rather than conditional.
title: Lambda code overwritten by non-deploy principal
id: 274eb866-eafc-55a7-b8e4-462aed6dd025
name: lambda_updatecode_nondeploy
status: experimental
description: >-
  Function code replaced by a principal outside the deployment pipeline. The
  new code runs on every invocation under the function's execution role.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-overwrite-code/
tags:
  - attack.persistence
  - attack.t1525
  - attack.t1554
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'lambda.amazonaws.com'
    eventName: 'UpdateFunctionCode'
  # REPLACE these with the roles in YOUR account that legitimately deploy
  # Lambda function code. The placeholder values below match nothing, so until
  # they are edited this rule fires on every deployment.
  deploy_pipeline:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-iac-deploy'
      - ':role/REPLACE-ME-ci'
      - ':role/REPLACE-ME-break-glass'
  condition: selection and not deploy_pipeline
falsepositives:
  - Manual hotfix deploys outside the pipeline, should be rare and traceable
level: high
---
title: Lambda GetFunction then UpdateFunctionCode sequence
id: 7b3e0d52-6f84-4a39-b2e7-9a1d8b4f3c58
status: experimental
description: >-
  Function code downloaded and then replaced by the same principal within ten
  minutes, the actor read the original before overwriting it, typically to
  preserve behaviour while adding their own.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-overwrite-code/
tags:
  - attack.persistence
  - attack.t1525
correlation:
  type: temporal_ordered
  rules:
    - lambda_get_function
    - lambda_updatecode_nondeploy
  group-by:
    - userIdentity.arn
  timespan: 10m
level: high
---
title: Lambda GetFunction
id: 8c4f1e63-7a95-4b40-a3f8-0b2e9c5a4d69
name: lambda_get_function
status: experimental
description: Base rule, sequence component only, not for direct alerting.
tags:
  - attack.persistence
  - attack.t1525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'lambda.amazonaws.com'
    eventName: 'GetFunction'
  condition: selection
level: low
