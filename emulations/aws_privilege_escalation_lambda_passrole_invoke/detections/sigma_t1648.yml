title: Multi-Service Discovery Enumeration Preceding Lambda PassRole Attack - discovery call
name: lambda_passrole_discovery_calls
status: experimental
description: Base rule for the correlation 'Multi-Service Discovery Enumeration Preceding Lambda PassRole
  Attack'. Matches the single event by design; deploy the correlation, not this rule.
tags:
- attack.discovery
- attack.privilege_escalation
- attack.t1648
- attack.t1526
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource:
    - lambda.amazonaws.com
    - iam.amazonaws.com
    - secretsmanager.amazonaws.com
    eventName:
    - ListFunctions20150331
    - ListRoles
    - GetRole
    - ListSecrets
    - GetCallerIdentity
  condition: selection
falsepositives:
- Cloud security posture management tools and asset inventory scanners
- DevOps engineers performing multi-service health checks
- AWS Config, SecurityHub, or similar AWS-native inventory services
- Automated on-call runbooks that enumerate resources during incident response
level: low
