title: Lambda Privilege Escalation via IAM PassRole on CreateFunction
id: 61b8f667-bc5a-5c22-b669-fe1be502cccc
status: experimental
description: >
  Detects AWS Lambda function creation by a non-service, non-IaC principal. Attackers with
  lambda:CreateFunction and iam:PassRole can create a function whose execution role grants
  privileges the caller does not directly hold (T1648). The assigned role becomes the effective
  identity for all actions the function takes, allowing collection or lateral movement beyond
  the caller's own permission boundary.
references:
    - https://attack.mitre.org/techniques/T1648/
    - https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
author: MayaTrail
date: 2026/10/11
tags:
    - attack.privilege_escalation
    - attack.execution
    - attack.t1648
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'lambda.amazonaws.com'
        eventName: 'CreateFunction20150331'
    filter_service_principal:
        userIdentity.type: 'Service'
    filter_iac_useragent:
        userAgent|contains:
            - 'pulumi'
            - 'terraform'
            - 'cloudformation'
            - 'aws-cdk'
            - 'aws-console-backend'
    condition: selection and not filter_service_principal and not filter_iac_useragent
falsepositives:
    - Developers deploying Lambda functions via CLI or custom scripts
    - CI/CD pipelines using custom deployment tooling not identified as IaC
    - Legitimate Lambda management automation
level: medium
