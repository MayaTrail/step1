title: Lambda Function Deletion by Interactive Principal - Potential Attacker Cleanup
id: ba958adc-2593-5cf7-8f7b-755d70f784f7
status: experimental
description: >
  Detects Lambda function deletion by a non-service, non-IaC principal. Following T1648
  PassRole privilege escalation via Lambda, attackers delete their created function to remove
  the persistent configuration artifact (T1070). The short function lifetime (create->invoke->
  delete in under 60 seconds) is a high-confidence cleanup indicator when correlated with a
  recent CreateFunction by the same principal. This rule flags the deletion event; pair with
  sigma_t1648_lambda_passrole_create for full lifecycle correlation.
references:
    - https://attack.mitre.org/techniques/T1648/
    - https://attack.mitre.org/techniques/T1070/
author: MayaTrail
date: 2026/10/11
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.execution
    - attack.t1648
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'lambda.amazonaws.com'
        eventName: 'DeleteFunction20150331'
    filter_service_principal:
        userIdentity.type: 'Service'
    filter_iac_useragent:
        userAgent|contains:
            - 'pulumi'
            - 'terraform'
            - 'cloudformation'
            - 'aws-cdk'
    condition: selection and not filter_service_principal and not filter_iac_useragent
falsepositives:
    - Integration test teardown creating and deleting Lambda functions in CI pipelines
    - Developer iteration loops with rapid deploy-test-delete cycles
    - Scheduled Lambda cleanup automation removing deprecated functions
level: low
