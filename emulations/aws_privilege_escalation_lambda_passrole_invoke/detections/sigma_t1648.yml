title: Multi-Service Discovery Enumeration Preceding Lambda PassRole Attack
status: experimental
description: 'Detects a burst of cross-service discovery API calls (Lambda, IAM, Secrets Manager) from
  a single principal within a short window. This pattern precedes T1648 Lambda PassRole privilege escalation:
  an attacker enumerates Lambda functions to map the serverless landscape, IAM roles to find a passable
  privileged role, and secrets to identify the exfiltration target. Three or more distinct discovery calls
  from one identity within 10 minutes is a strong composite indicator.'
references:
- https://attack.mitre.org/techniques/T1648/
- https://attack.mitre.org/tactics/TA0007/
author: MayaTrail
date: 2026/10/11
tags:
- attack.discovery
- attack.privilege_escalation
- attack.t1648
- attack.t1526
correlation:
  type: event_count
  rules:
  - lambda_passrole_discovery_calls
  group-by:
  - userIdentity.arn
  timespan: 10m
  condition:
    gt: 2
falsepositives:
- Cloud security posture management tools and asset inventory scanners
- DevOps engineers performing multi-service health checks
- AWS Config, SecurityHub, or similar AWS-native inventory services
- Automated on-call runbooks that enumerate resources during incident response
level: medium
