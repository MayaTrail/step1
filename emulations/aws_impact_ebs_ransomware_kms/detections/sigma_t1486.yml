title: KMS CMK Scheduled for Deletion Immediately After EBS Destruction (Ransomware Ransom Demand)
id: 2364a299-54e8-5eb6-9096-ef1b58d62c5c
status: experimental
description: |
  Detects ScheduleKeyDeletion on a KMS Customer Managed Key within a short time window
  after DeleteVolume or DeleteSnapshot events. This is the ransomware "ransom demand"
  signature: attacker re-encrypts victim data under their CMK, deletes originals, then
  schedules their key for deletion to create an artificial deadline. Victim data will be
  permanently unrecoverable when the key self-destructs unless the ransom is paid.
  Note: ScheduleKeyDeletion alone is not unusual; the temporal correlation with EBS
  destruction events is what elevates severity.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/kms/latest/APIReference/API_ScheduleKeyDeletion.html
    - https://docs.aws.amazon.com/securityhub/latest/userguide/kms-controls.html#kms-3
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: ScheduleKeyDeletion
        eventSource: kms.amazonaws.com
    filter_legitimate:
        # Suppress known key rotation or scheduled retirement workflows.
        # Populate with automation role ARNs used by your key lifecycle processes.
        userIdentity.arn|contains:
            - 'key-rotation-automation'
            - 'kms-lifecycle-role'
    condition: selection and not filter_legitimate
falsepositives:
    - Authorized key retirement as part of planned infrastructure decommission.
    - IaC teardown (e.g., pulumi destroy, terraform destroy) that schedules CMK deletion
      as part of lab or staging environment cleanup. Tune by suppressing when the call is from
      a known CI/CD role or IaC deploy principal.
    - Security team testing KMS key lifecycle procedures.
level: high
