title: EBS Snapshot Re-encrypted Under External KMS Key (Ransomware Key-Swap)
id: 5501ed97-3042-5905-bd90-3a6f0051c06d
status: experimental
description: |
  Detects CopySnapshot calls where the destination encryption key (kmsKeyId) belongs to
  a different AWS account than the caller. This is the core ransomware key-swap primitive:
  attacker re-encrypts victim snapshot data under an attacker-controlled CMK, then deletes
  originals. Victim loses access to their own data without the attacker key.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CopySnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: CopySnapshot
        eventSource: ec2.amazonaws.com
    # Flag copies that specify an explicit kmsKeyId ARN - legitimate intra-account
    # copies typically inherit the source key or use the account's default EBS CMK.
    # Cross-account key ARNs contain a different account ID than the caller's account.
    # SIEM rule: alert when requestParameters.kmsKeyId is present and non-empty.
    # Tuning: suppress if kmsKeyId account component matches caller account ID.
    with_external_key:
        requestParameters.kmsKeyId|startswith: 'arn:aws:kms:'
    condition: selection and with_external_key
falsepositives:
    - Authorized disaster-recovery workflows that explicitly re-key snapshots during
      cross-account copy (e.g., sharing snapshots to a backup account with that account's key).
    - Intra-account copies that specify a non-default CMK ARN for compliance purposes.
    - Tune by allowlisting known-safe kmsKeyId ARNs or accounts in the filter below.
level: high
---
title: EBS Volume and Snapshot Bulk Deletion from Single Principal (Ransomware Destruction Phase)
id: b844ceb0-d852-56a5-8467-903ea699204d
status: experimental
description: |
  Detects both DeleteVolume and DeleteSnapshot issued by the same IAM principal within
  a short window. Legitimate operations rarely delete an EBS volume and its associated
  snapshot in the same session. Combined with prior CopySnapshot events, this pattern
  indicates the destruction phase of an EBS ransomware chain where originals are wiped
  after re-encryption under an attacker-controlled key.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeleteVolume.html
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeleteSnapshot.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_delete_volume:
        eventName: DeleteVolume
        eventSource: ec2.amazonaws.com
    selection_delete_snapshot:
        eventName: DeleteSnapshot
        eventSource: ec2.amazonaws.com
    # This rule fires on each individual event. Correlation logic (same principal,
    # <5 min window) must be implemented in the SIEM. Pair with CopySnapshot alert
    # for the full ransomware chain signature.
    condition: selection_delete_volume or selection_delete_snapshot
falsepositives:
    - Automated cleanup pipelines that decommission EBS volumes and their snapshots
      as part of instance termination workflows.
    - Cost-optimization scripts that delete old unattached volumes and stale snapshots.
    - Tune by suppressing when userIdentity.arn matches known automation role ARNs.
level: medium
