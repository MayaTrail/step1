title: KMS Key Policy Modification Denied - Attempted Account Lockout
id: 4e0883db-2ec9-59c3-aa6f-b3a01cc2d864
status: experimental
description: |
  Detects PutKeyPolicy calls on KMS CMKs that return AccessDenied. Attackers who have
  re-encrypted victim data under their own CMK may attempt to replace the key policy to
  lock the account owner out of the key entirely, eliminating any administrative recovery
  path. A deny-guard IAM policy blocks this call, but CloudTrail still records the attempt.
  Detection rules must NOT filter on errorCode IS NULL for this event - the AccessDenied
  response IS the indicator of compromise.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://docs.aws.amazon.com/kms/latest/APIReference/API_PutKeyPolicy.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: PutKeyPolicy
        eventSource: kms.amazonaws.com
        errorCode: AccessDenied
    condition: selection
falsepositives:
    - Misconfigured automation attempting key policy updates without sufficient IAM permissions.
    - Developer error from testing key policy changes against a restricted key.
    - SCPs or permission boundaries legitimately blocking non-critical key policy changes.
level: high
