# Create IAM User with Console Access (T1136.003)
#
# The original rule matched CreateUser / CreateLoginProfile / DeleteLoginProfile
# / DeleteUser with a bare `condition: selection`. It was noisy AND
# SIGNAL-INVERTED: it fired on every onboarding and every offboarding, and
# bundling the Delete* events means a DELETION: the opposite of persistence,
# raised the same alert as a backdoor. Those are dropped from the primary rules
# and kept only for the forensic timeline.
#
# The discriminator here is a console PASSWORD (not a key, not an admin policy)
# on a user, granted by a principal outside the onboarding allowlist.
title: IAM CreateLoginProfile by non-identity-admin principal
id: 4e03ddd5-625b-5d09-bd70-5e1c81c9f465
name: iam_create_login_profile_base
status: experimental
description: >-
  A console password was created for an IAM user by a principal outside the
  identity-administration allowlist.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-user-login-profile/
tags:
  - attack.persistence
  - attack.t1136.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'CreateLoginProfile'
  # REPLACE these with the roles in YOUR account that legitimately create IAM
  # users and login profiles. The placeholder values below match nothing, so
  # until they are edited this rule fires on every onboarding.
  identity_admin:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-identity-admin'
      - ':role/REPLACE-ME-onboarding'
      - ':role/REPLACE-ME-iac-deploy'
      - ':role/REPLACE-ME-break-glass'
  condition: selection and not identity_admin
falsepositives:
  - Help-desk password provisioning from roles not yet allowlisted
level: high
