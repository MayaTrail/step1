---
title: IAM create-console-user backdoor sequence
id: 8c2f5d04-3b69-4e72-a1d4-6a1c9b7e5f28
status: experimental
description: >-
  A net-new user given console access by the same principal within ten minutes,
  outside the onboarding pipeline.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-user-login-profile/
tags:
  - attack.persistence
  - attack.t1136.003
correlation:
  type: temporal_ordered
  rules:
    - iam_create_user
    - iam_create_login_profile_base
  group-by:
    - userIdentity.arn
  timespan: 10m
level: high
---
# THE ESCALATION. A console user with no policy attached is powerless; paired
# with a privilege grant it becomes a real threat. This pairing is what raises
# the incident from Medium to High.
title: IAM console access granted alongside a privilege grant
id: 5f9a2c31-7e40-4b86-93d5-1c8b0e64a7f2
status: experimental
description: >-
  A login profile was created and the same user was granted permissions within
  the window, a usable console identity rather than an empty account.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-user-login-profile/
tags:
  - attack.persistence
  - attack.t1136.003
correlation:
  type: temporal
  rules:
    - iam_create_login_profile_base
    - iam_user_privilege_grant
  group-by:
    - requestParameters.userName      # same TARGET user, not same caller
  timespan: 15m
level: critical
