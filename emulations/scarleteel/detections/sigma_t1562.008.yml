# FILE: sigma_t1562.008.yml
title: SCARLETEEL - CloudTrail Logging Disabled or Trail Deleted
id: 3f2c1582-6077-4997-88aa-ba53e6c6432e
status: stable
description: |
  Detects cloudtrail:StopLogging and cloudtrail:DeleteTrail, which SCARLETEEL uses
  to blind CloudTrail-based detections before lateral movement and persistence.
  This is a high-fidelity, single-event signal - there are very few legitimate
  reasons to stop or delete an active trail in a production account, and the
  action should be exempted only for a named break-glass principal. Because the
  emulation stops the stack's own single-region trail here, later phases
  (GetSecretValue, CreateFunction) are only visible to a separate org/management
  trail - make this alert route to an out-of-band pipeline (EventBridge -> SNS).
references:
  - https://sysdig.com/blog/cloud-breach-terraform-data-theft/
  - https://sysdig.com/blog/scarleteel-2-0/
  - https://attack.mitre.org/techniques/T1562/008/
author: MayaTrail
date: 2024/01/01
modified: 2026/08/15
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'cloudtrail.amazonaws.com'
    eventName:
      - 'StopLogging'
      - 'DeleteTrail'
  condition: selection
falsepositives:
  - Planned maintenance where a trail is explicitly paused and resumed by a break-glass role - allowlist that principal
  - Decommissioning of a superseded trail via change management
level: high
