# SCARLETEEL Phase 3, IAM Enumeration Burst (T1087.004)
#
# The signal is RATE, not occurrence. Individual IAM and S3 read calls are the
# most common events in any AWS account; twenty from one principal inside five
# minutes is automated privilege discovery. The deployable detection is the
# correlation document below; the base rule exists only to be referenced by it.
#
# The legacy Sigma v1 pipe form (`condition: selection | count() by ... > 20`
# with `timeframe:` inside `detection:`) was removed from the specification.
# pySigma rejects it and no current backend compiles it, so the rule as
# previously written could not be deployed anywhere.
title: SCARLETEEL cloud read API call
id: c3d4e5f6-3333-4ccc-b333-333333333333
name: scarleteel_enumeration_base
status: experimental
description: >-
  Base rule. Matches every IAM, S3 and Secrets Manager read call by design and
  is NOT intended for direct alerting, deploy the correlation that references
  it.
references:
  - https://sysdig.com/blog/cloud-breach-terraform-data-theft/
  - https://attack.mitre.org/techniques/T1087/004/
author: MayaTrail Security Research
date: 2024/01/01
tags:
  - attack.discovery
  - attack.t1087.004
  - attack.t1580
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource|contains:
      - 'iam.amazonaws.com'
      - 's3.amazonaws.com'
      - 'secretsmanager.amazonaws.com'
    eventName|startswith:
      - 'List'
      - 'Describe'
      - 'Get'
  condition: selection
level: low
---
title: SCARLETEEL Phase 3 IAM enumeration burst from a single principal
id: 62e90b4c-24f5-446c-98a5-36173c08f425
status: experimental
description: >-
  More than twenty IAM, S3 and Secrets Manager reads from a single principal
  within five minutes, consistent with automated privilege discovery after
  initial access. SCARLETEEL used stolen IMDSv1 credentials to enumerate users,
  roles, policies and buckets before disabling CloudTrail. Tune the threshold
  to your own baseline, scanners and CSPM agents sit well above it.
references:
  - https://sysdig.com/blog/cloud-breach-terraform-data-theft/
  - https://attack.mitre.org/techniques/T1087/004/
author: MayaTrail Security Research
date: 2024/01/01
tags:
  - attack.discovery
  - attack.t1087.004
  - attack.t1580
correlation:
  type: event_count
  rules:
    - scarleteel_enumeration_base
  group-by:
    - userIdentity.arn
  timespan: 5m
  condition:
    gt: 20
falsepositives:
  - Automated compliance scanning tools such as Prowler or ScoutSuite
  - Cloud Security Posture Management agents performing scheduled checks
level: medium
