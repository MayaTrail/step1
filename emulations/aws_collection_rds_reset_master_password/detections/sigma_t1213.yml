title: RDS Master Password Reset via ModifyDBInstance
id: a85325cd-3d9b-53d8-9cb1-50f0126f2d97
status: experimental
description: >
  Detects an attacker resetting the RDS master user password via ModifyDBInstance.
  CloudTrail records requestParameters.masterUserPassword as
  HIDDEN_DUE_TO_SECURITY_REASONS, making the field itself the detection signal.
  This is the primary indicator for RDS credential theft without requiring
  network access to the database instance.
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.DBInstance.Modifying.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.collection
    - attack.t1213
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: ModifyDBInstance
        requestParameters|contains: 'masterUserPassword'
    filter_legitimate_rotation:
        userIdentity.arn|contains:
            - 'secrets-rotation'
            - 'rds-rotation'
            - 'db-rotation'
    condition: selection and not filter_legitimate_rotation
falsepositives:
    - Scheduled secrets rotation lambda executing rds:ModifyDBInstance
    - DBA manually resetting password through AWS Console during an incident
    - Terraform/CDK pipeline applying a stack change that includes a password update
level: high
---
title: RDS Instance Reconnaissance via DescribeDBInstances from Assumed Role
id: 0d2baed1-9266-5683-a7e2-a13e308ec3c7
status: experimental
description: >
  Detects DescribeDBInstances calls issued by an assumed-role (AssumedRole
  identity type) session rather than a long-lived IAM user or service account.
  Attackers enumerate RDS instances to confirm the target identifier and
  available state before issuing rds:ModifyDBInstance for a master password
  reset. When chained with prior Secrets Manager access attempts from the
  same session, this constitutes a pre-attack reconnaissance sequence.
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DescribeDBInstances.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.collection
    - attack.t1213
    - attack.discovery
    - attack.t1580
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: DescribeDBInstances
        userIdentity.type: AssumedRole
    filter_known_monitoring:
        userIdentity.arn|contains:
            - 'cloudwatch-agent'
            - 'monitoring-role'
            - 'health-check'
            - 'rds-enhanced-monitoring'
    condition: selection and not filter_known_monitoring
falsepositives:
    - AWS Config rules performing compliance checks on RDS configuration
    - AWS Trusted Advisor running resource inventory
    - Authorized DBA tooling or dashboards querying instance metadata
    - RDS Proxy or Multi-AZ failover internal calls
level: low
