title: Secrets Manager Enumeration or Access Denied from Non-Rotation Principal
id: 1d43fb81-bab7-51c0-bbf2-a9d36b7b3bcf
status: experimental
description: >
  Detects ListSecrets or GetSecretValue calls from principals that are not
  authorized secrets-rotation or application service accounts, including
  AccessDenied variants. A denied call is itself a detection signal: it
  indicates a principal probing for credential stores it should not access.
  Commonly precedes an RDS master password reset chain (T1213).
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.collection
    - attack.t1213
    - attack.credential_access
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_list:
        eventSource: secretsmanager.amazonaws.com
        eventName: ListSecrets
    selection_get:
        eventSource: secretsmanager.amazonaws.com
        eventName: GetSecretValue
    filter_rotation:
        userIdentity.arn|contains:
            - 'secrets-rotation'
            - 'SecretsManagerRotation'
            - 'lambda-rotation'
    filter_app:
        userIdentity.arn|contains:
            - 'app-service-account'
            - 'application-role'
    condition: (selection_list or selection_get) and not (filter_rotation or filter_app)
falsepositives:
    - Developer or SRE accessing secrets manually during incident response
    - Authorized auditing scripts scanning secret inventory
    - CI/CD pipelines with broad secrets access for deployment
level: medium
---
title: STS AssumeRole into Database Management Role from Non-Standard Principal
id: 627a8662-1d94-5e4e-b070-a1267552d125
status: experimental
description: >
  Detects AssumeRole calls targeting a DB-management IAM role from a principal
  that is not the expected automation or application identity. This models the
  initial credential pivot step of an RDS master password reset chain (T1213),
  where an attacker uses ambient credentials to assume a victim role with
  rds:ModifyDBInstance before issuing the password reset. The RoleSessionName
  pattern 'atomic-rds-reset-master-password-session' is emulation-specific but
  any short-lived session from an unexpected caller warrants investigation.
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
author: MayaTrail
date: 2026/04/15
tags:
    - attack.collection
    - attack.t1213
    - attack.privilege_escalation
    - attack.t1078
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        requestParameters.roleArn|contains:
            - 'victim'
            - 'db-mgmt'
            - 'database-mgmt'
            - 'rds-admin'
    filter_known_automation:
        userIdentity.arn|contains:
            - 'pipeline-deployer'
            - 'ci-role'
            - 'terraform'
    condition: selection and not filter_known_automation
falsepositives:
    - Authorized cross-account database management tooling assuming the role
    - Break-glass access by an on-call engineer during a DB incident
    - Infrastructure-as-code deployment pipeline running stack updates
level: medium
