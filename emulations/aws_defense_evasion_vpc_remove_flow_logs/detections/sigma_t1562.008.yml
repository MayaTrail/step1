# Remove VPC Flow Logs (T1562.008)
#
# ec2:DeleteFlowLogs removes a VPC's flow log configuration. CloudTrail records
# the deleted IDs in requestParameters.DeleteFlowLogsRequest.FlowLogId. This is a
# rare, high-signal event: flow logs are set up once and almost never deleted in
# normal operations. Scope out your IaC teardown roles and alert on everything
# else.
title: VPC flow log configuration deleted
id: 3f9c2a71-6b48-4d5e-a1c7-9e02f4b8d631
status: experimental
description: >-
  Detects ec2:DeleteFlowLogs. Deleting flow logs removes network-layer
  visibility for the affected VPC(s) or ENIs, blinding detection of lateral
  movement, exfiltration and C2 over the network. Attackers disable logging
  before the noisy part of an intrusion.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.defense-evasion.vpc-remove-flow-logs/
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName: 'DeleteFlowLogs'
  # REPLACE with the roles in YOUR account that legitimately tear down flow logs
  # (IaC destroy pipelines). The placeholder matches nothing.
  iac_teardown:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-iac-destroy'
  condition: selection and not iac_teardown
falsepositives:
  - Infrastructure-as-code pipelines destroying a VPC and its flow logs.
  - Cost-optimisation cleanup of unused flow log configurations (should be change-managed).
level: high
