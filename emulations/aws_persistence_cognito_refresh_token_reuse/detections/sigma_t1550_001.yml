title: Cognito Refresh Token Reuse - Attacker Role AssumeRole
id: fbad8fa6-077d-50cf-9850-14667e3f5d5a
status: experimental
description: >
  Detects STS AssumeRole calls targeting IAM roles associated with Cognito
  refresh token reuse emulation or abuse scenarios. An attacker who has
  obtained a stolen Cognito refresh token out-of-band will first assume a
  role to establish their execution context (T1550.001). Look for AssumeRole
  events where the target role ARN contains naming patterns indicative of
  attacker-staged roles, combined with an unusual source IP or non-service
  caller type.
references:
  - https://attack.mitre.org/techniques/T1550/001/
author: MayaTrail
date: 2026/04/15
tags:
  - attack.credential_access
  - attack.t1550.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'sts.amazonaws.com'
    eventName: 'AssumeRole'
    requestParameters.roleArn|contains: 'cognito-refresh-token-reuse'
  filter_automation:
    userIdentity.sessionContext.sessionIssuer.type: 'Role'
    userIdentity.arn|contains: 'assumed-role/AWSServiceRole'
  condition: selection and not filter_automation
falsepositives:
  - CI/CD pipelines running Cognito integration tests against lab roles
  - Authorized red team exercises using attacker role naming conventions
level: high
---
title: Cognito Refresh Token Reuse - SSM Parameter Read for Cognito Config
id: 4d29d9d3-9052-576e-899d-80c394ad547b
status: experimental
description: >
  Detects SSM GetParameters calls targeting Cognito configuration parameters
  (pool ID, app client ID, user credentials) from an assumed attacker role
  session. Attackers targeting Cognito refresh token reuse commonly read
  SSM parameters to discover pool and client IDs needed to call InitiateAuth.
  When correlated with a preceding AssumeRole for an attacker-staged role,
  this sequence strongly indicates credential reconnaissance ahead of
  application access token abuse (T1550.001).
references:
  - https://attack.mitre.org/techniques/T1550/001/
  - https://attack.mitre.org/techniques/T1552/
author: MayaTrail
date: 2026/04/15
tags:
  - attack.credential_access
  - attack.t1550.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_api:
    eventSource: 'ssm.amazonaws.com'
    eventName: 'GetParameters'
  selection_path:
    requestParameters.names|contains:
      - '/atomic-cognito-refresh-token-reuse/'
      - 'cognito'
      - 'pool-id'
      - 'app-client'
  filter_known_automation:
    userIdentity.arn|contains:
      - 'AWSServiceRole'
      - 'lambda-execution'
      - 'ecs-task-execution'
  condition: selection_api and selection_path and not filter_known_automation
falsepositives:
  - Application deployment pipelines reading Cognito config from SSM at startup
  - Lambda functions resolving Cognito pool IDs from SSM at cold start
  - Developers running manual SSM reads during troubleshooting
level: medium
