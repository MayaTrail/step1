title: Cognito AdminUserGlobalSignOut - Session Revocation Indicator
id: c65bff07-bd12-58e8-a8d7-f41aeb157ded
status: experimental
description: >
  Detects Cognito AdminUserGlobalSignOut events, which invalidate all tokens
  for a user account. In a T1550.001 (Application Access Token) abuse scenario
  this event appears in two contexts: (1) as an incident-response action taken
  by defenders after detecting refresh token reuse, or (2) as an attacker
  action to disrupt the victim's sessions. Alerting on this event provides
  visibility into both the attack and the response phase. Correlate with
  preceding InitiateAuth REFRESH_TOKEN_AUTH events (if Cognito advanced
  security logging is enabled) or with the AssumeRole + SSM GetParameters
  sequence to distinguish defender response from attacker disruption.
references:
  - https://attack.mitre.org/techniques/T1550/001/
  - https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-access-token.html
author: MayaTrail
date: 2026/04/15
tags:
  - attack.credential_access
  - attack.t1550.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'cognito-idp.amazonaws.com'
    eventName: 'AdminUserGlobalSignOut'
  filter_known_service_accounts:
    userIdentity.arn|contains:
      - 'cognito-identity-pool-service-role'
      - 'svc-cognito-admin'
  condition: selection and not filter_known_service_accounts
falsepositives:
  - Legitimate incident response actions revoking compromised user sessions
  - Administrative user management workflows that perform periodic session cleanup
  - Automated account security tools that sign out inactive users
level: medium
