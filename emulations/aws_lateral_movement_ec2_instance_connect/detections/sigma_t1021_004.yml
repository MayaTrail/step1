# Usage of EC2 Instance Connect on Multiple Instances (T1021.004 / T1021.008)
#
# The original rule matched a bare `eventName: SendSSHPublicKey` with no
# eventSource and no other qualifier. Under-scoped rather than catastrophically
# noisy - the API is rare: but it could not distinguish an operator's
# break-glass access from an attacker, and it missed the fan-out that the
# technique is named for.
#
# KEY PROPERTY: the pushed key is ephemeral - valid for ~60 seconds, and it
# leaves NO artifact in the instance's authorized_keys. Auditing host key files
# after the fact finds nothing. Detection must be control-plane (this rule)
# plus network (Flow Logs inbound 22).
title: EC2 Instance Connect key push by non-operator principal
id: 7f96b467-df80-5c3b-b473-20becf024b5f
name: eic_sendsshkey_base
status: experimental
description: >-
  An ephemeral SSH public key was pushed to an instance by a principal outside
  the operator allowlist. Fires on a single instance, one push is enough to
  obtain an interactive shell.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.lateral-movement.ec2-instance-connect/
tags:
  - attack.lateral_movement
  - attack.t1021.004
  - attack.t1021.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2-instance-connect.amazonaws.com'
    eventName: 'SendSSHPublicKey'
  # REPLACE these with the roles in YOUR account that legitimately push SSH
  # keys through EC2 Instance Connect. The placeholder values below match
  # nothing, so until they are edited this rule fires on every operator
  # connection.
  operators:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-ssm-operator'
      - ':role/REPLACE-ME-break-glass'
  condition: selection and not operators
falsepositives:
  - Engineers using Instance Connect outside the operator role, tune the
    allowlist rather than removing the rule
level: high
---
# The sweep the technique is named for. Threshold is 2, not 3: pushing a key to
# even two instances in a quarter hour is not how administration works.
title: EC2 Instance Connect fan-out across instances
id: 6c1a8f42-3b70-4e95-a2d1-9f0c7b6e5a83
status: experimental
description: >-
  One principal pushed SSH keys to two or more distinct instances within
  fifteen minutes, lateral movement across the fleet.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.lateral-movement.ec2-instance-connect/
tags:
  - attack.lateral_movement
  - attack.t1021.008
correlation:
  type: value_count
  rules:
    - eic_sendsshkey_base
  group-by:
    - userIdentity.arn
  timespan: 15m
  condition:
    gte: 2
    field: requestParameters.instanceId    # distinct target instances
level: critical
---
# The EIC Endpoint variant. OpenTunnel reaches instances in PRIVATE subnets
# with no public IP and no bastion: a rule watching only SendSSHPublicKey
# misses this path entirely.
title: EC2 Instance Connect Endpoint tunnel opened
id: 9a35f7c0-4e82-4b19-8d67-2c0b5a7e93f4
status: experimental
description: >-
  A tunnel was opened through an EC2 Instance Connect Endpoint, providing
  network reachability to instances without public exposure.
references:
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Connect-using-EC2-Instance-Connect-Endpoint.html
tags:
  - attack.lateral_movement
  - attack.t1021.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2-instance-connect.amazonaws.com'
    eventName: 'OpenTunnel'
  # REPLACE these with the roles in YOUR account that legitimately push SSH
  # keys through EC2 Instance Connect. The placeholder values below match
  # nothing, so until they are edited this rule fires on every operator
  # connection.
  operators:
    userIdentity.arn|contains:
      - ':role/REPLACE-ME-ssm-operator'
      - ':role/REPLACE-ME-break-glass'
  condition: selection and not operators
falsepositives:
  - Approved private-subnet access paths, allowlist the principal
level: high
