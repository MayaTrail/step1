- name: CRS SSRF EC2 Metadata URI Path
  priority: P2
  type: logs_threshold
  mitre: T1552.005/TA0006
  query: |
    action:"ALLOW" AND labels_field_extracted.keyword:/.*EC2MetaDataSSRF_URIPath.*/
  threshold: 0.0  window: 5m
  group_by: ['httpRequest.clientIp']

