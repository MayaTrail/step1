  - attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource:
      - 'ecr.amazonaws.com'
      - 'ecr-public.amazonaws.com'
    eventName: 'BatchGetImage'
  success:
    errorCode: null
  condition: selection and success
level: informational
