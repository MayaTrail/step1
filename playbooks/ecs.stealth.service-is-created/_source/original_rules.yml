- name: Amazon ECS - Service Is Created
  priority: P3
  type: logs_immediate
  mitre: T1578/TA0005
  query: |
    eventSource:"ecs.amazonaws.com" AND eventName:"CreateService" AND NOT _exists_:errorCode
  group_by: []

