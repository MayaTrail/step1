- name: Amazon Route53 Audit - Multiple DNS Zones Deleted by a Single User
  priority: P2
  type: logs_unique_count
  query: |
    eventSource:"route53.amazonaws.com" AND eventName:"DeleteHostedZone" AND NOT _exists_:errorCode
  threshold: 5  window: 10m
  unique_count_key: requestParameters.id
  group_by: ['userIdentity.arn']
