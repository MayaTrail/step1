- name: Amazon ECS - UpdateService with High DesiredCount
  priority: P3
  type: logs_immediate
  mitre: T1496/TA0040
  query: |
    eventSource:"ecs.amazonaws.com" AND eventName:"UpdateService" AND requestParameters.desiredCount.keyword:/\d{4}/
  group_by: []

