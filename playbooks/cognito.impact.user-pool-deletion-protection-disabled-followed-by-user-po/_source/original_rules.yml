# Source rules — de-identified extract
#
# The originals are internal alert definitions in a proprietary packaging format.
# Everything below is DETECTION LOGIC only: name, priority, type, query, threshold,
# window and group-by. Platform scaffolding has been stripped — payload field lists,
# entity labels, product-specific field prefixes, internal enums and packaging
# metadata — because none of it bears on whether the rules are correct and it
# identifies the source.
#
# This is the artifact the 'Detection Rule Quality Notes' table in ../PLAYBOOK.md
# is auditable against.

- name: User Pool Deletion Detected
  priority: P3
  type: logs_threshold
  mitre: T1485/TA0040
  query: |
    event_name:"DeleteUserPool" AND NOT _exists_:errorCode
  threshold: 0.0  window: 10m
  group_by: ['userIdentity.arn', 'requestParameters.userPoolId']

- name: User Pool Deletion Protection Disabled Followed by User Pool Deletion
  priority: P1
  type: flow
  mitre: T1485/TA0040
  flow_stage: (12)  timeframeMs: 0
  flow_stage: (5)  timeframeMs: 1800000
  group_by: ['requestParameters.userPoolId']

- name: User Pool Deletion Protection Disabled
  priority: P3
  type: logs_threshold
  mitre: T1485/TA0040
  query: |
    event_name:"UpdateUserPool" AND requestParameters.deletionProtection:"INACTIVE" AND NOT _exists_:errorCode
  threshold: 0.0  window: 10m
  group_by: ['userIdentity.arn', 'requestParameters.userPoolId']

