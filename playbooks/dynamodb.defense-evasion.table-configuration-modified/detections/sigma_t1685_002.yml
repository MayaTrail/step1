  service: cloudtrail
detection:
  selection:
    eventSource: 'dynamodb.amazonaws.com'
    eventName: 'UpdateTable'
  success:
    errorCode: null
  autoscaling:
    userAgent|contains: 'autoscaling.amazonaws.com'
  condition: selection and success and not autoscaling
