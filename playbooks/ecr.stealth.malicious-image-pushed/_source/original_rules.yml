# Source rules — de-identified extract
#
# The originals are internal alert definitions in a proprietary packaging format.
# Everything below is DETECTION LOGIC only: name, priority, type, query, threshold,
# window and group-by. Platform scaffolding has been stripped — payload field lists,
# entity labels, product-specific field prefixes, internal enums and packaging
# metadata — because none of it bears on whether the rules are correct and it
# identifies the source.
#
# This is the artifact the 'Detection Rule Quality Notes' table in ../PLAYBOOK.md
# is auditable against.

- name: Excessive ECR Image Pushed
  priority: building-block
  type: logs_threshold
  mitre: T1578/TA0005
  query: |
    eventSource:("ecr.amazonaws.com" OR "ecr-public.amazonaws.com") AND eventName:"PutImage" AND userIdentity.type:"iamuser" AND NOT userIdentity.arn:"<one-named-operator-principal-REDACTED>" AND NOT _exists_:errorCode
  threshold: 5.0  window: 15m
  group_by: ['userIdentity.arn']

- name: Repository Created
  priority: P4
  type: logs_threshold
  mitre: T1525/TA0003
  query: |
    eventSource:"ecr.amazonaws.com" AND eventName:"CreateRepository" AND userIdentity.type:("IAMUser" OR "<automation-role>") AND NOT userIdentity.arn:"<one-named-operator-principal-REDACTED>" AND NOT _exists_:errorCode AND NOT "TLSv1.3"
  threshold: 0.0  window: 10m
  group_by: ['userIdentity.arn']
