# Source rules — de-identified extract
#
# The originals are internal alert definitions in a proprietary packaging format.
# Everything below is DETECTION LOGIC only: name, priority, type, query, threshold,
# window and group-by. Platform scaffolding has been stripped — payload field lists,
# entity labels, product-specific field prefixes, internal enums and packaging
# metadata — because none of it bears on whether the rules are correct and it
# identifies the source.
#
# This is the artifact the 'Detection Rule Quality Notes' table in ../PLAYBOOK.md
# is auditable against.

- name: Public Access Block Has Been Deleted
  priority: P3
  type: logs_immediate
  mitre: none
  query: |
    eventName:"DeletePublicAccessBlock" AND eventSource:"s3.amazonaws.com" AND NOT _exists_:errorCode
  group_by: []

- name: Public Access Block Has Been Created/Modified
  priority: P4
  type: logs_immediate
  mitre: none
  query: |
    eventName:"PutPublicAccessBlock" AND eventSource:"s3.amazonaws.com"AND NOT (requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets:false OR requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy:false OR requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls:false OR requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls:false)
  group_by: []

- name: Access Logging Has Been Disabled
  priority: P2
  type: logs_immediate
  mitre: none
  query: |
    eventSource:"s3.amazonaws.com" AND eventName:"putbucketlogging" AND NOT _exists_: "requestParameters.BucketLoggingStatus.LoggingEnabled" AND NOT _exists_:errorCode
  group_by: []

- name: Public Access Block Has Been Removed
  priority: P2
  type: logs_immediate
  mitre: none
  query: |
    eventName:PutBucketPublicAccessBlock AND (requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets:false OR requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy:false OR requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls:false OR requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls:false)
  group_by: []

- name: Bucket Policy Has Been Made Public
  priority: P2
  type: logs_immediate
  mitre: none
  query: |
    requestParameters.bucketPolicy.bucket_made_public:true AND eventName:PutBucketPolicy
  group_by: []

- name: Bucket ACL Has Been Configured
  priority: P3
  type: logs_immediate
  mitre: none
  query: |
    eventName:"PutBucketAcl" AND eventSource:"s3.amazonaws.com" AND NOT _exists_:errorCode
  group_by: []

- name: Bucket Policy Has Been Deleted
  priority: P4
  type: logs_immediate
  mitre: none
  query: |
    eventName:"DeleteBucketPolicy" AND eventSource:"s3.amazonaws.com" AND NOT _exists_:errorCode
  group_by: []

