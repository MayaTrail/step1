name: Build and push images

# Phase 2a of the EC2 deploy pipeline: build the application images in CI and
# push them to GHCR, so the enterprise instances pull a tested image instead of
# building on the host. This workflow only builds and pushes; it does not deploy
# (that is Phase 2c). The scout image is published from its own repository.
#
# Tags, generated by docker/metadata-action:
#   - every push to main          -> sha-<full commit sha>  (immutable, deployable, for rollback)
#   - every push of a v* git tag  -> v<version> and v<major>.<minor>  (a named release)
# There is no moving latest tag: a deploy always names a sha or a version, so
# what is running is never ambiguous. beat is not built; it runs the backend image.
#
# The packages are private by default. Grant mayatrail developers and
# contributors read access to each package in its GHCR settings.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A later merge should not cancel an in-flight build: every commit on main keeps
# its own image so any of them can be redeployed.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: step1-backend
            context: ./backend
            file: ./backend/Dockerfile
            build_args: ""
          - image: step1-worker
            context: ./backend
            file: ./backend/Dockerfile.worker
            build_args: ""
          - image: step1-ui
            context: ./frontend/UI
            file: ./frontend/UI/Dockerfile
            # Public, baked into the SPA at build time. Set the repository
            # variable VITE_GOOGLE_CLIENT_ID to enable the Google sign-in button;
            # left unset it falls back to frontend/UI/.env inside the build.
            build_args: VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        # emulations/_kb is a private submodule unrelated to the image builds.
        with:
          submodules: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mayatrail/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs to keep builds fast.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
